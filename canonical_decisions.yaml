DEC-make-dialect:
  status: decided
  question: The owner wants a Makefile as each project's front door and wants Makefiles canonically commented and checked like any other source. grammars-v4 has no Makefile grammar. What is the dialect?
  answer: |
    canon's own, written canonically commented from the start under grammars/make/canonically_commented/: GNU make as a line language, with a canonical comment opening with a hash and a bar and continuing on following hash lines, as the Haskell dialect's opens with two dashes and a bar. A rule with a plain target is a unit of kind rule that requires the comment, its target the What and its recipe the How; a special target such as .PHONY, a pattern rule, and a variable are units whose comment is optional. The one-line help text after two hashes on a rule line stays as the What the help target prints. The language is declared as make with the extension Makefile, which the walk matches as a suffix. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0

DEC-highlight-by-lexer:
  status: decided
  question: The owner wants code coloured per language on the pay page and the site, as GitHub does. What does the colouring?
  answer: |
    The language's own lexer, the one canon already interprets, so every language canon reads is covered and nothing outside the repository is trusted. Tokens are classified into keyword, comment, string, number, type, meta, name, and plain, generically from the grammar's shape: a rule whose every alternative is one alphabetic literal is a keyword, a hidden or doc token a comment, names beginning STRING or DECIMAL and the like say what they are, an uppercase word is a type, and a pragma's bracketed run is meta; a profile's highlight map assigns what the shape does not say. Text the lexer skipped is a comment when it holds anything but whitespace, and a text the lexer refuses is plain. The pieces of a line tile it exactly, so a renderer only paints them; the site paints its fenced blocks by the fence's language word, and Rice's Tax sends the classes beside the lines. The palette is GitHub's, light and dark. The copied plain text stays plain. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-lawspec-parity:
  status: decided
  question: LawSpec emits code in a set of target languages and canon is to read and judge the documentation of every one of them. How does the repository say which languages those are, and keep its grammars, profiles, dialects, and samples in step with the list?
  answer: |
    The root canon.yaml carries a parity section that canon does not read, as it carries runtime: current names the targets LawSpec emits today (python, javascript, typescript, go, java, kotlin, rust, haskell) and planned the ones it is to emit (erlang, elixir, gleam, csharp, fsharp, scala, groovy, clojure, prolog, hcl, yaml) together with the languages canon's own sources and pages are written in (antlr4, make, folio). Canon.ParityTest asserts that each listed language has a grammar under grammars/, a profile in some project's canon.yaml naming that grammar, a canonically_commented dialect beside it, and a sample project, the root counting for the languages canon is written in, and that no grammar directory is outside the list. A piece another branch delivers is named under pending, so the test passes on a branch that lacks it and fails both when a piece is missing and unnamed and when a named piece exists, which makes the merge that delivers it remove the entry.
  opened: 0.1.0
  decided: 0.1.0
  refs: [REQ-lawspec-parity]

DEC-calm-ingestion:
  status: decided
  question: Rice's Tax documents architecture in CALM 1.2 JSON descriptions alongside code and wants each node, relationship, and flow vetted like a unit of code. canon reads languages through grammars, and JSON has no comments to carry a Why. How does canon read a CALM description?
  answer: |
    Through a profile named calm whose grammar is any JSON grammar, as Rice's Tax ships one in its presets, and an extractor of its own, Canon.Extract.Calm, chosen by the language name because CALM's units are fixed by its schema rather than by a grammar's labels. The extractor requires the CALM 1.2 $schema, refuses repeated unique-ids, dangling node and relationship references, unknown node types, and duplicate keys rather than reading a description in part, and makes every node, relationship, and flow a required unit named by its unique-id, under the file, with its description as its Why, so ref:KEY in a description cites the registry as a comment does. Interfaces, controls, decorators, and external references stay in the unit's How. canon ships no JSON grammar of its own, since no LawSpec target is JSON; the tests read a description through an inline one.
  opened: 0.1.0
  decided: 0.1.0
  refs: [calm-1-2, rices-tax, REQ-calm-ingestion]
