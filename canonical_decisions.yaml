DEC-parser-foundation:
  status: decided
  question: Which parsing foundation should canon use to read and interpret ANTLR4 grammars, given that antlr-haskell was the obvious candidate?
  answer: |
    grammatical-parsers for the hand-written .g4 reader, and a direct interpreter for grammars loaded at run time.

    antlr-haskell 0.1.0.2 was evaluated on 2026-09-12 against Stackage LTS 24.58 with GHC 9.10.3 and rejected: it does not build there, it supplies grammars only through a quasiquoter rather than from .g4 files, its own test for the grammars-v4 C grammar is commented out, and open issues cover the skip command, grouping, and left recursion elimination. Earley is in the snapshot but unreleased since 2019. A hand-written packrat core would have had to be built and tested before anything else.

    grammatical-parsers is actively maintained, tested on GHC 9.10, and represents a grammar as a first-class Rank2 record. The .g4 reader is a single scannerless grammar record on its PEG packrat backend, which makes ANTLR's LexerAdaptor unnecessary because the grammar always knows whether it is inside a parser rule or a lexer rule.

    Loaded grammars are interpreted directly instead, because a Rank2 record's field set is fixed at compile time and an interpreted grammar's rule set is known only at run time. The lexer takes the longest match with ANTLR's tie-breaking and exits non-greedy loops at the first iteration count that lets the rest match; the parser is a memoised all-parses parser whose first complete parse by alternative order wins, with left recursion handled by iterating each cyclic rule group at a position to a fixpoint. Semantic predicates are answered by a parser hook keyed by superClass and hold where no hook knows them, as DEC-parser-predicates records. Lexer actions go through a hook interface keyed by superClass. The memo table is filled as entries are asked for, as DEC-parser-memory records.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grampa-2017, warth-2008, antlr-haskell, grammars-v4]

DEC-canonical-antlr4-dialect:
  status: superseded
  by: DEC-grammar-carries-extraction-rules
  question: What does the canonically commented dialect of the ANTLR meta-grammar look like?
  answer: |
    Three changes to the upstream meta-grammar: doc comments stay on the default channel, a parser rule must be preceded by a doc comment, and a non-fragment lexer rule must be preceded by one while a fragment may be. Every rule in both dialect files carries a doc comment, so the dialect parses its own grammars and rejects the upstream file.
  opened: 0.1.0
  decided: 0.1.0
  refs: [canon-provisional-syntax]

DEC-decision-ledger:
  status: decided
  question: How are decisions tracked so that the list of open ones cannot go stale?
  answer: |
    Decisions live in canonical_decisions.yaml, keyed like registry references so a comment cites one with ref:KEY. Entries are never deleted; status moves from open to decided or superseded. An open decision names the version by which it must be revisited, and canon check fails once the project version reaches it. A decided decision that no canonical comment cites is reported, informationally until Haskell code units exist. Prose decision records in to_be_removed were migrated into this ledger.
  opened: 0.1.0
  decided: 0.1.0

DEC-precedence-climbing:
  status: decided
  question: Should the interpreter rewrite directly left-recursive rules into precedence levels as ANTLR does, so that expression grammars from grammars-v4 give ANTLR's trees rather than the first parse by alternative order?
  answer: |
    Yes. A directly left-recursive rule is interpreted with ANTLR's precedence climbing: alternatives are classified as primary, prefix, binary, or suffix; earlier alternatives bind tighter; a binary alternative's right operand is parsed at the next higher precedence unless the alternative carries assoc=right; a prefix operand is parsed at the alternative's own precedence. This removed an exponential blow-up on the R grammar's expression rule, which timed out before and parses in under a second after. Indirect left recursion, which ANTLR rejects, still goes through the fixpoint path.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-comment-attachment:
  status: open
  question: The extractor binds a doc comment to the rule on the line directly below it, while the canonical dialect grammar binds it to the next rule regardless of blank lines because whitespace is off channel. Which notion is canonical, and does the same rule hold for Haskell and other languages?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [canon-provisional-syntax]

DEC-version-duplication:
  status: open
  question: canon.yaml carries the project version that package.yaml also carries, and only canon.yaml can carry a semantic versioning pre-release label. Should canon read the numbers from package.yaml, or check the two agree?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [semver-2]

DEC-cabal-file:
  status: open
  question: canon.cabal is ignored and regenerated from package.yaml by stack. Should it be committed so plain cabal users can build without hpack?
  opened: 0.1.0
  revisit: 0.2.0

DEC-sample-project-readme:
  status: open
  question: Rule 2 treats each directory under sample_projects as its own project with its own README.md. That reading was an assumption, not an instruction. Is it right?
  opened: 0.1.0
  revisit: 0.2.0

DEC-nested-root-check:
  status: decided
  question: canon check at the repository root includes the sample projects, which are upstream code that is not canonically commented, so the root check always fails. Should nested projects be included by default, reported separately, or opted into?
  answer: |
    Excluded. A nested project is a boundary: the enclosing project's check stops at it, canon files lists it, and checking it is a separate run from its own directory with its own configuration, registry, ledger, and vetting file. A project answers for itself and nothing else, so the root check reports canon's own state and each sample reports its own.
  opened: 0.1.0
  decided: 0.1.0

DEC-grammar-coverage-findings:
  status: open
  question: Files that an upstream grammar cannot lex or parse are reported as failed extractions alongside missing comments. Should grammar coverage gaps be a separate, informational finding so that canonical-comment findings stay clean?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [grammars-v4]

DEC-one-tree-per-span:
  status: decided
  question: The parser enumerated every derivation of every span, which is exponential on ambiguous grammars and exhausted memory on the Haskell grammar. What does the parser keep?
  answer: |
    One tree per rule, start position, and end position, the first in preference order: alternatives in grammar order, greedy loops longest first, precedence climbing for left recursion. Recognition is unchanged because every reachable end position is kept, so no parse is lost; only alternative derivations of the same span are dropped. A 10 KB Haskell module parses in about ten seconds within half a gigabyte where it previously ran out of memory.
  opened: 0.1.0
  decided: 0.1.0

DEC-extraction-cache:
  status: decided
  question: How does canon check avoid re-parsing files that have not changed?
  answer: |
    Each file's extraction is cached under .canon-cache/ in the project directory as YAML, keyed by a SHA-256 of the file content, the grammar sources and profile it was parsed with, the git revision, the file's dirty state, the project's git describe output and full tag list, the version in canon.yaml, and canon's own version, and the path. Every input that reaches the model is in the key, so a cache hit is exact; the tag list is included because a tag added on an older commit changes the version a unit was introduced in without changing HEAD or describe. The directory is ignored by the walk and by git and can be deleted at any time; a miss simply parses.
  opened: 0.1.0
  decided: 0.1.0

DEC-parser-generation:
  status: decided
  question: Is the parser hand-tuned per language, or generated from the grammar?
  answer: |
    Generated. Both the lexer and the parser are compiled once from the grammar value with no per-language code: decoded literals, character predicates, and first-character filters for the lexer; FIRST sets, nullability, precedence shapes, and vector memo tables for the parser. The only per-language code is a lexer hook for grammars whose upstream base lexer runs target-language actions, selected by the grammar's superClass option. Profiling the largest Haskell sample after these changes puts the parser under one percent of the time and the lexer's matching functions at nearly all of it, so further speed comes from a lexer DFA, not from the parser.
  opened: 0.1.0
  decided: 0.1.0

DEC-comment-reasons:
  status: decided
  question: What are the reasons a canonical comment exists, and where does a file-level comment such as a license notice attach?
  answer: |
    Three reasons: Why, a reason in prose; Ref, a pointer into the registry written ref:KEY; and License, a pointer to a registry entry of kind license written license:KEY. A doc comment at the top of a file, on its first non-blank line, is the file-level canonical comment and binds to the file unit, which for a grammar is the grammar itself. A comment that reads like a license or copyright notice but cites no license key is reported informationally, and a license key that resolves to a non-license registry entry fails the check. The canonically commented meta-grammar allows a doc comment before the grammar declaration for this purpose, and its own files carry their BSD notice there.
  opened: 0.1.0
  decided: 0.1.0

DEC-grammar-carries-extraction-rules:
  status: decided
  question: Where do the rules for slurping the five W's and the H out of a canonically commented file live, and what is the difference between a language's plain grammar and its canonically commented grammar?
  answer: |
    In the canonically commented grammar. The plain files under grammars/<lang>/ are the language's own grammar, with its rules as upstream publishes them, carrying a canonical comment on every unit the language requires one on. The files under grammars/<lang>/canonically_commented/ are the plain grammar plus the rules that define canonical comments and locate the answers: a canonical comment is tokenized in its own lexer mode into prose, ref:KEY citations, and license:KEY citations, and a parser rule alternative labeled with a hash names a unit kind, with element labels why, what, and how marking the comment, the name, and the body. canon generates the extraction parser from that grammar, so a unit is any node whose alternative is labeled, its What is the what-labeled text, its Why is the why-labeled comment, its How is the how-labeled span or the whole node, and the comment is required when the why element has no optional suffix or the node holds an element labeled required. The Java dialect names canonicalComment in a strayComment option, so a Javadoc comment inside an expression or between arguments is read as an orphan where the parse fails at it or just after it, as DEC-stray-comments records. The ANTLR meta-grammar is the first language done this way: grammarDefinition, parserRule, lexerRule, fragmentRule, and lexerMode are its unit kinds. The hand-written ANTLR extractor and the separate canonical grammar entry in canon.yaml were removed; the line-adjacency profile path remains for languages whose dialect grammars do not exist yet. The meta-grammar's dialect takes an optional comment on every rule and holds the empty rule documentedRule, labeled required, on a parser rule and a non-fragment lexer rule, so a grammar without canonical comments parses and each missing comment is reported; of several comments in a row the last binds and the others are orphans, /**/ is a plain comment, and the parser names canonicalComment in a strayComment option. Because canon's lexer backtracks, the plain and dialect lexers give every text inside an action one reading: a line comment runs to its line break, a slash that opens no comment is its own alternative, an escape is a backslash and one character, and a quoted string may span lines as the ANTLR tool's ACTION_STRING_LITERAL and ACTION_CHAR_LITERAL do. Over grammars-v4 at 7df52be, tools/corpus/antlr4.sh parses 1,152 of 1,154 grammars with both, the other two being the meta-grammar test's negative fixtures LexerElementLabel.g4 and three.g4, and all of canon's own; the slowest, PlSqlParser.g4, takes 5.3 seconds alone.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-comment-vetting:
  status: decided
  question: When canon is introduced to an existing codebase, how does an existing comment become trusted, who judges it, and what happens while it is unjudged?
  answer: |
    Rule 7. Every canonical comment gets an entry in canonical_vetting.yaml keyed by its decision id, holding a verdict and a digest of the comment text. canon ingest writes pending entries for every comment without one. A human sets good, bad, or deferred with a revisit version, and commits; the assessor is the author of the commit that last touched the verdict line, read with git blame, so the file never names a person and cannot lie about one. Pending is a state, but an invalid one for the report: canon check fails every pending, stale, bad, or overdue comment and prints that the report is invalid while any comment is pending. A verdict applies to the digested text only, so a rewritten comment is pending again, and a comment without an entry is pending once the file exists, which makes the author of a new comment its first assessor.
  opened: 0.1.0
  decided: 0.1.0

DEC-required-orphan-labels:
  status: superseded
  by: DEC-marker-label
  question: How does a canonically commented grammar say that a comment is required only under some condition, such as Java's public modifier, and how does it accept a doc comment it does not bind?
  answer: |
    Two more element labels. A match containing an element labeled required has a required comment, so the Java dialect writes required = PUBLIC among a member's modifiers and required = interfaceMethodDeclaration for interface members. An element labeled orphan is a comment the grammar accepts but binds to nothing; the extractor reports it as an orphan doc comment. An alternative is a unit alternative only when its label comes with a why element, so upstream labels such as Java's expression alternatives are inert; without that rule the extractor treated every expression as a possible unit and was exponential in nesting depth.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-java-grammar-comments:
  status: decided
  question: The plain Java grammar under grammars/java/ carries no canonical comment on its own rules, unlike the ANTLR meta-grammar; who writes those comments, and until then is it right to ignore the Java dialect at the root?
  answer: |
    Written on 2026-09-15: every parser rule and every non-fragment lexer rule of the plain Java grammar carries a canonical comment, and the BSD header is its file-level comment with a license citation. The dialect is generated from the plain grammar and carries the same comments, extended on the rules that gained unit labels to say what they bind. Both are checked at the root like the ANTLR meta-grammar. Fragment rules stay uncommented, as in the meta-grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-tests-not-exempt:
  status: decided
  question: Public test methods require a canonical comment under the Java dialect; should test sources be exempt?
  answer: |
    No. A test exists because of a particular requirement, and that requirement is its Why: the canonical comment on a test cites the requirement it verifies with ref:KEY against a registry entry of kind requirement. The samples record the same decision in their own ledgers. How canon recognises a test unit so that it can insist on a requirement citation is a separate open decision.
  opened: 0.1.0
  decided: 0.1.0

DEC-test-requirement-check:
  status: decided
  question: A test's canonical comment must cite the requirement it verifies; how does canon recognise a test unit in each language, given that a grammar cannot match an annotation by name, so that it can report a test whose comment cites no requirement?
  answer: |
    The grammar says where markers sit and canon says which markers mean test. A canonically commented grammar labels annotations among a unit's modifiers with marker, and canon carries a fixed table per language name. For java: the JUnit 4 and 5 markers @Test, @org.junit.Test, @org.junit.jupiter.api.Test, @ParameterizedTest, @RepeatedTest, @TestFactory, and @TestTemplate, and the jqwik markers @Property, @Example, @net.jqwik.api.Property, and @net.jqwik.api.Example, each on a method, plus a method named test* under any src/test directory for JUnit 3; jetCheck has no annotations of its own, its property checks run inside JUnit test methods, so those are recognised by the JUnit markers. For erlang: a function named *_test or *_test_. For clojure: a deftest unit, or a definition named *-test. For prolog: a clause named test. For haskell: a function named prop_* or test_*. A marker matches when it equals the entry or is the entry followed by an argument list. A test unit carries test: true in the model and always requires a canonical comment. Two checks fail canon check: a commented test that cites no registry entry of kind requirement, and a requirement that no test in the project cites. The table is canon's knowledge as of 2026-09-15 and grows by decision.
  opened: 0.1.0
  decided: 0.1.0

DEC-marker-label:
  status: decided
  question: Which element labels does a canonically commented grammar use beyond why, what, and how, and what makes an alternative a unit?
  answer: |
    Four things. An alternative labeled with a hash is a unit alternative only when it contains a why element, so upstream labels such as Java's expression alternatives are inert. An element labeled required makes the comment required when it is present, which is how public makes a Java member's comment required and how interface members are required outright. An element labeled orphan is a comment the grammar accepts but binds to nothing, reported as an orphan doc comment. An element labeled marker is an annotation or similar mark on the unit, whose text canon reads to recognise tests. This supersedes DEC-required-orphan-labels by adding marker.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-name-what-comment-why:
  status: decided
  question: When a test's Javadoc says what it verifies, where does the What belong and what is left for the comment?
  answer: |
    Rule 8. The name is the What and states the fact the unit establishes in full words, so a test is named for the property it verifies. The comment is the Why and says why that fact must hold, citing the requirement or decision that records the reason. A comment that restates the name fulfils no purpose the name does not and is vetted bad. canon cannot judge this by Rice's theorem; the vetting human does. Worked example: Gson's testReflectionInternalField became verifyThatGsonPackagesAreOnlyExportedButNotOpenedForReflection with a comment giving the reason and citing REQ-module-not-opened in the sample's registry.
  opened: 0.1.0
  decided: 0.1.0

DEC-haskell-dialect:
  status: decided
  question: What does the canonically commented dialect of the Haskell grammar look like, and how does it coexist with the layout algorithm the base lexer port implements?
  answer: |
    The canonical comment forms are Haddock's: a line comment opened with two dashes and a bar, continued by directly following lines that start with two dashes, or a block comment opened with a brace, dash, and bar. Caret after-comments and plain comments are not canonical. The dialect lexer sends the doc opener into a DocLine or DocBlock mode that tokenizes prose, ref:KEY, and license:KEY; the line break that ends a doc line keeps the NEWLINE type and the newline action so the layout algorithm and the parser see it as usual. The dialect parser inlines each unit-bearing top-level form as its own labeled alternative with why, what, and how, labels export-list entries export, and absorbs a doc comment on a local binding, an instance method, or a constructor as an orphan. Two doc comments on consecutive lines merge, as Haddock also reads them. The base lexer port holds doc tokens until the next code token has produced its virtual braces and semicolons, then emits them just before it, so a doc comment never counts as the first token of a line and sits inside the block of the declaration it documents; it also dispatches lexer actions by the method they call rather than by rule name, so the dialect's DOC_CLOSE can carry the newline action. A doc comment the grammar does not accept where it stands, as inside an expression, between arguments, before a case alternative, or at the end of a do block, is read out of the file and reported as an orphan, because the parser grammar names canonicalComment in a strayComment option, by DEC-stray-comments. A doc comment in the export list or on a record field is read in place as an orphan. The base lexer port ends each held doc comment with an empty DOC_END token, declared in the lexer's tokens block, so the comment rule has one end.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-export-rule:
  status: decided
  question: Which Haskell units require a canonical comment, given that a module's public API is its export list and a grammar can label the list but not cross-reference it?
  answer: |
    The exported ones. A dialect that labels export-list entries export opts into the rule: a unit is required when its What is an exported name, is listed under its parent's entry, or its parent is exported with two dots; when the file has no export list, every unit whose What is a plain name is required. An instance's What is its head, which is not a name, so an instance never requires a comment by this rule. The grammar's own required labels and test recognition still apply. Erlang's export attribute is the next user of the mechanism.
  opened: 0.1.0
  decided: 0.1.0

DEC-haskell-grammar-fixes:
  status: decided
  question: The grammars-v4 Haskell grammar could not parse thirty-five of canon's own seventy-seven Haskell files; is it right to change the vendored grammar, and how?
  answer: |
    Yes, where the grammar rejects Haskell that GHC accepts, and each change is commented in the grammar and cited here. Character and string literals are written in the standard form with escapes and gaps; inside a string an escape is read by its first character only, so a string of numeric escapes lexes in linear time. The contextual keywords by, group, using, pattern, family, role, and rec, and unsafe, safe, and interruptible, are accepted as variable identifiers, and pragma names such as SCC as constructor identifiers. A whole pragma is one hidden token. A C preprocessor directive at the start of a line is one hidden token, and the base lexer port reads #if, #ifdef, #ifndef, #elif, #else, and #endif with Canon.Preprocessor, hiding the branches a build does not read; a condition it cannot evaluate holds, so the first branch is read, defined(X) is X, and a zero is false. Macros are not expanded and includes are not read. Operators are read by maximal munch, qualified operators included, and a reserved operator wins its tie. The character classes are single sets by Unicode general category. Literals take NumericUnderscores, binary digits, and MagicHash suffixes, and EXPONENT is a fragment. Block comments nest. A quasi-quotation is one token where a pragma enables QuasiQuotes, and [e| is an expression quotation. A module body may be empty. Imports take safe, a package name, and qualified after the module name. Exports and imports take pattern and type namespaces, operators in parentheses with members, and members that mix the two dots with names. Data and newtype instances take constructors, type applications may stand between arguments, a record wildcard may follow named fields, and a pattern guard may carry a type annotation. In the base lexer port, a where or a closing brace that starts a line at or left of the current block's indentation closes the implicit blocks above it, and a closing bracket closes the blocks opened inside it; unboxed-tuple and quotation brackets count as brackets, and [d| opens a layout block. The parse-error rule of the layout algorithm is approximated for the tokens real code puts there: a comma of the enclosing brackets or record braces closes the blocks opened inside them, unless the comma follows a guard's bar before the guard's own arrow or equals sign; then and else close the blocks opened since their if; the second equals sign at the level of a let opened in a guard closes the let; a guard's bar that starts a line level with the innermost block closes it; a where closes every do block it is inside; a record's closing brace closes nothing; and an empty module body closes at the end of the file. An equals sign or arrow that touches another operator character does none of this. rec and mdo open a block only where RecursiveDo or Arrows is on. A let in a guard of a case alternative, closed by the alternative's arrow, and any other token a block cannot hold stay out of reach. tools/corpus/haskell.sh checks it against GHC's base library, pandoc, aeson, lens, stack, xmonad, and canon's src, 1,921 files: every file parses with both the plain grammar and the dialect except lens's tests/properties.hs, which needs a macro from an included header, and one stack test placeholder that is not Haskell; grammars/haskell/README.md holds the table.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-haskell-grammar-comments:
  status: decided
  question: Does the plain Haskell grammar carry a canonical comment on each of its own rules, as the ANTLR and Java grammars do?
  answer: |
    Yes, written on 2026-09-15: every parser rule and every non-fragment lexer rule, with the BSD header as the file-level comment citing its license. The dialect is generated from the plain grammar and carries the same comments, extended on the rules that gained labels. Both are checked at the root.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-canon-comment-standard:
  status: decided
  question: canon's own source carried no comments until a standard existed; what is the standard?
  answer: |
    Canonical comments in Haddock form, on exported units and module headers, and nothing else. Every module has a doc comment before the module keyword saying why the module exists and citing the decisions it embodies. Every exported unit has a doc comment that says why under rule 8, since the name says what; a type cites the decision that shaped it and a function states the reason or invariant. Non-exported units may have one. Every one of these comments is recorded as pending in the root vetting file, because they were written by an AI and a human vets them.
  opened: 0.1.0
  decided: 0.1.0

DEC-human-sign-off:
  status: decided
  question: Comments are vetted under rule 7, but an AI wrote most of the ledger and the registry and marked decisions decided itself; what does it take for any canonical material to count?
  answer: |
    Rule 9. Every canonical comment, ledger entry, and registry entry has an entry in the vetting file, keyed by decision id, ledger/KEY, or registry/KEY, holding a verdict and a digest of what the material says, so an edit makes the verdict stale. Nothing counts until its verdict is set, and the report is invalid while anything is pending. Whether the material says something true is not decidable by a program, which is Rice's theorem applied to documentation, so the human sign-off is the evidence. canon does not test who signed; it records whoever did: the author of the commit that last touched the verdict line, from git blame, and the co-authors that commit names in its trailers, so an assisted sign-off is visible as such. This extends DEC-comment-vetting to all canonical material.
  opened: 0.1.0
  decided: 0.1.0

DEC-rust-grammar:
  status: decided
  question: How does canon read Rust, given that the grammars-v4 Rust grammar leans on RustLexerBase and RustParserBase predicates canon's interpreter cannot run, and that Rust tells doc comments from plain ones, puts attributes between an item and its doc comment, and documents a module from inside it?
  answer: |
    Through the vendored grammars-v4 Rust grammar under grammars/rust, changed where canon's interpreter or Rust itself requires and each change marked canon: in the grammar. The predicates are replaced in the grammar: a shebang may not continue with [, a float has no bare-dot form so 1..2 and 1.max(2) stay integers, a tuple index may be a float so x.0.1 parses, and shl and shr no longer require touching brackets. A backslash in a string always starts an escape, because the upstream reading let a string end at a later quote under longest match. Outer attributes and visibility move into each kind of item through itemPrefix, so an item's node starts at its first attribute and the comment above binds to it, and each attribute is labeled marker. tokenTree and macroMatch take one token each, because runs of tokens made macro bodies exponential to parse. Bounds on associated types, union as an identifier, && before a type, keywords as macro metavariables, the tilde, and the underscore expression are accepted, as Rust does. The lexer matches Unicode property classes by general category, which Rust identifiers need. A profile's comment syntax gains outerDoc and innerDoc openers: when outer openers are given only a comment opening with one binds to the unit below and a plain comment is neither a Why nor an orphan, and a comment opening with an inner opener binds to the innermost unit enclosing it or to the file, the file's first one ahead of a comment on its first line; adjacent line comments merge only when they open alike. The Rust units are function_, structStruct, tupleStruct, enumeration, union_, trait_, macroRulesDefinition, typeAlias, constantItem, staticItem, inherentImpl, traitImpl, and module, named by their identifier, an inherent impl by its self type; which of them require a comment, the variants and fields that are units too, and how a trait impl is named are recorded in DEC-rust-visibility. The test table gains rust: a function marked #[test], #[tokio::test], #[async_std::test], #[rstest], or #[quickcheck]. The sample is scopeguard 1.2.0, vendored with its licenses rather than a submodule because it is one small file. Unstable syntax such as default fn is not accepted. async, try, and dyn are identifiers too, as they are in the 2015 edition, because canon reads a crate without knowing its edition; a later edition's async blocks and dyn types still parse as such. A carriage return alone is not rejected where rustc rejects it, in a doc comment or a string, since that only turns a file rustc refuses into a parse failure and changes no unit of a file it compiles.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-rust, rust-reference-comments, REQ-rust-support]

DEC-csharp-grammar:
  status: decided
  question: How does canon read C#, given that the grammars-v4 C# grammar stops at C# 7, leaves interpolated strings and the preprocessor to a CSharpLexerBase class canon's interpreter cannot run, and puts attributes and modifiers outside the rule of each member, and that C# documents what is visible outside an assembly with /// XML comments above a member's attributes?
  answer: |
    Through the vendored grammars-v4 C# 7 grammar under grammars/csharp, changed where canon's interpreter or modern C# requires and each change marked canon: in the grammar. The base lexer is ported as the Canon.Antlr4.Lex.CSharp hook, selected by the superClass option: it tracks the braces of each interpolation hole so the closing brace returns to the string, switches to the format mode at a colon outside parentheses in a hole, and reads the branches of each #if that a build selects, hiding the others, so the code canon reads is code some build compiles, every branch some build compiles being read in one of the builds DEC-preprocessor-builds records; Canon.Preprocessor holds that policy. A verbatim interpolated string has its own mode instead of predicates; an escape in a string is a backslash and the next character, because hex escapes of one to four digits made the lexer exponential; a raw string without interpolation is one token, and an interpolated raw string has a mode of its own whose holes are parsed, the hook counting the dollars and quotes of its opener; the byte order mark is matched decoded; and the contextual keywords of C# 9 to 14 are tokens that are also identifiers. Attributes and modifiers move into each kind of type and member through member_prefix, so a member's node starts at its first attribute and the comment above binds to it; public and protected are labeled required, so a member visible outside its assembly requires a comment, as the compiler's CS1591 warning asks; each attribute is labeled marker. C# 8 to 14 syntax is added: file-scoped namespaces, top-level statements, records, primary constructors, init and required members, switch and with expressions, ranges, patterns, target-typed new, collection expressions, raw strings, extension blocks, and the rest listed in grammars/csharp/README.md. A profile unit is required when its node holds an element labeled required, as dialect units already were. A profile's comment syntax gains directives: a line opening with one, and where outer doc openers are named a plain comment line, stands between a doc comment and its unit without parting them, as #if and #pragma do in C#: the unit is taken to start above such lines, and a plain comment line is one held by a scanned plain comment that starts its line, one rule that also gives the Elixir behaviour of DEC-elixir-grammar, where a # line between @doc and @spec does not part them; a comment in a branch canon does not read binds to nothing and is no orphan; and a doc opener followed by a slash, or one ending in a star followed by another, opens a plain comment, so //// is not documentation. A ref key ends where markup starts, so ref:KEY</summary> cites KEY. The C# units are namespaces, classes, structs, interfaces, enums, records, delegates, methods, constructors, destructors, properties, indexers, events, operators, fields, constants, enum members, and extension blocks; none is required by its rule, and each is required when public or protected. The test table gains csharp: a method marked [Fact], [Theory], [Test], [TestCase], [TestCaseSource], [TestMethod], or [DataTestMethod], bare or qualified. The parser's predicates are answered by the CSharpParserBase hook DEC-parser-predicates records. The bodies of an interface and of an enum are labeled inherited, so their members require a comment when their container does, as DEC-inherited-label records; private and internal are labeled optional; protected internal is labeled required and private protected optional, in either order. The sample is Ardalis.GuardClauses, its library sources and one test file vendored with its MIT license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-csharp, csharp-xml-documentation, REQ-csharp-support]

DEC-fsharp-grammar:
  status: decided
  question: How does canon read F#, given that grammars-v4 has no F# grammar, that F# ends a declaration by indentation under the offside rule, which no context-free grammar sees, and that F# documents a declaration with /// comments above its attributes and makes every declaration public unless it says otherwise?
  answer: |
    Through an F# grammar written for canon under grammars/fsharp, which parses the declarations that carry documentation, namespaces, modules, let bindings, records and fields, unions and cases, enums, classes, interfaces, delegates, abbreviations, extensions, exceptions, members, constructors, and val declarations, and reads expressions, patterns, and types as runs of tokens kept inside their declaration. The FSharpLexerBase superClass selects the Canon.Antlr4.Lex.FSharp hook, which turns indentation into INDENT, DEDENT, and NEWLINE tokens outside brackets as Python's tokenizer does, and into BRNL tokens inside brackets, which F# lets close at any column, each empty and placed where the last code token ends so it widens no span; it reads the branches of each #if a build selects, as C# does under DEC-preprocessor-builds, and lays out the tokens of a type application such as f< ^a when ... > as inside brackets, so its angle brackets may span lines; a less-than sign is taken for one when it touches the name before it and a greater-than sign closes it before any token a type cannot hold. A type parameter may be quoted in double backticks. A line of a body that starts with let is a local binding, a unit that may have a comment. A union case's fields may continue on indented lines, and an indented with below them begins the union's members. The grammar handles the offside rule's common exceptions at the level of declarations, parameters and constructors on the lines below a name, union cases at the column of type, and match arms at the column of their binding, and reads a line it cannot take as a declaration as an expression rather than failing the file. let rec and is read as one group, so an and that continues a type is never read as a binding. private and internal are labeled optional: a profile unit whose rule requires a comment does not when its node holds an element labeled optional, so a comment is required on functions, types, exceptions, and members that a file exports, and optional on values, abbreviations, extensions, fields, cases, val declarations, class and local bindings, modules, and namespaces. Each attribute is labeled marker. The test table gains fsharp: a function or member marked [<Fact>], [<Theory>], [<Test>], [<TestCase>], [<TestCaseSource>], or [<Property>], bare or qualified, and a function or value marked Expecto's [<Tests>], because the testCase and testProperty inside a test list are expressions, not declarations. The limits are listed in grammars/fsharp/README.md. The sample is Giraffe.ViewEngine, its two source files and its test file vendored with its Apache-2.0 license. Verbose syntax beyond the shapes the grammar reads, and layouts it does not read, remain open-ended limits: each needs its own exception to the offside rule's common case, and no corpus at hand shows which matter.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-offside-rule, fsharp-xml-documentation, REQ-fsharp-support]

DEC-elixir-grammar:
  status: decided
  question: How does canon read Elixir, given that the grammars-v4 Elixir grammar parses under a quarter of real Elixir files, that Elixir writes documentation as @doc and @moduledoc attributes holding strings rather than as comments, that attributes such as @spec sit between a @doc and its definition, and that a function is several def clauses?
  answer: |
    Through a structural Elixir grammar written for canon under grammars/elixir, from the Elixir syntax reference and the behaviour of Elixir's tokenizer. The grammars-v4 grammar at 7df52be was evaluated and is not vendored: it parsed 71 of 308 files from Jason, Plug, and Phoenix, stopping at newlines before a leading pipe, at quoted keyword keys, at sigils, and inside interpolations. canon's grammar reads statements separated by newlines unless an operator, comma, or keyword continues the line, expressions as chains of operands without precedence, strings and heredocs in lexer modes whose interpolations push the default mode, and sigils as single tokens. Each kind of definition is its own rule and takes the module attributes on the lines directly above it, labeled marker, so its node starts at the first attribute; a documentation attribute with a string value is not taken. test, describe, and property are a token of their own. On that grammar it parses all 308 files, 2.5 MB, in about 20 seconds of process time, none above a second. A profile's comment syntax gains docAttributes, attribute names whose string value canon scans as a block comment from the attribute to the end of the string, with the attribute, a sigil such as ~S, and the delimiters stripped from its body; a string delimiter of three or more characters may span lines. The Elixir profile lists @doc and @typedoc as outer openers and @moduledoc as inner, so @doc binds to the definition below and @moduledoc to the module around it, and a # comment is no documentation. Where outer openers are given, full-line plain comments directly below a doc comment no longer separate it from its unit, and an outer doc comment on a file's first line documents the item below rather than the file. A unit rule gains mergeClauses, which makes adjacent matches with one name a single unit, as a function's clauses are one function, unless a doc comment directly above a later clause starts a unit of its own, as the @doc of another arity does; and several unit rules may name one grammar rule, told apart by their first token, so test and describe are different kinds. The Elixir units are modules, protocols, functions, macros, guards, delegates, and callbacks, which require a comment, and implementations, private functions, macros, and guards, types, structs, exceptions, and describe blocks, which may have one; private definitions are told apart by their keyword. The test table gains elixir: a unit of kind test, which the profile makes of ExUnit's test and StreamData's property; its comment is a @doc above it, which compiles without warning. Lexing a loop over a long literal copied the ends of every later iteration, which made a 20 KB string take seconds; the lexer now appends the shorter end first and returns the last matching alternative uncopied. A definition with a computed name such as def unquote(name)(args) is a unit named by its unquote call, and an operator definition such as def a <~> b is named by its operator. Elixir binds every pending attribute to the next definition, so a definition takes the attributes above it across blank lines, and a @doc binds across them too: where a profile names doc attributes, the blank lines below one do not part it from its unit. @doc false and @doc nil are labeled hidden on the definition below, and @moduledoc false in a module body hides the module, by DEC-hidden-label; a @moduledoc false quoted inside a function does not hide the function. A lowercase sigil interpolates, so it has a lexer mode per delimiter and its interpolations may hold any code; an uppercase sigil stays one token. A test may name itself in parentheses, as in test("name", context), and a test without a block is a pending test. A profile's comment syntax gains interpolation, an opener and a closer such as #{ and }, inside which a string's quotes do not end it, so a @doc heredoc whose interpolation holds a heredoc is scanned whole. All 308 files of Jason, Plug, and Phoenix still parse. The corpus of tools/corpus/elixir.sh, Elixir's lib/ with Mix, ExUnit, IEx, EEx, and Logger, Phoenix, Ecto, Plug, and Jason at pinned commits, 1000 files, parses whole with the grammar and with the dialect, after these changes, each marked canon: in both: an operator followed by a colon and a space is a keyword key, as in [==: 2]; an atom, a key, or a name may start with any letter, hold @ in a key, and hold combining marks; the newer operators are atoms, as :..// and :<~>; a struct may be named by an expression, as in %unquote(type){}, %^module{}, %@for{}, and %URI.t(){}; .. alone is an operand; a parenthesis may open with ->, as (-> result) does; and a heredoc of an uppercase sigil or a charlist closes only at the start of a line. Before them 73 files failed, each within a second and a half; the slowest file, Elixir's 7,178-line type checker, takes 3.6 CPU seconds. The sample is Jason 1.4.5's formatter and its tests, vendored with Jason's Apache-2.0 license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-elixir, elixir-syntax-reference, elixir-writing-documentation, REQ-elixir-support]

DEC-gleam-grammar:
  status: decided
  question: How does canon read Gleam, for which no ANTLR grammar exists, given that Gleam documents an item with /// above its attributes and a module with ////, and that gleeunit tests are public functions named for it?
  answer: |
    Through a grammar of Gleam's module level written for canon under grammars/gleam, from the Gleam language tour and the Gleam compiler's parser at v1.19.0. It reads imports, constants, custom types with constructors and labelled fields, type aliases, and functions with their attributes, labeled marker, so an item's node starts at its first attribute; function bodies and parameter lists are balanced brackets, since canon needs items and not expressions, and a function without a body is external. Public and private items are separate rules. It parses all 116 modules of the stdlib, gleam_json, gleam_otp, and wisp, 0.8 MB, in about 4 seconds of process time, and the 239 modules of the Gleam compiler's test projects. The Gleam profile lists /// as the outer opener and //// as the inner one, so /// binds to the item below and //// to the file, and a // comment is no documentation; an outer doc comment on a file's first line documents the item below it, not the file. Public functions, types, and constants require a comment; private ones, constructors, and labelled fields may have one. The test table gains gleam: a function named *_test, which gleeunit runs. The syntax removed before Gleam 1.0 is read too, so older code parses: external fn and external type, and module-level target groups written if erlang { ... }, whose items are items of the module; try and a bare assert sit inside function bodies, which are balanced brackets. external and internal are tokens canon needs, and are names wherever Gleam allows a name. @internal hides an item from the documentation, so it is labeled hidden, by DEC-hidden-label. A profile's comment syntax gains joinAcrossBlankLines: doc comments that open alike and stand apart only by blank lines are one comment, and blank lines below one do not part it from its unit, so the Gleam profile joins every /// line above an item as the Gleam compiler does. All 116 current modules parse, and the 182 modules of the stdlib at v0.18.0, v0.22.0, v0.25.0, and v0.29.0. The sample is the stdlib's order and bytes_tree modules and order's tests, vendored with the stdlib's Apache-2.0 licence. The tuple type written tuple(A, B), which Gleam replaced with #(A, B) in v0.15, is read too; syntax older than v0.18.0 is otherwise untested, since no corpus at hand holds it. The corpus of tools/corpus/gleam.sh, the stdlib, the compiler's 238 .gleam test projects and fixtures, and 23 packages of gleam-lang and the community, among them wisp, lustre, mist, gleam_otp, and glance, at pinned commits, 566 files, parses whole with the grammar and with the dialect, unchanged, at 0.26 CPU seconds a file at most.
  opened: 0.1.0
  decided: 0.1.0
  refs: [gleam-language-tour, gleam-compiler-parser, gleam-documentation-comments, REQ-gleam-support]

DEC-parser-memory:
  status: decided
  question: The parser kept a memo entry for every rule at every token, and a loop's recursion built a result for every pair of an iteration and a later end, so a 13,000-line C# collection initializer took 10 GB. How does the parser keep its memory linear in the input?
  answer: |
    Three changes, none of which changes a parse. A loop is a depth-first walk over the positions its iterations reach, each position visited once, emitting a position after the ones beyond it when greedy and before them when not; that gives the order, and with one tree per end the trees, that the recursion of alternatives gave, since a position reached again only repeats ends already emitted, and each prefix of children is shared with the one before. The memo table holds an entry only for a rule asked for at a position where its first set admits the token or it is nullable; other rules fail there without an entry, and entries are made on first request in a table private to the parse. A memo entry is a strict, unpacked list of trees and ends, with a rule node's children built when the entry is made and one shared entry per position for a failure that reached no further. On the 13,000-line initializer the model takes 10 seconds and under 1 GB.
  opened: 0.1.0
  decided: 0.1.0
  refs: [warth-2008]

DEC-parser-predicates:
  status: decided
  question: Grammars from grammars-v4 put semantic predicates in parser rules that call into a target-language parser base class, which canon's interpreter has no port of. How are they answered?
  answer: |
    Through a parser hook selected by the parser grammar's superClass option, as lexer actions are answered through a lexer hook. The hook is given the predicate's text, the visible tokens, the index where the invoking rule started, and the index the parse has reached, and says whether the parse may go on; a predicate no hook knows holds. CSharpParserBase is the first port: IsRightArrow, IsRightShift, and IsRightShiftAssignment hold when the two tokens just read touch, and IsLocalVariableDeclaration fails when a declaration's type is var, which allows one declarator.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-csharp]

DEC-preprocessor-builds:
  status: decided
  question: canon read one branch of each C# and F# #if, the first whose condition held for some choice of symbols, so the code and documentation of every other branch went unread. How does canon read every branch some build compiles?
  answer: |
    By reading a file once per build of a small set that together reads every branch some assignment of symbols reads. A build is an assignment of the symbols the file's conditions name; a symbol the file defines or undefines overrides it from that line on. The builds are picked greedily from all assignments by how many branches not yet read each adds, the first being the one that reads most; a file without #if is read once as before, and beyond twelve symbols the default choice is the only build. Each build's tokens hide the branches it does not read, and extraction merges what each read finds: units by id, the first build's winning, with their children merged and kept in source order, and decisions by id, the first winning. A doc comment is an orphan only when every build that reads it leaves it unbound. A unit declared in two branches is one unit, documented by the comment in the first branch read. A branch no assignment reads, such as #if false, is never read. Haskell's CPP is read the same way, with #ifdef and #ifndef as #if of the symbol and of its negation.
  opened: 0.1.0
  decided: 0.1.0
  refs: [csharp-preprocessor-directives]

DEC-inherited-label:
  status: decided
  question: The members of a Rust trait, a Rust enum, a C# interface, and a C# enum say no visibility of their own and are as visible as what holds them. How does a grammar say that their comment is required when their container's is?
  answer: |
    With an element label, inherited, on the part of a unit that holds such members. A unit found under an element labeled inherited requires a comment when the unit enclosing it does, unless its own node holds an element labeled optional, as a private member of a C# interface does. It is the one label whose meaning depends on the enclosing unit; required, optional, and marker are read from the unit's own node. An element labeled optional wins over one labeled required in the same node, so the F# dialect labels every declaration that is public by default required and private optional; a unit whose why element is mandatory is required whatever its node holds. No grammar before these had both labels in one node.
  opened: 0.1.0
  decided: 0.1.0

DEC-rust-visibility:
  status: decided
  question: The Rust profile required a comment on every function, struct, enum, union, trait, and macro whether or not it was pub, named an impl by its self type alone so a type's trait impls were told apart by ordinal, made no units of variants and fields, and the grammars-v4 lexer let an empty // or /// comment run on through the next line. How does canon read what a Rust crate exports?
  answer: |
    As rustc's missing_docs lint does. A bare pub is labeled required, while pub(crate), pub(super), pub(self), and pub(in path) are not, and #[macro_export] is labeled required, so an item, field, or macro visible outside the crate requires a comment; the items of a trait and the variants of an enum are labeled inherited and require one when their trait or enum does; the methods of a trait impl, which the trait documents, and private items may have one. The profile's units are required by none of their rules. Variants and named fields are units named by their identifier, and a tuple field is named by its position from zero, which a profile unit takes from name ordinal. A trait impl is named by its trait and self type, through the traitImplTarget rule, and a name's tokens are run together with a hyphen where the source spaces a word from what follows, so impl Deref for Guard<T, U> is named Deref-for-Guard<T,U> and a unit id holds no space; a Haskell instance head is named the same way. The comment rules no longer let the character after // or /// be a line break, which hid the code on the next line, and //// stays a plain comment. A pub item of a private module still requires a comment, since the grammar does not follow reexports.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rust-missing-docs, rust-reference-comments, REQ-rust-support]

DEC-fsharp-signatures:
  status: decided
  question: An F# signature file declares what its implementation exports and carries its documentation, but canon reported every public binding of an implementation with a .fsi as missing a comment, even when the .fsi documented it. How does canon tie the two?
  answer: |
    A profile names its signatures, a map from the extension of a signature file to the extension of the implementation it declares, as .fsi to .fs. When canon check or canon vet reads both files of a name, a unit of the implementation needs no comment, since the compiler takes the documentation from the signature and what the signature leaves out is private; a unit of the signature needs one when the implementation unit it declares would. Units are matched by the names of the units enclosing them, whatever their kinds, since a val declares a let. A test keeps its own requirement. canon model reads one file and does not link.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-signature-files, REQ-fsharp-support]

DEC-stray-comments:
  status: decided
  question: How does a canonically commented dialect read a doc comment that stands where its grammar accepts none, as inside an expression, given that a compiler skips such a comment and warns at most, and that no grammar can accept a token between any two others without reading every expression differently?
  answer: |
    A parser grammar names its comment rules in strayComment options, one rule per option. When a parse fails at a token that starts a match of one of them, or within three tokens after a match ends, canon reads the file again without that comment and adds it to the root of the tree labeled orphan, so extraction reports it as a doc comment attached to nothing; it does so again for as long as each round moves the failure forward, so a file is parsed at most once more than it holds such comments. A failure no stray comment explains is reported where the parse stopped before the round that did not move it, which for a file with no stray comment near its error is where the first parse stopped. The window of three tokens covers a grammar that reads the comment as the optional Why of a unit and fails a token or two later, at what it cannot document there. A match is found by parsing a rule that takes the comment rule and then any tokens, from each token the comment rule names within 400 tokens before the failure, nearest first. The option is opt-in rather than read from orphan labels, because some orphan labels name data, as Clojure's docstring and the Folio's stray front matter do. A grammar without the option parses as before. On StringUtils.java of commons-lang, 9,421 lines, through the Java dialect with the option set, a syntax error at the end of the file costs about a tenth of the 0.6 seconds of process time a parse takes, and a stray comment there one more parse. The Rust, C#, F#, Elixir, Gleam, Erlang, and Haskell dialects name their comment rules; HCL and Pulumi YAML need none, since their hooks hide or their grammars accept a comment anywhere. The JavaScript and TypeScript dialects name canonicalComment, and hide in their lexer hook only a comment that starts with @type or @satisfies, a type cast or annotation rather than documentation; their grammars keep orphan slots where a fuzz that put a doc comment before every token of a broad file found a path that takes the comment and fails beyond the window.
  opened: 0.1.0
  decided: 0.1.0
  refs: [REQ-rust-support, REQ-csharp-support, REQ-fsharp-support, REQ-elixir-support, REQ-gleam-support, REQ-erlang-support, REQ-haskell-support, REQ-javascript-support, REQ-typescript-support]

DEC-rust-dialect:
  status: decided
  question: What does the canonically commented dialect of the Rust grammar look like, given that Rust doc comments are attributes that may stand wherever an attribute may, that //! documents the module or file around it, and that a tuple field has no name?
  answer: |
    grammars/rust/canonically_commented holds the plain Rust grammar with doc comments as canonical comments on the default channel. The lexer sends /// and /** into DocLine and DocBlock modes and //! and /*! into InnerDocLine and DocBlock, which tokenize prose, ref:KEY, and license:KEY; a following /// or //! line continues a line comment, and //// and /*** stay plain by the longest match. The parser adds canonicalComment, innerComment, and docPart, and labels each item, named field, tuple field, and variant as a unit alternative whose Why is the doc comment above its attributes, of which the last of several in a row binds; a doc comment after an attribute or where only an attribute may stand, as above a statement, a match arm, or a parameter, is an orphan, as rustc warns it is unused, and an inner doc comment binds to the module whose body it opens or, at the top of a file, to the file. A why element of the start rule outside every unit is the file's Why, the first of several binding. A doc comment in a macro's input is a token of it and binds to nothing. A tuple field is named by its position through an element labeled ordinal, which stands for the what of a unit without a name. The /// and //! markers are stripped from a Why like the others. The dialect keeps the plain grammar's required, inherited, and marker labels, so it requires what the profile requires. It binds a doc comment across a blank line, as every dialect does under DEC-comment-attachment, and reads no plain comment as a file's Why. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar. A doc comment where the grammar takes none, as inside an expression, before a closing bracket, or at the end of a block, is read out of the file and reported as an orphan, because the parser grammar names canonicalComment and innerComment in strayComment options, by DEC-stray-comments.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rust-reference-comments, REQ-rust-support]

DEC-csharp-dialect:
  status: decided
  question: What does the canonically commented dialect of the C# grammar look like, given that an XML doc comment documents the type or member below its attributes and that the compiler accepts one where it documents nothing?
  answer: |
    grammars/csharp/canonically_commented holds the plain C# grammar with /// and /** comments as canonical comments on the default channel. The lexer sends them into DocLine and DocBlock modes, which tokenize prose, markup punctuation, ref:KEY, and license:KEY; a following /// line continues a line comment, //// and /*** stay plain comments, and the lexer hook still hides the branches of an #if a build does not read, doc comments in them included. The parser adds canonicalComment and docPart, and labels each namespace, type, member, and enum member as a unit alternative whose Why is the doc comment above its attributes, of which the last of several in a row binds. A doc comment the compiler warns is on no valid element binds to nothing and is an orphan: one after an attribute, before a statement or a switch section, before a using directive, an extern alias, an assembly attribute, or an accessor, before a parameter, an argument, an initializer's element, or a switch expression's arm, and after the last member of a body or file. Anywhere else, as inside an expression, the parser grammar names canonicalComment in a strayComment option, so a doc comment the grammar does not accept where it stands is read out of the file and reported as an orphan, by DEC-stray-comments. The dialect keeps the plain grammar's required, optional, inherited, and marker labels and its hooks. It binds a doc comment across a blank line, as every dialect does under DEC-comment-attachment. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [csharp-xml-documentation, REQ-csharp-support]

DEC-fsharp-dialect:
  status: decided
  question: What does the canonically commented dialect of the F# grammar look like, given that F# ends a declaration by indentation, that a /// comment is the first thing on its line, and that F# declarations are public unless they say otherwise?
  answer: |
    grammars/fsharp/canonically_commented holds the F# grammar with /// comments as canonical comments on the default channel, sent into a DocLine mode that tokenizes prose, ref:KEY, and license:KEY, a following /// line continuing it and //// staying plain. The FSharpLexerBase hook holds a doc comment's tokens until the next code token has produced its layout tokens and emits them just before it, as the Haskell port does, so a doc comment is never the first token of a line and the offside rule reads the file as it reads it without comments. The parser adds canonicalComment and docPart, and labels each namespace, module, binding, type, field, case, member, constructor, val, and exception as a unit alternative whose Why is the doc comment above its attributes; a case's comment comes before its bar, so the bar is part of the case. A declaration public by default holds the empty rule publicByDefault labeled required, and private and internal are labeled optional, which wins, so the dialect requires what the profile requires. A doc comment after a declaration's attributes, above a line that declares nothing, or inside an expression is an orphan, and one the grammar does not accept where it stands is read out of the file and reported as an orphan, by DEC-stray-comments. On the Giraffe.ViewEngine sample it finds the units, requirements, and doc comments the profile finds; only the plain license comment the profile binds to a file is no canonical comment in it. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-xml-documentation, fsharp-offside-rule, REQ-fsharp-support]

DEC-groovy-grammar:
  status: decided
  question: How does canon read Groovy, given that grammars-v4 has no Groovy grammar, that Apache Groovy's own ANTLR grammar leans on Java superclasses and a SemanticPredicates class canon's interpreter cannot run, that Groovy makes a declaration public unless it says otherwise, documents it with /** Groovydoc above its annotations, and names Spock feature methods with strings?
  answer: |
    Through Apache Groovy's own ANTLR 4 grammar, src/antlr/GroovyLexer.g4 and GroovyParser.g4 at commit 84b0d5072e2d8d02d10720b8a337493af1bda9fe, vendored under grammars/groovy with its Apache-2.0 headers and changed where canon's interpreter requires, each change marked canon: in the grammar and listed in grammars/groovy/README.md. It is the grammar the Groovy compiler parses with, and grammars-v4 has none at 7df52be or in its history. The lexer's AbstractLexer superclass and members are ported as the Canon.Antlr4.Lex.Groovy hook, selected by the superClass option, which the vendored grammars rename GroovyLexerBase, and the parser's AbstractParser GroovyParserBase, so another grammar whose superclass has the generic name cannot select Groovy's hooks: it keeps the type of the last default-channel token, so isRegexAllowed tells a slashy string from a division, and the bracket stack enterParen and exitParen keep, so a newline inside parentheses or square brackets but not braces or try resources is hidden; it decides the identifier predicates on the character just matched. canon's lexer predicates see the characters matched and not the ones ahead, so each predicate that looked ahead is written as the characters it allowed: quotes inside a triple-quoted string, a dollar that starts no GString value in a slashy or dollar slashy string, a slashy string's first character, and a slash in a dollar slashy string; a character beyond ASCII after a dollar starts a value when it may start a Java identifier, decided by the hook's isJavaLetterInGString on the character matched, supplementary letters included; a slashy string may hold only dollars, every dollar before a slashy GString's closing slash belongs to its end, and a dollar or a $/ escape may stand just before a dollar slashy string's closing /$. Each of these lexes as Groovy 4.0.24's own lexer lexes it; where a dollar slashy string is followed by code starting with $ or by a value-like letter, as $/a/$$/$ and $/a$//$b/$, canon's lexer cannot look ahead and fails to lex, and $///$ lexes as $ and a line comment, which grammars/groovy/README.md lists; NOT_IN takes the letters after !in and the hook splits a longer word back into ! and an identifier. RollBackOne, which rolled the lexer back over a character, is an empty match that leaves the mode, the string modes move to the end of the lexer because canon reads each mode section as the whole mode, and comments are hidden, which leaves the parser the separators upstream's comment-as-newline gave it, since a comment that ends its line is followed by the newline token. Each kind of type is a rule of its own that starts with its modifiers and annotations, so the Groovydoc above them binds; an enum's body is enumBody, which upstream chose with a predicate on a rule argument; a constructor is a rule of its own, a member without a return type named for its class as the predicate isConstructorName added for canon decides, which upstream's AST builder told apart; def is a modifier, so def Foo() in class Foo is a constructor, as Groovy compiles it, and Object Foo() a method. The parser's predicates are answered by the Canon.Antlr4.Predicate.Groovy hook, selected by superClass GroovyParserBase as DEC-parser-predicates records: isInvalidMethodDeclaration, isInvalidLocalVariableDeclaration, isAnnotatedLoopStatement, isIdentifierAssign, static as a name before a dot, and isFollowingArgumentsOrClosure, which upstream read from the parse of an expression and the hook reads from its tokens, by its brackets and operators, so a cast such as (T) f(x) y may be read as a call; the switch-expression and async-closure counters are not tracked, so yield and defer statements are admitted anywhere. An annotation is labeled marker and private optional. The Groovy profile names classes, interfaces, traits, enums, annotation types, records, enum constants, constructors, methods, and fields as units, all required by their rule, so a declaration requires a comment unless private lifts it, as Groovy's public default asks; a field is named by its first declarator, and a Spock feature method by its string's contents, without quotes, a slash in it a division slash, as DEC-groovy-dialect records. The profile's outer opener is /**, and a // or /* comment is no documentation. The test table gains groovy: a method marked with a JUnit or jqwik annotation, as for Java, a method named test* under src/test, and a method named by a string in a specification under src/test or in a *Spec.groovy file, which is how Spock writes a feature method. The sample is spock-genesis 0.6.0, six of its sources and two Spock specifications vendored with its MIT license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [apache-groovy-grammar, groovydoc, REQ-groovy-support]

DEC-declarator-label:
  status: decided
  question: How is a declaration that declares several names, as a Groovy field int x, y or def (a, b) = [1, 2] does, read as units, given that a unit is one labeled alternative and its Why one comment?
  answer: |
    An element labeled declarator inside a unit alternative's node, outside the units nested in it, makes a unit of its own of each such element, named by the what element inside it, with the alternative's kind and requirement, its node the declarator, and its Why the alternative's. The units the declarators of one declaration make share one decision that binds them all, as Javadoc and Groovydoc above a field declaration document each name it declares, so the comment is vetted once. Naming the field by its first declarator alone, as before, left the other names without units, and a destructuring declaration, which has no single name, was no unit at all. The Groovy dialect labels the names of a field declaration so.
  opened: 0.1.0
  decided: 0.1.0
  refs: [groovydoc, REQ-groovy-support]

DEC-groovy-dialect:
  status: decided
  question: What does the canonically commented dialect of the Groovy grammar look like, given that Groovydoc documents the declaration below its annotations, that Groovy declarations are public unless private, and that Groovy reads a newline as a separator?
  answer: |
    grammars/groovy/canonically_commented holds the Groovy grammar with /** comments as canonical comments on the default channel. The lexer sends them into a DocBlock mode that tokenizes prose, punctuation, ref:KEY, and license:KEY and drops the stars that decorate a line; /**/ and /*** stay plain comments. The parser adds canonicalComment and docPart; each use of a comment takes the newlines after it so a separator never stands between a comment and its declaration, while the comment's span, and its decision's, ends where the comment ends. It labels each type, constructor, method, field, and enum constant as a unit alternative whose Why is the Groovydoc above its annotations, of which the last of several in a row binds. A field declaration labels each name it declares declarator, a destructuring def (a, b) = ... included, so each name is a field of its own and the Groovydoc above is one decision binding them all, as DEC-declarator-label records. A method named by a string, as a Spock feature method is, is named by the string's contents without quotes or escapes, a slash in it a division slash so the name stays one segment of the unit id; a test is still told by the name as written. Each unit holds the empty rule publicByDefault labeled required, and private is labeled optional, which wins, so the dialect requires what the profile requires. A Groovydoc comment after an annotation or a modifier, before a statement, a package, an import, an initializer block, a case label, or a closure's parameters, or after the last member of a body, a block, a closure, or a file binds to nothing and is an orphan. The parser names canonicalComment in a strayComment option, so a Groovydoc comment anywhere else, as inside an expression or between brackets, is read as an orphan where the parse fails at it or just after it, as DEC-stray-comments records. The parser hook reads past a Groovydoc comment where a predicate looks at the tokens of the declaration it starts. It binds a Groovydoc comment across a blank line, as every dialect does under DEC-comment-attachment. On the spock-genesis sample it binds all 42 Groovydoc comments and finds no orphans. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [groovydoc, REQ-groovy-support]

DEC-javascript-dialect:
  status: decided
  question: What does the canonically commented dialect of the JavaScript grammar look like, given that a JSDoc comment documents the declaration below it, that JavaScript code also writes JSDoc comments inside expressions as type casts, that a module's first JSDoc comment may document the module, and that what a module exports is marked by export rather than by a visibility keyword?
  answer: |
    grammars/javascript/canonically_commented holds the grammars-v4 JavaScript grammar with /** comments as canonical comments on the default channel. The lexer sends them into a DocBlock mode that tokenizes prose, ref:KEY, and license:KEY, dropping the stars that decorate a line and reading a block tag such as @param as a word; /**/ and /*** stay plain comments. The first /** of a file, before any code but a hashbang line, opens FILE_DOC_OPEN instead, through the IsStartOfFile predicate of the base lexer port, in a mode that reads @file, @fileoverview, @overview, @module, @license, and TSDoc's @packageDocumentation as DOC_FILE_TAG and marks a blank line after the comment with DOC_BLANK_LINE. That comment is the file's Why, a why element of the start rule outside every unit, when it holds a file tag, when a blank line follows it, or when an import follows it, since JSDoc's @file and @module say a comment documents a file and a comment set apart from the code or above the imports documents no declaration; otherwise it documents the declaration below it. The lexer hook hides a doc comment whose first word is @type or @satisfies, wherever it stands: it is a type cast or a type annotation, which TypeScript's checker reads as a type, not documentation, so it is neither a Why nor an orphan, and a @type comment above a local binding reports nothing. The parser adds canonicalComment, fileComment, taggedFileComment, and docPart, and labels as unit alternatives a function declaration wherever it stands, a class declaration, each method, accessor, and field of a class, a binding a var, let, or const statement declares at the top of a module, and export default, named default; an accessor is named by get or set and its property, so a getter and a setter are two units, and a binding by its first declarator, a destructuring statement by its pattern, since its one comment documents all its bindings. An object literal that an exported binding or export default holds directly is read by memberObject, whose properties, methods, and accessors are units of kind property, method, and accessor, a property whose value is such an object literal holding units of its own; it is labeled inherited, so an exported object of settings or functions requires a comment on each member, while the properties of any other object literal are no units. Of several JSDoc comments in a row the last binds. A JSDoc comment after the last statement or member of a body or file, before or after the last property of an object literal, before a case, above a list of exports, or above a local binding or an expression statement, as JSDoc writes above this.x = x, is an orphan the grammar reads, the one before a property only when the parser predicate propertyAhead sees a name and a colon after it; anywhere else the grammar takes none, above any other statement, inside an expression, or before an argument or a parameter, the parser's strayComment option reads the file without it and reports it as an orphan under DEC-stray-comments, so a doc comment never fails the parse; the grammar takes the comments above local bindings and expression statements because a file with hundreds, as lodash.js has, would otherwise be read again once for each. A named function expression and a class expression are expressions and no units, and a list of exports, as export {a} or export * from, is no unit. The export keyword is part of the declaration it exports and is labeled required, so what a module exports requires a comment, as eslint-plugin-jsdoc's require-jsdoc rule asks with publicOnly; a class's tail is labeled inherited, so the members of an exported class require one too, and a #private name, which nothing outside the class can reach, is labeled optional. JavaScriptParserBase's predicates are answered by a parser hook that serves the plain grammar too: n and p compare the next or previous token's text, so a getter, a setter, and static are told from a member named get, set, or static; lineTerminatorAhead and notLineTerminator compare the lines of the code tokens on either side of the parse's position, which is where the base class finds a line terminator among the hidden tokens the hook is not given, so a statement without a semicolon ends at a line break and not inside a line; closeBrace and notOpenBraceAndNotFunction read the next code token. Both samples still parse whole through their profiles and dialects with these predicates. On the chalk sample the dialect parses all 16 files with no orphan, finding 58 units where the profile's three unit rules find 14; chalk's JavaScript carries no JSDoc and exports no object literal. tools/corpus/javascript.sh parses React's packages, node's lib/, lodash, express, and three.js's src/: every one of the 2,077 files node accepts parses with the plain grammar and with the dialect, and the 1,112 React files node rejects, written in Flow or holding JSX, are excluded, since the grammar reads ECMAScript and neither is; minified files and build output are not read. The corpus found and the grammar now reads logical assignment, a trailing comma after the last parameter, 1. with no fraction digits, private brand checks, and using and await using declarations, and lexes an identifier with many underscores in linear time. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [jsdoc, jsdoc-file-tag, eslint-jsdoc-require-jsdoc, REQ-javascript-support]

DEC-typescript-dialect:
  status: decided
  question: What does the canonically commented dialect of the TypeScript grammar look like, given that a TSDoc comment documents the declaration or member below it, that the members of an interface or object type have no visibility of their own, that private, protected, and #private members are no API, and that the plain grammar was slow on TypeScript before the parser memoised its loops?
  answer: |
    grammars/typescript/canonically_commented holds the grammars-v4 TypeScript grammar with /** comments as canonical comments, lexed as the JavaScript dialect lexes them under DEC-javascript-dialect, a @type or @satisfies cast hidden as there, the file's first one through FILE_DOC_OPEN and the same rule for a file's Why, @packageDocumentation being TSDoc's tag for it; the lexer adds a hashbang line, which the plain grammar lacks, so a script parses and its first TSDoc comment below the hashbang may be the file's. The parser labels as unit alternatives function declarations, classes, interfaces, type aliases, enums and their members, namespaces, ambient modules, a binding a var, let, const, or declare statement declares at the top of a module or namespace, export default, named default, and the constructor, properties, methods, accessors, abstract members, and index signatures of a class; the members of an object type are units too, a property or method named by its name and a call, construct, or index signature by its position. An ambient module is named by its name without quotes, declare module 'foo' as module/foo, through lexer modes that read the quoted name after module as MODULE_QUOTE, MODULE_NAME, and MODULE_QUOTE. The signature of a function, a method, a constructor, and an interface's method is labeled merge, so overload signatures and their implementation are one unit whose Why is the first TSDoc comment, as TSDoc and editors show it, and a later signature with a comment of its own starts a unit of its own, as DEC-elixir-dialect merges clauses. An object literal that an exported binding holds directly, with as const or satisfies after it or not, or that export default holds, is read by memberObject as in the JavaScript dialect, its properties, methods, and accessors units. Decorators belong to the member they decorate, after its comment. A namespace's body is read as a module's, so its exported bindings are units. A TSDoc comment above a local binding, after the last statement or member, after import or export default, before [ in an array or indexed type, before a case or a mapped type's member, or before a property of an object literal that propertyAhead sees is an orphan the grammar reads; anywhere else the grammar takes none, it is a stray comment that the strayComment option reports as an orphan under DEC-stray-comments, so a doc comment never fails the parse; a local binding's comment stays an orphan, since TSDoc documents declarations a module exposes. The export keyword is part of the declaration and is labeled required, so what a module exports requires a comment, as TSDoc documents a package's exported API; an interface's body, an enum's body, a class's tail, an exported object literal, and the whole right side of a type alias are labeled inherited, so the members of an object type in a union or an intersection require one when the alias does, and private, protected, and #private are labeled optional, which lifts it. The dialect also reads import type and export type and an inline type modifier, as in import {type A}, which the plain grammar reads as an expression, so a TSDoc comment above such an import is still the file's Why, and a template literal type. TypeScriptParserBase's predicates, line terminators included, are answered by the hook DEC-javascript-dialect records. On the ky sample the dialect parses all 87 files with no orphan, binding all 90 TSDoc comments and finding 750 units, the members of ky's exported object literals among them, overloads merged, and the override properties of its error classes, which the plain grammar read as statements, in about the time the plain grammar takes. tools/corpus/typescript.sh parses 3,771 files, 38 MB, of the TypeScript compiler's src/ at v6.0.3, the last release written in TypeScript, VS Code's base and editor common code, Angular's core, common, and router, Nest's packages, and Deno's std, every one with the plain grammar and with the dialect; the corpus found and the grammar now reads trailing commas and const, in, and out in type parameter lists, definite assignment, member modifiers in any order with declare, abstract, override, and accessor, generator, async generator, and optional methods, accessors without a body, extends any expression, named, optional, and rest tuple elements, abstract constructor types, assertion and this predicates, infer with a constraint, numeric, import, and template literal types, index signatures of any key type, satisfies, generic arrow functions, typed object literal methods, decorators with type arguments, line breaks between object type members, contextual keywords as names, and a hashbang line, and lexes an identifier with many underscores in linear rather than exponential time; the TypeScript form of the lexer hook also keeps the brace depth of each template expression. The grammar reads no JSX, so .tsx is outside the profile and the corpus. The compiler's 53,000-line checker.ts is the slowest file, 24 seconds through the plain grammar and 55 through the dialect on a lightly loaded machine. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [tsdoc, tsdoc-package-documentation, REQ-typescript-support]

DEC-prolog-grammar-fixes:
  status: decided
  question: The grammars-v4 Prolog grammar stopped at marelle.pl line 126 with no lexer rule matching, so one file of the marelle sample did not parse. Why, and is it right to change the vendored grammar?
  answer: |
    The grammars-v4 Prolog grammar failed 172 of 249 files of SWI-Prolog's library, Logtalk's core and adapters, and marelle (tools/corpus/prolog.sh); the first failure, marelle.pl line 126, was a quoted atom holding a check mark, which NON_QUOTE_CHAR did not admit. Its operator table was fixed, a left-recursive term operator_ term, while Prolog's operators are user-definable through op/3 and SWI-Prolog adds its own, and the table was exponential on long bodies. Both grammars now read a term as a flat run of primaries and operator atoms, termPart+: any atom may stand as an operator, an operator as an atom or a functor, and a comma and, in a body, a bar separate terms; priority and associativity are left to Prolog, since canon needs only a clause's extent and a compound term's arguments. A clause ends with END, ISO's end token: a full stop followed by layout, a % comment, or the end of the file, so a full stop inside a term, as SWI-Prolog's dict access X.key, is a graphic atom. The lexer reads ISO Prolog as SWI-Prolog extends it: a character outside ASCII and a tab inside quotes; \e, \s, \z, \uXXXX, \UXXXXXXXX, and \c with its line break, octal and hexadecimal escapes without the closing backslash, and a CR LF continuation; digit groups, radix integers such as 16'FF, 0'', exponents without a sign or a fraction, and 1.0Inf and 1.5NaN; quasi-quotations as one token; and a compound term without arguments, foo(). Dicts parse as a tag followed by a curly term. \c once took the layout after it, which made the lexer try every split of a run of spaces, 47 seconds on a 244-line file; it now takes only its line break. Every change is marked canon: and mirrored in the dialect. Every file parses with both grammars and none is excluded; the largest, Logtalk's 30,363-line core.pl, takes about 10 seconds of CPU in the parser and is given a longer limit. With the changes the marelle sample's units are unchanged, 233 in thirteen files.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4, REQ-prolog-support]

DEC-prolog-dialect:
  status: decided
  question: What does the canonically commented dialect of the Prolog grammar look like, given that PlDoc documents a predicate with a structured comment above its clauses, that a predicate is all the clauses of one name and arity, and that a module's export list is its public API?
  answer: |
    grammars/prolog/canonically_commented holds the Prolog grammar split into a lexer and a parser, since a combined grammar may not hold modes, with the plain grammar's implicit literal tokens named in the lexer in their implicit order and module and test added as tokens that are still atoms. The default mode is the space between clauses, and a Code mode reads a clause up to its closing full stop, line breaks included. Between clauses, %! or %% at the start of a line opens a PlDoc line comment, sent into a DocLine mode that tokenizes prose, ref:KEY, and license:KEY and is continued by every following line that starts with %, %%, or %!; %%% is a plain banner, and an indented %! or %% is plain. /** between clauses, at the start of a line or after a clause's full stop, opens a PlDoc block comment, and /** <module> opens the comment that documents the file; /*** and /**/ stay plain. Inside a clause or a directive's term every comment is plain, %! and %% at the start of a line and /** included, so none fails the parse. A term is the plain grammar's flat run of primaries and operator atoms and a comma is no operator, so the arguments of a compound term are counted right, and a clause body, a directive, and a parenthesised term read a conjunction, or a disjunction written with a bar, as a bodylist ending in the END token. A clause whose head is an atom or a compound term, module-qualified or not, is a unit of kind predicate named name/arity through an element labeled arity, which is the head's bracketed arguments, so foo(2) has arity one, or the number a declaration writes; a head without arguments labels the empty rule noArguments. A declaration, :- dynamic foo/1 and its kin, is a clause of the first predicate it declares, so PlDoc's comment above a declaration documents that predicate; it may declare several, as :- dynamic a/1, b/2 or :- dynamic [a/1, b/2], and module-qualified ones. Adjacent units named with an arity merge when they share a kind and a name, so the clauses of a predicate are one unit, unless a later clause carries a comment of its own. A single sided unification rule, Head, Guard => Body, is a clause of its predicate like a :- rule. A DCG rule is a unit of kind nonterminal named by its written arity, and a clause of test/1 or test/2 is a unit of kind test named by its first argument, which canon recognises as a plunit test. The module directive labels each predicate indicator of its export list export, so the export rule requires a comment on exactly the exported predicates; a nonterminal indicator name//N labels its name what and its arity arity, and an export element so labeled exports name/N, the name of the nonterminal's unit; it labels the module's name export too, which names no predicate, so a module that exports nothing exports nothing, and a file without a module directive exports every predicate, as Prolog's user module makes them all visible. An export entry is a module export only when the word module is followed by a capital, so module_path/1 is a name. A canonical comment that no unit follows, as above a directive or at the end of a file, is an orphan. The %, %%, and %! of a PlDoc line are stripped from a Why like the other line markers. On the marelle sample it finds 197 units, all required since no file is a module, and no canonical comment, since marelle writes plain % comments. A head written with an operator, such as X ===> Y :- ..., is no unit: the grammar has no operator table, so an operator a file declares does not parse as one, and a builtin operator as a head is too rare to name. Its rules carry no canonical comments, so the root canon.yaml ignores it like the Rust, C#, and F# dialects.
  opened: 0.1.0
  decided: 0.1.0
  refs: [swi-prolog-pldoc, REQ-prolog-support]

DEC-folio-dialect:
  status: decided
  question: What does a canonically commented dialect of the Folio look like, and does the root canon.yaml read docs/ through it?
  answer: |
    grammars/folio/canonically_commented holds a Folio lexer and parser that read a page as units by labels instead of by canon's page extraction. The default mode is the start of a line: three dashes open front matter, read in a FrontMatter mode whose fields id, kind, title, and video are keys of their own and whose values are tokenized as a canonical comment is; hashes and a space open a heading whose title is tokenized into words; fences push the plain grammar's code modes; any other line is prose, tokenized into words, punctuation, ref:KEY, and license:KEY, an inline code span being one word so a citation in backticks is an example. A page with front matter is a unit labeled doc, named by its id through what, whose Why is its front matter and which requires it, so its id is the one canon's page extraction gives the page; the video field's value is labeled ref and cited as a reference, as the page extraction cites it. A section whose heading is followed by prose is a unit of kind section named by its title, whose Why is all of its prose, before and after its fenced blocks, as DEC-section-prose-is-why gives every tangled block of the section a Why from that prose, and whose How is its fenced blocks: each block is labeled how inside the why element, and canon reads a why element without the how elements inside it and joins several how elements into the How. A section whose heading is followed by a block is no unit. The default mode is the first line of the page, where --- opens front matter; every later line starts in a LineStart mode, where a --- line is a thematic break, as in Markdown, and is skipped. A thematic break inside a section's prose stays in the Why's text, as *** and ___ do. The root canon.yaml keeps reading docs/ through the plain grammar, because the page extraction, the tangler, and the site renderer read the plain grammar's rule and token names, a line per token; switching would change what canon check reports for docs/ and is not done, so the dialect changes nothing the root check reports for docs/. Its rules carry canonical comments like the plain Folio grammar's, so the root canon.yaml checks it. Prose is one run of words up to the next fenced block or heading, two runs never adjacent, and a front-matter field's value takes every line up to the next field, so a page has one parse; before, the ways of splitting a section's lines were each tried, and a forty-line section took six seconds. tools/corpus/folio.sh reads every Markdown page under the docs/ trees of canon (2), Rice's Tax (50), and Rice's Tax's examples (9) with the plain grammar and the dialect, all in under a second; canon's parser is quadratic in the tokens of one run of prose, so 400 lines of prose without a block take about six seconds through the dialect.
  opened: 0.1.0
  decided: 0.1.0
  refs: [REQ-folio-support]

DEC-go-dialect:
  status: decided
  question: What does the canonically commented dialect of the Go grammar look like, given that a Go doc comment is an ordinary comment told apart only by sitting directly above a declaration, that a blank line parts it from one, and that Go exports a name by its upper-case initial?
  answer: |
    grammars/golang/canonically_commented holds the plain Go grammar with doc comments as canonical comments on the default channel. The lexer names GoLexerBase, ported as a hook that follows line starts and brackets: a comment that starts its line outside every bracket, inside a parenthesis after const, type, or var, or inside a brace after struct or interface, and in no bracket that admits no declaration, such as a function body, opens a DocLine or DocBlock mode that tokenizes prose, ref:KEY, and license:KEY; a following // line continues a line comment, and a directive line, //go:generate and any //word:word, //nolint, //line, //extern, //export, or // +build, is left out of its tokens and, through canon's stripping of a // comment, of its Why, as go/doc leaves it out. Every other comment stays hidden, so a comment inside a function body is never documentation. The hook holds a doc comment's tokens until the next code token and hides them again when a blank line or the end of the file comes first, as go/doc reads only a comment directly above a declaration, so a license header or build constraint is neither a Why nor an orphan; this is where Go departs from DEC-comment-attachment, which binds across a blank line. The parser adds canonicalComment, commentPiece, and docPart, a canonical comment being one or more line or block pieces with no blank line between them, so a /* */ block followed directly by a // comment is one doc comment, as go/doc groups them; it labels as unit alternatives each top-level function, method, type, const, and var, each spec of a grouped declaration, each struct field, and each interface method and embedded element. A grouped declaration is a unit of kind group named by its position, whose Why is the comment above it; a spec of a documented group needs no comment of its own, as revive accepts a comment on the block, and a spec of an undocumented group needs one when exported. The comment above the package clause is the file's Why. A comment above an import, or after the last field, element, or spec of a struct, interface, or group documents nothing and is an orphan. A declared name is labeled required through the GoParserBase predicate isExported, which holds for an upper-case initial, and each name of a const or var spec is labeled on its own, so a spec requires a comment when any of its names is exported; a method's receiver of unexported type is labeled optional, which wins, since revive skips such a method; fields and interface methods are optional, since revive's exported rule does not ask for them. The plain sample profile instead requires every function, method, and type, exported or not, binds any comment above them, a plain one or one parted by a blank line, and reads types declared in function bodies; the dialect follows the Go tools, which document what a package exports and only through the comment directly above it. The plain // and /* markers are stripped from a Why like the others. On the google/uuid sample it finds the 114 functions and 34 methods the profile finds, 12 top-level types against the profile's 14 that include two declared in test bodies, and no orphan. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [go-doc-comments, revive-exported, REQ-go-support]

DEC-python-dialect:
  status: decided
  question: What does the canonically commented dialect of the Python grammar look like, given that a Python docstring is a string literal and not a comment, that only its place as the first statement of a body makes it documentation, and that Python marks a private name only by convention?
  answer: |
    grammars/python/canonically_commented holds the plain Python grammar with the docstring as the Why of module, class, and def units, as PEP 257 defines it. The lexer is the plain one. A DocString mode was considered and rejected: the lexer cannot tell a docstring from any other string, since only the parse puts it first in a body, and a mode that tokenized every triple-quoted string into prose would read ordinary strings differently. So the parser labels the STRING token why through docString, which the Python3ParserBase predicate isDocString admits when the string, or the adjacent strings Python joins into one, is a statement alone and none is a bytes or an f-string, which Python does not take as docstrings, and canon joins the contents of adjacent strings, and canon reads its prose, ref:KEY, and license:KEY from the string's contents by the Python path it already had. The docstring of a module is a why element of the start rule outside every unit and is the file's Why, and the profile's module docstring yields to it. funcdef and classdef take in decorated and async_funcdef, so a definition's node starts at its first decorator, each decorator is a marker, and an async def is a function. A string anywhere else is an expression and a # comment is skipped, so neither is documentation and the dialect has no orphans. A definition's name is labeled required through the predicate isPublicTopLevel when it is defined at the top level of a module and has no leading underscore, and optional through isPrivateName when it has one and is not __init__; a class's body is inherited, so the public methods of a public class need a docstring, __init__ included. That is PEP 257's rule, that the functions and classes a module exports and their public methods, the constructor included, need docstrings, with PEP 8's leading underscore for what a module does not export; a dunder method's meaning is the language's data model, which Python documents, so it may have one. A stub marked @overload is labeled optional, as pydocstyle asks a stub not to repeat the implementation's docstring, and a function nested in a function may have one. isPublicTopLevel knows the top level by nesting, not by column: it counts the INDENT and DEDENT tokens before the definition, a def or class opening a body one level deeper than itself, so a definition in no def or class body is at the top level, inside a module-level if, try, or with block included, as a module exports it. The plain sample profile instead requires every def and class and binds a # comment above a definition; on the itsdangerous sample the dialect finds the same 115 functions and 29 classes with two decisions fewer, the two # comments, and no orphan. A module's docstring is not required, since the file unit never requires a comment; this is left as it is, as no file in any language requires one. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [pep-257, pep-8, REQ-python-support]

DEC-scala-grammar:
  status: decided
  question: How does canon read Scala, given that the grammars-v4 Scala 3 grammar states no licence, that Scala 3 lets indentation stand for braces, and that Scaladoc documents a definition from above its annotations and modifiers?
  answer: |
    Through a Scala grammar written for canon under grammars/scala, ScalaLexer.g4 and ScalaParser.g4, from the Scala 3 syntax reference and under canon's MIT licence, because the grammars-v4 Scala 3 grammar canon vendored before states no licence: grammars-v4 has no single licence and each grammar states its own, and that one, added in grammars-v4 pull request 4836, states none in its files, its readme, or the pull request, so canon may not vendor it or a port of its base lexer, and both are gone. It reads Scala 3 because current projects are written in it and its compiler still accepts most Scala 2 syntax. The lexer reads every token kind: nested block comments, plain and multi-line strings, interpolated strings as one token each with their $name and ${...} holes, whose braces and strings nest, character literals with escapes, symbols, backquoted names, numbers, and soft keywords, which the parser also reads as names; each loop takes one character per step, so lexing stays linear. The parser is structural, as the F# grammar is: it parses packages, packagings, package objects, imports, exports, objects, classes, case classes, traits, enums and their cases, defs, vals, vars, type aliases, givens, extensions, self types, and end markers, in braces or with optional braces, and reads bodies, expressions, types, and patterns as runs of tokens kept whole by the layout tokens of DEC-scala-indentation and by bracket nesting. A statement it cannot read as a declaration is read as an expression rather than failing the file, and definitions inside a block, such as the locals of a def, are part of the block's run of tokens and not units, since Scaladoc documents members. Each definition rule starts at its first annotation or modifier, so the Scaladoc comment above them binds to it. Annotations are labeled marker, and private, protected, and override are labeled optional, because Scaladoc documents public members and an override inherits the documentation of what it overrides. An enum case is labeled inherited. A definition is named by definitionName, an auxiliary constructor by this, a given by givenName or else by givenType, the type it provides, and an extension by extendedType, the type it extends. The parser needs no predicates, so it has no superClass. The profile in lang_samples/scala-iron requires a comment on every definition by its rule except enum cases and extensions. The test table gains scala: a def marked with a JUnit 4 or 5 test annotation, and any unit under a src/test or test directory or in a *Suite, *Spec, or *Test file, because munit, ScalaTest, and utest tests are test("...") calls, which are expressions. The grammar parses all 12 files of the Iron sample, finding the units and the 49 decisions it found before, all 45 example files of the grammars-v4 Scala 3 directory, and all 143 files of its lila example, used as test inputs only, reading no declaration in them as an expression. The limits are listed in grammars/scala/README.md. The sample is Iron 3.3.2's constraint core, its any and char constraints, and two of its utest suites, vendored with its Apache-2.0 license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [scala3-syntax, grammars-v4-scala-license, scaladoc, REQ-scala-support]

DEC-scala-indentation:
  status: decided
  question: Scala 3 ends a block where the indentation does, and decides which line breaks separate statements by the tokens around them, neither of which a context-free grammar sees. How does canon give the Scala grammar the INDENT, OUTDENT, and NEWLINE tokens it expects?
  answer: |
    Canon.Antlr4.Lex.Scala, a lexer hook written for canon from the Optional Braces section of the Scala 3 reference and selected by the grammar's ScalaLexerBase superClass, modelled on the F# hook. It keeps a stack of regions: the file and each pair of braces, which separate and indent statements, each with the width of its first line and the widths of the indented regions opened in it; and parentheses and brackets, inside which line breaks are not significant and no layout token is emitted. At the first code token of a line in a region of braces it emits INDENT when the line is right of the current width and the last token may start an indented region, as =, =>, ?=>, <-, catch, do, else, finally, for, if, match, return, then, throw, try, while, yield, with, and :, the closing parenthesis of an old-style if, while, or for condition, and the parameters of an extension may; nothing when the line is right of the width after any other token, since it continues the line above; an OUTDENT for each indented region the line is left of; and NEWLINE when the line is level with the width, the last token can end a statement (a name, a literal, this, return, a closing bracket, or the keyword of an end marker), and the next can begin one (not then, else, do, catch, finally, yield, match, with, extends, derives, a dot, a comma, a colon, an equals sign, an arrow, a closing bracket, or a leading infix operator), and after an OUTDENT unless the next token cannot begin a statement. A case level with a match or catch at the end of the line above opens a region of case clauses that the first other token at that width closes, as the reference's special treatment of case clauses says. A closing bracket or brace closes the indented regions opened inside it with OUTDENTs, and the end of the file closes the rest. The width of the file's region is its first code token's column, so a file indented as a whole reads as one that is not, and a line left of a region's own width is level with it. A blank line or one holding only comments is skipped. Every layout token is empty and placed where the last code token ends, the source's own line breaks staying hidden, so a token widens no span. In the canonically commented dialect the hook holds a Scaladoc comment's tokens until the next code token and emits them after its layout tokens, so a line holding only a comment is blank to the layout. The hook does not insert the reference's OUTDENT before a token such as else that closes an indented region on the line it was opened on; the grammar's runs of tokens read such lines either way.
  opened: 0.1.0
  decided: 0.1.0
  refs: [scala3-indentation, REQ-scala-support]

DEC-scala-dialect:
  status: decided
  question: What does the canonically commented dialect of the Scala grammar look like, given that a Scaladoc comment documents the definition below it from above its annotations and modifiers, that Scala definitions are public unless they say otherwise, and that the compiler accepts a /** comment anywhere a comment may stand?
  answer: |
    grammars/scala/canonically_commented holds canon's Scala grammar with /** comments as canonical comments on the default channel. The lexer sends them into a DocBlock mode, which tokenizes prose, punctuation, ref:KEY, and license:KEY and drops the stars that decorate a comment's lines; /**/ and /*** stay plain comments, a comment nested in a plain one is part of it, and DOC_OPEN comes before OP, which would otherwise take /** by rule order. The ScalaLexerBase hook holds a doc comment's tokens until the next code token has produced its layout tokens, under DEC-scala-indentation. The parser adds canonicalComment and docPart and labels each definition, package object, enum case, and extension a unit alternative, # val, # var, # def, # type, # class, # case_class, # object, # trait, # enum, # given, # case, and # extension, whose Why is the doc comment above its annotations and modifiers and whose What is its definitionName, an auxiliary constructor's this, a given's givenName or else its givenType, or an extension's extendedType; a val or var that binds a pattern is no unit. A definition holds the empty rule publicByDefault labeled required, and private, protected, and override are labeled optional, which wins, so the dialect requires what the profile requires; an enum case is labeled inherited, and an extension's comment is optional, since its methods are definitions of their own. A doc comment after an annotation or a modifier, before a package clause, a packaging, an import, an export, an end marker, a self type, an expression statement, or a val that binds a pattern, inside an expression, a header, a type, or brackets, at the end of a body, or at the end of the file is an orphan, as scaladoc ignores it; a declaration whose header holds one where no orphan is accepted is read as an expression statement, so a misplaced doc comment never fails the parse. On the Iron sample it parses every file, binds each of its 49 Scaladoc comments, reports no orphan, and finds the units, requirements, and doc comments the profile finds; it parses the 45 example files and 143 lila files of the grammars-v4 Scala 3 directory, and the 57 files of the sample and the examples that hold no multi-line string with a doc comment inserted at the start of every line, after every opening parenthesis and comma, and after every equals sign. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [scaladoc, scala3-indentation, REQ-scala-support]

DEC-vetting-layout:
  status: decided
  question: The vetting ledger of DEC-comment-vetting and DEC-human-sign-off was one canonical_vetting.yaml per project. Rice's Tax, the review tool over canon's material and over wavelet's mutation review, wants a directory per kind and a file per subject so a record sits beside what it judges and every queue shares one layout. Does canon move to that layout?
  answer: |
    Yes. canonical_vetting/ holds a directory per kind and a file per subject. Comment verdicts mirror the source tree under comment/, so the comments of src/Canon/Walk.hs are judged in canonical_vetting/comment/src/Canon/Walk.hs.yaml, keyed by their full decision id so a file reads alone; the ledger's verdicts are in canonical_vetting/ledger/canonical_decisions.yaml and the registry's in canonical_vetting/registry/canonical_refs.yaml. Each file keeps one key per line with the verdict on its own line, so git blame attributes it as before, and co-author lookups are made once per commit across all files. A canonical_vetting.yaml from the single-file layout is refused with the instruction to delete it and ingest again, and every existing ledger, all pending and unsigned apart from one good verdict in the Gson sample that was reapplied, was regenerated by canon ingest. Decided with the owner of Rice's Tax on 2026-09-15.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-vetting-kinds:
  status: decided
  question: Rice's Tax asks a person to judge surviving mutants and to see coverage gaps as work, with wavelet's verdict words. canon's vetting knew four words and three kinds of key. Does canon learn other kinds, or does Rice's Tax keep its own files?
  answer: |
    canon learns kinds, through canon.yaml rather than through code: a project declares each kind another tool raises with its verdict words and what each does, open, closed, work, or deferred. A row of a declared kind is keyed kind/id, lives in canonical_vetting/<kind>/<subject>.yaml, and carries the kind's own word. canon counts an open row as pending so the report is invalid while a mutant is unreviewed, records the signer of every other row, and reports a kind or a word the declaration does not know. It does not raise such rows, judge their staleness, or retire orphans, because it cannot know what a mutant is; the tool that owns the kind does. The digest field of every row is named digest, since it is no longer only a comment's. Decided with the owner of Rice's Tax on 2026-09-16.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-layout-parse-error-rule:
  status: decided
  question: The Haskell dialect's layout port closes an implicit block on a dedented where or a brace, but not by Haskell's parse-error rule, so a let in a list-comprehension qualifier followed by a comma on the same line, or a case inside parentheses closed by a bracket, fails to parse. Six of wavelet's files and one of Rice's Tax's hit this on 2026-09-16. How is the parse-error rule brought into the interpreted grammar, given that it needs the parser to tell the lexer a token was rejected?
  answer: |
    By the lexer hook, which approximates the rule for the tokens real code puts where a block cannot hold them, since the interpreted parser cannot tell the lexer that a token was rejected. A closing parenthesis or bracket closes the blocks opened inside it; a comma of the enclosing parentheses, brackets, or record braces closes them too, unless it follows a guard's bar in the block before the guard's arrow or equals sign; then and else close the blocks opened since their if; and the second equals sign at the level of a let opened in a guard closes the let. An equals sign or arrow that touches another operator character, as in /= or ==, is part of an operator. A let in the guard of a case alternative, which its arrow would close, is not read, nor is any other token a block cannot hold. Every file of wavelet and Rice's Tax parses through the dialect, and one more file of the grammatical-parsers sources they vendor; the others fail on CPP and extensions the grammar does not read. The details are in DEC-haskell-grammar-fixes.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax, REQ-haskell-support]

DEC-vetting-run-field:
  status: decided
  question: A verdict on a surviving mutant is made against one run of a mutation tester with a seed, a version, and a toolchain, and a later run may not contain the same mutant. How does a row say which run it was decided against?
  answer: |
    A row may carry a run field naming the run, written by the tool that owns the kind and carried by canon without reading it, one key per line like the rest of the row. What a run is, and where its facts live, is that tool's business; Rice's Tax records each run in mutation_runs.yaml at the project root. Decided with the owner of Rice's Tax on 2026-09-16.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-git-runner:
  status: decided
  question: "Rice's Tax compiles canon to WebAssembly and runs it from Node, where a module cannot start a process. How does canon run git there?"
  answer: |
    Every git call goes through one runner, a directory and arguments in and the output or an error out, held in Canon.Git.Shell and replaceable with setGitRunner. The default runs git as a process as before; a host without processes installs a runner of its own before the first call, and every provider function goes through it unchanged. The Haskell dialect grammar now accepts NOINLINE and INLINE pragmas on names, which the runner's holder needs. Decided with the owner of Rice's Tax on 2026-09-18.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-more-languages:
  status: decided
  question: JavaScript, TypeScript, Python, Go, and Kotlin are to be canonical languages. Their grammars-v4 grammars lex identifiers with Unicode property classes, import a second grammar, decide regular expressions and template strings with semantic predicates in a base class, and leave Python's indentation to one. What does canon's interpreter need?
  answer: |
    Four things, each general rather than per language. Unicode property classes in character sets, by general category and the few named properties the grammars use. Grammar imports, read from beside the importing file and appended after its rules so its definitions win, as ANTLR resolves them. Semantic predicates in lexer rules asked of the hooks, with the matched text and the start offset, so a base lexer port answers them and a grammar without hooks still has every predicate hold; and the action hook given two characters of lookahead, which Python's newline needs. Then three base lexers ported as hooks: JavaScriptLexerBase and TypeScriptLexerBase, which track the last token for regular expressions, brace depth for template strings, and strict mode; and Python3LexerBase, which turns newlines into NEWLINE, INDENT, and DEDENT. Go needs only the property classes and Kotlin only the imports. Parser-side predicates stay assumed true. Set as a goal by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-canon-is-the-format:
  status: decided
  question: "Rice's Tax had begun to grow its own files for the runtime and the mutation runs. What format do canon and the three Rice's Tax verbs share?"
  answer: |
    canon's. Every parameter and every ledger is a canon file read and written through this library: canon.yaml carries the languages, the kinds, and a runtime section canon does not read; canonical_refs.yaml, canonical_decisions.yaml, and canonical_vetting/ stay as they are; runs live in canonical_runs.yaml and exemptions in canonical_exemptions.yaml. Decided by the owner in Rice's Tax on 2026-09-17 and recorded there in full; canon carries the entry because its code cites it.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-exemptions:
  status: decided
  question: A project just imported, or a vendored part of one, owes thousands of rows nobody can vet yet. ignore hides the debt, and deferring rows one at a time does not scale. How does a project opt a subject out for a while?
  answer: |
    Rule 10 and canonical_exemptions.yaml, one entry per exempt subject: a path pattern in gitignore form or a unit or ledger key, optionally the kinds it covers, a reason, and the version to revisit by, signed by git blame like every other row. canon check reports covered material as exempt rather than pending, still counts it so the size of the debt is known, and fails once the project reaches the revisit version, as an open decision past its revisit fails. An exemption is Rule 3's not-yet-canonical given a canonical place and an expiry. Decided by the owner in Rice's Tax on 2026-09-17 and recorded there in full.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-binding-label:
  status: decided
  question: A Haskell function unit was its type signature, so canon had no body for it, its span ended at the signature, and its How was the type. Rice's Tax needs the body as the second side of a What verdict. Where does the body come from?
  answer: |
    The dialect labels a function's type as signature and each following top-level binding as binding, and the extractor attaches every binding to the nearest preceding unit at the same level with its name, joining adjacent symbol tokens for an operator and reading the word in backticks. The unit's How is then its equations from the first to the last, comments inside included, its span ends at its last real token, and its What carries the signature text. A unit without bindings keeps its labeled How, or its own text after its comment, so a How never contains the Why. A binding that matches no unit is not a unit, as before. Known limits: a shared signature names only its first variable, pattern bindings match nothing, and class default methods stay unbound. Decided with the owner of Rice's Tax on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-name-kind:
  status: decided
  question: Rice's Tax raises a What row for every unit that requires a comment, in every project, and a project silences it with an exemption rather than by leaving the kind undeclared. canon reports an undeclared kind as a finding no exemption can cover. How does canon know the kind?
  answer: |
    name is a built-in kind with canon's four words, present in every configuration under whatever the project declares. canon raises no row of it and judges none, as DEC-vetting-kinds says of every foreign kind; knowing it only means a row keyed name/<unit id> is pending while open, signed like any other, and coverable by an exemption for the kind name. Decided with the owner of Rice's Tax on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-folio-language:
  status: decided
  question: The owner wants literate programming in wavelet's style, as its own thing with its own name and grammar, fitting Diátaxis and deterministic generation. What is the form, and how does canon read it?
  answer: |
    The Folio: Markdown with front matter naming a page's id, kind, and title, prose that cites with ref:KEY, and fenced blocks whose info string names the file they tangle to and what they define. canon reads it with a grammar of its own, interpreted like every other: one token per line decided by longest match and rule order, so a heading, a fence, a front-matter delimiter, and a prose line are each a token, and a fence pushes a mode in which only its closer ends the block. Heading depth, front-matter fields, info-string attributes, and citations are read from token text. Files keep the .md suffix so editors and forges render them; the name is the form's. Decided by the owner on 2026-09-19, who chose the name.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax, diataxis]

DEC-tangle-in-canon:
  status: decided
  question: wavelet tangled its pages with a tangler of its own, and attested prose-and-code pairs in a lock file. Where does tangling live once canon reads the pages?
  answer: |
    In canon, in Haskell, as canon tangle, ported from wavelet's tangler so the first regeneration of its tree changes nothing but the comments the port now generates for scaffolding blocks that carry prose. One parser both reviews and tangles, and it compiles to WebAssembly with the rest, so Rice's Tax reaches it as ricestax canon tangle. canon check reports a tangled file that differs from its pages, so a forgotten tangle fails the check. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-units-by-tangled-path:
  status: decided
  question: A unit found by parsing a tangled file could be named by the page that produced it or by the file it was tangled to. Which?
  answer: |
    By the tangled file, with its Where naming the page. Name uniqueness and the export rule are decided per module, a page may tangle into several files and a file may be tangled from several pages, and a unit id stays path-based as every other is. Every existing verdict keeps its key across the move from a source tree to pages; only the file it sits in changes, since that follows the Where.
  opened: 0.1.0
  decided: 0.1.0

DEC-section-prose-is-why:
  status: decided
  question: wavelet's form forbids a comment inside a block and canon's Rule 8 requires a canonical comment on every unit that needs one. How do the two agree?
  answer: |
    The prose of the section above a block is the Why of every unit the block holds. Tangling writes it as the generated documentation comment, so the tangled file satisfies the rule; extraction through the pages replaces each generated comment's decision with that prose as authored, covering each unit in the block, so the digest a verdict is judged against is of the page. A block whose section carries no prose leaves its units without a Why, and that is reported, as it should be.
  opened: 0.1.0
  decided: 0.1.0

DEC-docs-tree:
  status: decided
  question: Rule 2 allowed one README per project and no other Markdown outside to_be_removed. Where do tutorials, how-to guides, reference, and explanation live?
  answer: |
    In a docs/ tree per project, split by Diátaxis into docs/tutorials, docs/how-to, docs/reference, and docs/explanation, each page in the Folio with a kind that matches its directory. Rule 2 is amended to say so. Every other Markdown file outside to_be_removed stays forbidden, and the project's canon.yaml ignores the ones that are not pages. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [diataxis]

DEC-doc-kind:
  status: decided
  question: A page is canonical material, but of what kind, and what is judged?
  answer: |
    The kind doc: a page is one unit of that kind, named by its id, with one decision whose Why is all its prose and citations, plus the video it names. Its verdict is keyed doc/<path> under canonical_vetting/doc/, with the same four words as a comment, and it goes stale when the prose changes. An exemption covers a page by its path for the kind doc. Rice's Tax lists a page in the Why queue.
  opened: 0.1.0
  decided: 0.1.0

DEC-video-reference:
  status: decided
  question: The owner wants videos alongside the written tutorials and how-to guides, as a second medium for the same material. Is a video required, and how is it named?
  answer: |
    Optional. A page may carry video: KEY in its front matter, naming a registry entry of kind video whose locator is the video's address; the key joins the page's citations, so a missing entry is an unresolved reference and an entry of another kind is reported. Nothing is raised when a page names no video. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0

DEC-rule-identifiers-as-keys:
  status: decided
  question: wavelet names its rules by dotted paths such as snf.identity.never-evaluates. Can a page cite one?
  answer: |
    Yes, as ref:snf.identity.never-evaluates against a registry entry of that key, since a reference key already admits dots and hyphens; no new syntax is needed.
  opened: 0.1.0
  decided: 0.1.0

DEC-header-blocks-documented:
  status: decided
  question: wavelet's tangler wrote no comment for a scaffolding block, so a tangled module had no comment and canon reported every module. Does the port keep that?
  answer: |
    No. A scaffolding block whose section carries prose gets the generated comment too, placed after any pragmas the block begins with so it precedes the module line, which gives a module unit its Why. Scaffolding under a heading with no prose stays as it was, so wavelet's tree changes only where a page already documented its header.
  opened: 0.1.0
  decided: 0.1.0

DEC-tangle-output-format:
  status: decided
  question: What does a tangled file look like, so two runs are one file?
  answer: |
    A three-line banner naming the pages, blank, then for each block in page order its generated comment, its body, and a blank line, trailing blanks trimmed. The comment is the prose converted for the comment's markup, wrapped to the width less the opener, a blank line, and the address of its section, spelled by the embedding in canon.yaml. No version and no date, so a rebuild never churns.
  opened: 0.1.0
  decided: 0.1.0

DEC-site-renderer:
  status: decided
  question: The pages are to be published as ricestax.org. What renders them?
  answer: |
    canon's own renderer, small and complete for what pages use, so it compiles to WebAssembly and two renders are one site: one HTML page per document under its quadrant and an index of the four, with a fixed stylesheet inline, citations linked to what they cite, and a video embedded when canon knows the host. No Markdown library, since none is proven on the wasm toolchain and a renderer canon does not own cannot promise determinism.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-canon-self-folio:
  status: open
  question: Rice's Tax's sources become Folio pages. Do canon's?
  opened: 0.1.0
  revisit: 0.3.0

DEC-make-dialect:
  status: decided
  question: The owner wants a Makefile as each project's front door and wants Makefiles canonically commented and checked like any other source. grammars-v4 has no Makefile grammar. What is the dialect?
  answer: |
    canon's own, written canonically commented from the start under grammars/make/canonically_commented/, and the only Makefile grammar: there is no plain sibling, since there is no upstream to keep as published, and the strayComment option reads a file whose # | comment binds to nothing and reports it as an orphan. GNU make is read as a line language: the default lexer mode is the start of a line, where directives, modifiers, and recipe lines are recognised, and the first name of a line moves to a body mode where those words are names; references nest to any depth inside a name; backslash line breaks join every kind of line. A canonical comment opens with a hash and a bar and continues on following hash lines, as the Haskell dialect's opens with two dashes and a bar. A rule with a plain target is a unit of kind rule that requires the comment, its target the What and its recipe, across blank lines and conditionals, the How; a special target such as .PHONY, a pattern rule, and a variable, with its override, private, or export modifiers, are units whose comment is optional. The one-line help text after two hashes on a rule line stays as the What the help target prints. The language is declared as make with the extension Makefile, which the walk matches as a suffix. tools/corpus/make.sh parses a sample of Linux's makefiles (52), CPython's (5), git's (21), canon's own (3), and the 995 makefiles extracted from GNU make's test scripts: every file parses but the 21 fixtures make itself rejects for a syntax error, which are documented exclusions. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0

DEC-highlight-by-lexer:
  status: decided
  question: The owner wants code coloured per language on the pay page and the site, as GitHub does. What does the colouring?
  answer: |
    The language's own lexer, the one canon already interprets, so every language canon reads is covered and nothing outside the repository is trusted. Tokens are classified into keyword, comment, string, number, type, meta, name, and plain, generically from the grammar's shape: a rule whose every alternative is one alphabetic literal is a keyword, a hidden or doc token a comment, names beginning STRING or DECIMAL and the like say what they are, an uppercase word is a type, and a pragma's bracketed run is meta; a profile's highlight map assigns what the shape does not say. Text the lexer skipped is a comment when it holds anything but whitespace, and a text the lexer refuses is plain. The pieces of a line tile it exactly, so a renderer only paints them; the site paints its fenced blocks by the fence's language word, and Rice's Tax sends the classes beside the lines. The palette is GitHub's, light and dark. The copied plain text stays plain. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-lawspec-parity:
  status: decided
  question: LawSpec emits code in a set of target languages and canon is to read and judge the documentation of every one of them. How does the repository say which languages those are, and keep its grammars, profiles, dialects, and samples in step with the list?
  answer: |
    The root canon.yaml carries a parity section that canon does not read, as it carries runtime: current names the targets LawSpec emits today (python, javascript, typescript, go, java, kotlin, rust, haskell) and planned the ones it is to emit (erlang, elixir, gleam, csharp, fsharp, scala, groovy, clojure, prolog, hcl, yaml) together with the languages canon's own sources and pages are written in (antlr4, make, folio). Canon.ParityTest asserts that each listed language has a grammar under grammars/, a profile in some project's canon.yaml naming that grammar, a canonically_commented dialect beside it, and a sample project, the root counting for the languages canon is written in, and that no grammar directory is outside the list. A piece another branch delivers is named under pending, so the test passes on a branch that lacks it and fails both when a piece is missing and unnamed and when a named piece exists, which makes the merge that delivers it remove the entry.
  opened: 0.1.0
  decided: 0.1.0
  refs: [REQ-lawspec-parity]

DEC-calm-ingestion:
  status: decided
  question: Rice's Tax documents architecture in CALM 1.2 JSON descriptions alongside code and wants each node, relationship, and flow vetted like a unit of code. canon reads languages through grammars, and JSON has no comments to carry a Why. How does canon read a CALM description?
  answer: |
    Through a profile named calm whose grammar is any JSON grammar, as Rice's Tax ships one in its presets, and an extractor of its own, Canon.Extract.Calm, chosen by the language name because CALM's units are fixed by its schema rather than by a grammar's labels. The extractor requires the CALM 1.2 $schema, refuses repeated unique-ids, dangling node and relationship references, unknown node types, and duplicate keys rather than reading a description in part, and makes every node, relationship, and flow a required unit named by its unique-id, under the file, with its description as its Why, so ref:KEY in a description cites the registry as a comment does. Interfaces, controls, decorators, and external references stay in the unit's How. canon ships no JSON grammar of its own, since no LawSpec target is JSON; the tests read a description through an inline one.
  opened: 0.1.0
  decided: 0.1.0
  refs: [calm-1-2, rices-tax, REQ-calm-ingestion]

DEC-kotlin-dialect:
  status: decided
  question: What does the canonically commented dialect of the Kotlin grammar look like, given that KDoc documents the declaration below its annotations and modifiers, that a Kotlin declaration is public unless it says otherwise, and that the profile told Kotlin tests only by their source set?
  answer: |
    grammars/kotlin/canonically_commented holds the grammars-v4 Kotlin grammar, its UnicodeClasses import beside it, with /** comments as canonical comments on the default channel, opened in the default and Inside modes and tokenized in a DocBlock mode into prose, ref:KEY, and license:KEY; a block tag such as @param is a word of the prose, and /**/, /***, and a KDoc comment nested in a plain one stay plain. The parser adds canonicalComment and docPart. Each declaration KDoc documents is a unit alternative whose Why is the KDoc comment above its annotations and modifiers, of which the last of several in a row binds: a top-level class or interface, object, function, property, and type alias in declaration; the same, a companion object, and a secondary constructor in classMemberDeclaration; an enum entry; and a constructor parameter declared val or var. A local declaration is no unit; a class declared in a function body is read by localClassDeclaration, whose body, like an object expression's, is not labeled inherited, so its members are units that need no KDoc, being local to the function. A KDoc comment above the package directive is the file's Why. A KDoc comment after an annotation, before a statement or a local declaration, on a plain parameter, on an accessor, before an initializer block, an import, or a lambda's parameters, or after the last member, statement, or declaration binds to nothing and is an orphan. The parser names canonicalComment in a strayComment option, so a KDoc comment anywhere else, as between two operands or two arguments, is read as an orphan where the parse fails at it or just after it, as DEC-stray-comments records. Kotlin's explicit API mode asks for an explicit visibility on what is public or protected, and the Kotlin coding conventions and Dokka document that API, so a top-level declaration holds the empty rule publicByDefault, labeled required; the members of a class, an interface, an object, and an enum, and the entries of an enum, are labeled inherited, so they need KDoc when their declaration does; private and internal are labeled optional, which wins, and so are override and actual, since the overridden declaration and the expect declaration document them. A constructor property is not inherited, because its class may document it with @property. The members of an object expression are local to it and inherit nothing, and the modifiers of an accessor or a primary constructor are not their declaration's, so a private setter does not make its property optional. The plain grammar labels each annotation marker, and Canon.Testing recognises a function marked @Test, @kotlin.test.Test, @org.junit.Test, or @org.junit.jupiter.api.Test as a test alongside the source-set rule. A unit is named by its identifier; a companion object without a name by its companion keyword, and a secondary constructor by its constructor keyword, the second constructor#2. Kotlin calls an unnamed companion object Companion, but canon reads every name from the source text, which writes only the keyword, and has no way to give a unit a name its source does not write, so the keyword names are kept. Where the grammar accepts a KDoc comment in one reading, as an orphan before a statement, and the parse fails further on, the grammar names the place, as before a lambda's parameters; such a place not yet named still fails the parse. On the Turbine sample the dialect parses all 18 files and binds all 45 KDoc comments with no orphan. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kotlin-kdoc, kotlin-explicit-api, kotlin-coding-conventions, grammars-v4, REQ-kotlin-support]

DEC-clojure-grammar-fixes:
  status: decided
  question: The grammars-v4 Clojure grammar did not parse three files of the hiccup sample. project.clj failed at the keyword :1.8 and both core_test.clj files at a closing bracket after a keyword such as :div#foo. Are these grammar bugs, misreadings by canon's lexer, or reader syntax the grammar lacks?
  answer: |
    Reader syntax the grammar lacks. The grammar read a keyword as a colon token followed by a symbol, so a keyword whose name is not a symbol, such as :1.8, :1.10, or :div#foo.bar, which the Clojure reader reads as one token of the constituent characters after the colon, failed; :1.8 lexed as a colon and the number 1.8, and :div#foo as a colon, the symbol div, and a dispatch on foo that swallowed the closing bracket. canon's lexer read the grammar as ANTLR does. The fix, marked canon: in grammars/clojure/Clojure.g4, makes a keyword one token, KEYWORD for :name and MACRO_KEYWORD for ::name, of every character up to whitespace, a comma, or a character that ends a token for the reader. A second bug the sample does not reach is fixed with it: STRING allowed a backslash both as a character and as the start of an escaped quote, so the longest match ran a string ending in an escaped backslash on to the next quote; a backslash now always starts an escape. With both fixes every one of the sample's 21 files parses, and keyword tokens also make the sample profile's SYMBOL-indexed names right for definitions with metadata keywords such as ^:private. The sample profile gains a deftest unit rule, so its 64 deftests are tests. Run over clojure/clojure src/clj, ring, compojure, datascript, and metabase src (tools/corpus/clojure.sh), the grammar failed 84 of 1,974 files on reader syntax it lacked. The fixes, marked canon: and mirrored in the dialect: a quote may follow a symbol's first character, as db' is written; ##Inf, ##-Inf, and ##NaN are SYMBOLIC_VALUE numbers; a namespaced map, #:ns{...}, #::{...}, or #::alias{...}, is ns_map; a var quote quotes any form, so #'~name parses; and a map is any run of forms, since a discarded #_x may stand among its entries. Every file now parses with both grammars and none is excluded; grammars/clojure/README.md holds the table.
  opened: 0.1.0
  decided: 0.1.0
  refs: [clojure-reader, grammars-v4, REQ-clojure-support]

DEC-clojure-dialect:
  status: decided
  question: What does the canonically commented dialect of the Clojure grammar look like, given that Clojure documents a definition with a docstring inside the form rather than a comment above it, that the grammar is a generic reader of s-expressions, and that a docstring is a string told from any other only by where it stands?
  answer: |
    grammars/clojure/canonically_commented/Clojure.g4 is the fixed grammar with a definition rule tried before the generic list wherever a form may stand. Its alternatives are the definition forms Clojure documents, each a unit: defn and defn- as function, defmacro as macro, defmulti as multimethod, defprotocol as protocol with each method signature as method, defrecord as record, deftype as type, def as var, and deftest as deftest. The name after the form's head and its metadata is the What, and the docstring after the name, or the string of :doc in a metadata map on the name, is the Why; a def's string is its docstring only when a value follows it. The docstring of the file's leading ns form, or its :doc metadata, is the file's Why. Since a docstring cannot be told from a string lexically, the string token itself is labeled why, and canon reads a why that is one string literal without its quotes and escapes, each line trimmed, with its ref:KEY and license:KEY citations read from the text. A ; comment is not documentation. defn, defmacro, defmulti, and defprotocol are labeled required, because a public function, macro, multimethod, or protocol is what a namespace exports; the methods of a protocol are labeled inherited; defn- is private, and ^:private and ^:no-doc metadata, the latter codox's mark for what is left out of the API documentation, are labeled optional, which wins. A def, a record, and a type need no docstring by their form, and a deftest, which takes none, has its Why in :doc metadata and always needs one, as every test does. A string after a function's parameters with more body forms after it is a misplaced docstring, which clj-kondo warns of, and is an orphan; a string that is the last form is the body's value. A form under a quote, a syntax quote, or a #_ discard is data, so a definition form there is no unit. Any other head that starts with def followed by a symbol, a definition macro a library writes itself such as hiccup's defelem and defhtml, or defonce, is a unit of kind def whose docstring is a string after the name with more forms after it; default, defer, and their longer forms are calls, and Leiningen's defproject takes a version string, so these are plain symbols. A defmethod is a unit of kind method named by its multimethod and its dispatch value joined with a dot, as render.:circle, and needs no docstring. A (comment ...) form is never evaluated, so it and every list, vector, map, and set inside it are read as data and a definition there is no unit. A docstring's ref:KEY citations are its Why's references, read from its text. A definition nested in a body is a unit of the unit around it. On the hiccup sample the dialect parses all 21 files, finds 57 functions, 11 macros, 2 multimethods, 4 protocols, 14 methods (4 protocol methods and 10 defmethods), 1 type, 9 vars, 27 defs, and 64 tests, and binds 81 docstrings with no orphan. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [clojure-docstrings, clojure-special-forms, clj-kondo-misplaced-docstring, REQ-clojure-support]

DEC-erlang-grammar:
  status: decided
  question: How does canon read Erlang, given that the vendored grammars-v4 Erlang grammar stops at OTP 23, has no preprocessor, and lexes X-1 as X followed by -1, so it parsed 6 of recon's 16 files, and that OTP 27 documents with -doc and -moduledoc attributes holding strings while EDoc documents with comments above the -spec of a function?
  answer: |
    Through the vendored grammars-v4 Erlang grammar under grammars/erlang, changed where Erlang or canon requires, each change marked canon: in the grammar and listed in grammars/erlang/README.md. A number has no sign, so prefixOp reads a minus, and may group digits with underscores; a character may be a control or hexadecimal escape; a comment may end the file; an escript's #! line is skipped. Strings may be triple-quoted, or quoted with four or five quotes, and sigils are read, as OTP 27 writes them. The preprocessor is read, not run: a macro call is read where an expression, a pattern, a type, an atom or variable in a fun, a record name, a string part, a whole form, or a function clause may be; a macro followed directly by a list element stands for an element and its comma; -define takes any balanced tokens as its body when it is no expression; and -if, -ifdef, -else, and -endif are attributes, so both branches parse. OTP 25 to 28 syntax is added: maybe expressions and ?=, map comprehensions and generators, strict and zip generators. A union member may be annotated, and the right side of a match may be a catch. A function is a form of its own with the -spec, -doc metadata, and other attributes directly above it, labeled marker, so an EDoc comment above the spec documents the function; a -doc with a string is not taken, since canon scans it. -doc false and -moduledoc false are labeled hidden, by DEC-hidden-label. Types, records, and callbacks have rules of their own named by what they define. On that grammar all 16 of recon's files and every file of OTP's stdlib, kernel, and eunit parse. The recon profile lists -doc as a doc attribute and -moduledoc as an inner one, so -doc binds to the function below it across blank lines and -moduledoc to the file, and makes functions, callbacks, types, and records units. The macros a file defines are expanded before the parser sees them, as epp expands them: both grammars name the ErlangPreprocessor hook as their superClass, and the hook records each -define, one per name and arity, and replaces each call of a recorded macro with its body, its parameters replaced by the arguments, every token placed at the call; so a macro that stands for part of a form, such as an element followed by a comma or the begin of a block, parses as its expansion does. Of two definitions of one name and arity in the branches of an -ifdef, the later is used, since canon does not choose branches. A macro the file does not define, such as ?MODULE or one from an included header, is not expanded; the grammar reads it in the places listed above, and one that stands for anything else is still a parse failure. Floats may have a base, as in 2#1.0#e-53. A function, a type, and a callback are named by name and arity, as info/2, because their arguments are labeled arity, an element label whose count of top-level arguments canon appends to the name; EUnit's tests are then the functions named *_test/0 and *_test_/0. The profile names EDoc's @private and @hidden as hiddenTags, so a comment holding one hides the unit it documents, by DEC-hidden-label. A parse that fails late in a long file took minutes and tens of gigabytes; that is the parser's to fix, by memoising loops, not the grammar's. The corpus of tools/corpus/erlang.sh, Erlang/OTP's lib/ sampled to nineteen applications with their test suites, RabbitMQ's deps/ sampled to twelve, ejabberd, and recon at pinned commits, 4154 files, parses but for four files the compiler rejects or never compiles, two invalid common_test fixtures, a merl example whose -doc lacks its dot, and leex's template, after these changes, each marked canon: in the grammar and the dialect: OTP 29's native records, -record #name{...}, #mod:name{}, #_{}, and a record named by a variable or a reserved word; comprehensions of several values; a call of any expression, as F()(X) and ?MODULE:f():g(); catch as an operand; a macro naming a function, the module of a spec or a remote type, or standing for the clauses of a function; a macro argument with a guard; - spec with a space; nested type annotations; an empty file; and strings and sigils of up to seven quotes. The hook no longer expands a macro inside its own expansion, which epp refuses, so -define(A, ?A + ?A). no longer doubles at each of sixteen levels, while a definition of another arity still expands; it expands a call's arguments before placing them and makes ??Arg a string. Before them 185 files failed. The largest OTP suites, 28,000 to 32,000 lines, take 20 to 26 CPU seconds, the parser's cost of their length.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-erlang, erlang-documentation, edoc-user-guide, erlang-preprocessor, REQ-erlang-support, erl-parse-otp-29]

DEC-hidden-label:
  status: decided
  question: How does canon treat a unit its language hides from the documentation on purpose, as Elixir's @doc false and @moduledoc false, Erlang's -doc false, -moduledoc false, and EDoc's @private, and Gleam's @internal do?
  answer: |
    As hidden. A grammar labels the mark hidden. A unit whose node holds a hidden element, outside the units nested in it, is hidden, and so is every unit inside it, as @moduledoc false hides a module's functions; a hidden element outside every unit hides the file. A hidden unit requires no comment, whatever its rule, a required element, or the export rule says, unless it is a test, which always requires one. The model records the requirement as hidden rather than optional, because the author decided it. A doc comment that a profile binds directly above a unit marked hidden binds to nothing and is reported, as a later @doc false overrides an earlier @doc; a dialect says the same in grammar form. A profile's comment syntax may name hiddenTags, such as EDoc's @private and @hidden: a doc comment holding one as a word stays the Why of the unit it documents and hides that unit. An element inside an orphan marks nothing, since an orphan documents nothing: an EDoc comment holding @private between two clauses of a function, or inside one, hides neither the function nor the file.
  opened: 0.1.0
  decided: 0.1.0
  refs: [elixir-writing-documentation, erlang-documentation, edoc-user-guide, REQ-elixir-support, REQ-gleam-support, REQ-erlang-support]

DEC-source-encoding:
  status: decided
  question: How does canon read a source file that is not valid UTF-8, given that Erlang reads a file that declares coding latin-1 as Latin-1 and OTP's own edoc and eunit tests hold such files, while canon read every file as UTF-8 and failed to decode them?
  answer: |
    As UTF-8 when it is valid UTF-8, and otherwise as Latin-1, which decodes every byte sequence. The parse subcommand, extraction, and the Folio's tangle read a file through one function, Canon.Antlr4.Interpret.readSourceFile, so all three agree. canon does not read the coding comment itself: a file declared latin-1 that happens to be valid UTF-8 is read as UTF-8, which differs from Latin-1 only in text outside ASCII, and a file declared UTF-8 that is not is read as Latin-1 rather than rejected, as epp would reject it.
  opened: 0.1.0
  decided: 0.1.0
  refs: [erlang-source-encoding, REQ-erlang-support]

DEC-elixir-dialect:
  status: decided
  question: What does the canonically commented Elixir dialect say, given that Elixir documents with @doc, @typedoc, and @moduledoc attributes rather than comments, that the last @doc before a definition wins, and that a function is several clauses?
  answer: |
    The dialect under grammars/elixir/canonically_commented is the plain grammar plus lexer modes that tokenize a @doc, @typedoc, or @moduledoc string, heredoc, or sigil heredoc as a canonical comment, with interpolations read as code in the default mode and an uppercase sigil read without them. Each kind of definition is a labeled unit alternative. Before it, documentation, @doc false, and attributes come in any order and the last doc wins, so an earlier @doc is an orphan and a later @doc false labels the unit hidden. A module's Why is the first @moduledoc anywhere in its body; a second one is reported. Public functions, macros, guards, delegates, callbacks, modules, and protocols label their keyword required. The clauses of a function, macro, or guard are labeled merge, which the extractor reads as the profile's mergeClauses: adjacent units of one rule, kind, and name are one unit unless a later one has a Why of its own or is hidden. Tests and describe blocks are units named by their string, and a test always requires a comment. A @typedoc has a token of its own and documents a @type, @typep, or @opaque only; above anything else it is an orphan, as a @doc above a type is. The first why element in a unit's node is its Why wherever the grammar puts it, and any other is reported. On the 308 files of Jason, Plug, and Phoenix the dialect parses every file and reports the same missing comments as the profile. A @doc, @typedoc, or @moduledoc is an expression in Elixir, so it may be an operand, as in x + @doc "text", where it is labeled orphan; and the parser grammar names the three comment rules in strayComment options, so one the grammar does not accept where it stands is read out of the file and reported as an orphan, by DEC-stray-comments. A @doc written with parentheses, @doc("text"), is an attribute call and not read as documentation.
  opened: 0.1.0
  decided: 0.1.0
  refs: [elixir-writing-documentation, REQ-elixir-support]

DEC-gleam-dialect:
  status: decided
  question: What does the canonically commented Gleam dialect say, given that the Gleam compiler joins every /// line since the previous item into the documentation of the next one and every //// line into the documentation of the module?
  answer: |
    The dialect under grammars/gleam/canonically_commented is the plain grammar plus a DocLine lexer mode for /// and //// lines; a // comment that is no documentation is skipped. Consecutive /// lines, blank lines between included, are one canonical comment, the Why of the item below its attributes, as the Gleam compiler reads them; the profile does the same through joinAcrossBlankLines. //// comments are labeled file, a label whose elements, outside every unit, are joined in order into the Why of the file. Public functions, types, and constants label pub required; constructors and labelled fields are optional units; a /// before an import or an unlabelled field is an orphan. @internal is labeled hidden. On the 116 current modules and the 182 pre-1.0 stdlib modules the dialect parses every file. /// lines inside a function body, an argument list, or any other bracketed part are labeled orphan, where the Gleam compiler would join them into the documentation of the next item; a reader of the file sees them document nothing, so canon reports them. The parser grammar names canonicalComment in a strayComment option, so one the grammar does not accept where it stands is read out of the file and reported as an orphan, by DEC-stray-comments.
  opened: 0.1.0
  decided: 0.1.0
  refs: [gleam-documentation-comments, gleam-compiler-parser, REQ-gleam-support]

DEC-erlang-dialect:
  status: decided
  question: What does the canonically commented Erlang dialect say, given that Erlang documents with OTP 27 -doc strings or with EDoc comments, that a module's public API is its export list, and that the plain grammar is a combined grammar, which may not have lexer modes?
  answer: |
    The dialect under grammars/erlang/canonically_commented is the plain grammar split into ErlangLexer.g4 and ErlangParser.g4, with the literals of the parser named as lexer tokens, plus lexer modes for -doc and -moduledoc strings of one, three, or four quotes and for EDoc comments: a comment whose first line starts with a tag such as @doc, running over the comment lines below it. A -doc string or an EDoc comment above a function, type, record, or callback, or among the attributes above it, is its Why. The last one wins, so an earlier one is an orphan, and a later -doc false labels the unit hidden; an EDoc comment opened by @private or @hidden, or holding either tag, labels it hidden too. -moduledoc and an EDoc comment above -module are labeled file. Entries of -export and -export_type, written name/arity, are labeled export, so by DEC-export-rule a unit, named by name and arity, requires a comment when it is exported; callbacks always do. A module that compiles with export_all, -compile(export_all) or a -compile list holding it, exports every function, so every unit requires a comment, as in a header, which has no module declaration and is included where its definitions are used. Any other module exports only what its export lists name, and nothing when it has none: its module declaration is then read by an alternative that labels the attribute's name export, an entry that names no unit, so the file has an export list that requires nothing beyond it. The dialect parses every file of the corpus of tools/corpus/erlang.sh that the grammar parses, 4150 files. An EDoc comment between two clauses, as gen_server callbacks often carry above each, is read there as an orphan instead of recovered as a stray comment, which parsed the file once more for each such comment. A record is tried before the other units and takes the attributes above it lazily, because an untyped record also reads as an attribute, which a record or type below took as a marker, so the record was no unit and its comment went to the unit below. The module declaration may carry the parameters of a parameterized module, an export entry may be ?MODULE/0, and an -export_type entry may be the old tuple {Name, Arity}, which is read but exports nothing. EDoc comments anywhere in a function, among its arguments or clauses or at the end of a block, are orphans: the parser grammar names canonicalComment and moduleComment in strayComment options, so one the grammar does not accept where it stands is read out of the file and reported, by DEC-stray-comments.
  opened: 0.1.0
  decided: 0.1.0
  refs: [erlang-documentation, edoc-user-guide, REQ-erlang-support]

DEC-hcl-grammar:
  status: decided
  question: How does canon read HCL and Terraform, given that the grammars-v4 Terraform grammar parses under two thirds of real Terraform files in canon's interpreter, that HCL ends an attribute at a line break except inside brackets, that HCL has no doc comment syntax, and that Terraform documents a variable or an output with a description attribute rather than a comment?
  answer: |
    Through an HCL grammar written for canon under grammars/hcl, from the HCL native syntax specification. The grammars-v4 Terraform grammar parsed 344 of the 554 .tf files of eight real modules in canon's interpreter and none of their .tfvars or .hcl files; it was evaluated and not vendored. canon's grammar reads bodies of attributes and blocks, expressions with the specification's operators, function calls with provider namespaces, for expressions, splats, quoted and heredoc templates with interpolations and directives in lexer modes, and all three comment forms. It parses all 592 .tf, .tfvars, and .hcl files of those modules, 2.0 MB. The HCLLexerBase superClass selects the Canon.Antlr4.Lex.HCL hook, which hides line breaks inside parentheses, brackets, interpolations, and object for expressions, and directly after an opening brace, and closes each heredoc at the line that holds only its delimiter word. In the dialect under grammars/hcl/canonically_commented every comment is a canonical comment, because HCL has no other kind; the hook hides a comment after code on its line or inside brackets, and hides the line break between a comment line and the line directly below it, so consecutive comment lines are one comment and a comment binds only to the block directly below it. A comment that a blank line parts from what follows, or that sits above what is not a unit, is a note: accepted, unlabeled, and not reported, so section banners are no findings. Each top-level block is a unit named as Terraform addresses it: resource and data by type and name, module, variable, output, provider, and run by their label, terraform by its keyword, and any other block, of kind block, by its type and labels. A unit whose own alternative holds several what elements is named by their texts joined with a dot, which any dialect may now use; a unit whose what elements all sit below its alternative is named by the first, as before. Each entry of a locals block is a unit of kind local; the block itself is none, so the entries keep their local.name addresses. A top-level attribute, as in .tfvars and terragrunt.hcl, is a unit of kind attribute. The description of a variable or an output is a Why, because Terraform shows it as their documentation, and a comment directly above wins over it. A why element that is not a canonicalComment is documentation written as data: its prose is the string without its quotes, heredoc delimiters, or common indentation, and its citations are read from its text. A comment opened with a hash, two slashes, or a slash and one star loses its markers on every line. variable and output are labeled required, because they are a module's interface; other blocks may have a Why. A block that has no labels to tell it apart is named by what does: a provider and any other block by its alias, as Terraform addresses provider.aws.west, moved and removed blocks by the address they move from, and import blocks, of kind importBlock since import is an ANTLR keyword, by the address they import to; only blocks that nothing tells apart are numbered. A template's if and for directives must pair with endif and endfor, or the template does not parse, as Terraform rejects it. A file whose first token is a brace is in Terraform's JSON syntax, which the hook reads without line breaks and the dialect reads into the same units with the same names: the keys above a block that are part of its address, such as a resource's type, are labeled qualifier, a new label that makes them the first parts of the name of every unit below; a property named // is a comment in that syntax and is a block's Why, and of a variable or an output it wins over a description written before or after it, as a comment above wins over a description in the native syntax; and a top-level property that is not a block type canon knows is an attribute, since JSON has no schema to say otherwise. The HCL profile owns *.tf.json and *.tfvars.json by name. A why element inside an optional or repeated block is optional, as a JSON block's comment property is. HCL has no annotations, so nothing is labeled marker. The test table gains hcl: a unit of kind run, which terraform test runs. The limits are listed in grammars/hcl/README.md. The sample is terraform-aws-key-pair 3.0.1's root module, complete example, and wrappers, vendored with its Apache-2.0 license. A comment in any other place, inside an expression, among the arguments of a call, in an object, a for expression, or an interpolation, or at the end of a block, parses and is a note, since the hook hides a comment inside brackets or after code and the grammar accepts the others; a comment that documents nothing is not reported in HCL, because every HCL comment is canonical and every banner would be a finding. Identifiers are Unicode identifiers, as the specification says, ID_Start or an underscore and then ID_Continue or a dash, in two character sets that share no way to match a character, so lexing is as fast as with ASCII alone; an attribute's name and a block's type may be quoted strings, as HCL 1 allows and Nomad's agent and volume files still write, and the dialect names a quoted top-level name without its quotes; and a comment between an object for expression's brace and its for is a note. tools/corpus/hcl.sh parses 2,039 files, 5.2 MB, of thirty terraform-aws-modules repositories, the examples of terraform-provider-aws and terraform-provider-google, Terraform's valid configuration test data, Nomad's e2e and demo HCL, and packer-plugin-amazon, each pinned to a commit: every file parses with the plain grammar and with the dialect, none is excluded, and the units of every file that parsed before are unchanged. The repositories, commits, and per-repository table are in grammars/hcl/README.md.
  opened: 0.1.0
  decided: 0.1.0
  refs: [hcl-native-syntax-spec, terraform-language-docs, terraform-test-docs, grammars-v4-terraform, REQ-hcl-support]

DEC-pulumi-yaml-grammar:
  status: decided
  question: How does canon read Pulumi YAML programs, given that grammars-v4 has no YAML grammar, that YAML nests by indentation and ends a block scalar by indentation, that a YAML comment documents the entry below it only when nothing parts them, that Pulumi documents a config key with a description field, and that a Pulumi program lives in Pulumi.yaml or Main.yaml rather than in every YAML file?
  answer: |
    Through a grammar of the block structure of YAML 1.2 written for canon under grammars/yaml, from the YAML 1.2.2 specification, with a dialect under grammars/yaml/canonically_commented that reads a Pulumi program by its sections. The grammar reads block mappings and sequences, complex keys, plain, quoted, literal, and folded scalars, flow collections, anchors, aliases, tags, directives, and document markers. The YAMLLexerBase superClass selects the Canon.Antlr4.Lex.YAML hook, which turns indentation into INDENT, DEDENT, and NEWLINE tokens outside flow collections as the F# hook does, indents the content after a sequence entry's dash to its own column, and ends a block scalar at the first line not indented past the key or dash on its header's line. In the dialect the hook holds each comment until the next code token has its layout tokens and emits it just before that token, and hides it when code precedes it on its line, when it sits in a flow collection, or when a blank line parts it from the next code. Each entry of the resources, variables, outputs, and config sections is a unit named by its key, which is how Pulumi addresses it; a resource's type is part of its How. The comment directly above an entry is its Why. The description of a config key is a Why too, because Pulumi shows it as that key's documentation, and a comment above wins over it; Pulumi defines no description on a resource, variable, or output. Outputs require a Why, because they are a stack's interface, and so does a config key that declares a type or a default, labeled required; a key that only sets a value, as a stack file's keys do, may have one. A profile may name files by pattern under files, matched against a file's name before any profile's extensions, so the Pulumi profile owns Pulumi.yaml, Pulumi.yml, Pulumi.<stack>.yaml, and Main.yaml without claiming every YAML file. The entries of the template section's config, which pulumi new asks for, are units of kind templateConfig, read as config keys are. The hook splits a quoted scalar into its quotes and its text, so a quoted key is named without quotes, and splits a plain scalar that starts with the colon of a JSON-like pair, as in {"a":1}, into that colon and the value. A Pulumi interpolation such as ${a} inside a flow plain scalar is part of the scalar, as Pulumi means it, beyond strict YAML 1.2. The dialect parses all 693 Pulumi.yaml, stack, and Main.yaml files of the pulumi-yaml repository and the Pulumi examples. Nothing is labeled marker, since Pulumi YAML has no tests. The limits are listed in grammars/yaml/README.md. The sample is the Pulumi.yaml programs of three Pulumi examples, vendored with the repository's Apache-2.0 license. A comment in any other place, among a resource's properties, in a sequence or a flow collection, after a block scalar, or at the end of a section, parses and binds to nothing without a finding, for the reason HCL's notes have none. Tab indentation, which YAML forbids, is counted as one column rather than rejected: Pulumi refuses such a program before canon would read it, and refusing it too would change no unit of a program Pulumi runs. YAML that is not a Pulumi program, such as a Kubernetes manifest, a GitHub workflow, a CloudFormation template, or an Ansible playbook, is read through the plain grammar under a plain YAML profile that owns .yaml and .yml with no units and no comment syntax, since such a file may have top-level config, resources, or outputs keys that the dialect would read as Pulumi units, and YAML has no doc comment syntax; the Pulumi profile's file names win over its extensions. Beyond the block subset the grammar reads what YAML 1.2 allows: a line indented past a plain scalar's parent continues the scalar whatever it holds, read as one PLAIN_CONTINUATION token by a lexer predicate of the hook and taking no part in layout; a plain scalar in a flow collection may span lines; three dashes or dots are a document marker only at the start of a line, which line break and space actions tell the hook, and a plain scalar elsewhere; a bare document may follow an end marker, and a document may be indented as a whole after its start marker; a complex key may be any node, in block and flow collections, the hook indenting what follows a question mark, or a colon that starts its line, as it does after a dash; a node's properties may stand on their own line above its block collection; and verbatim tags parse. tools/corpus/yaml.sh parses 3,532 files, 15.4 MB, of the Pulumi examples and pulumi-yaml, the Kubernetes examples and documentation examples, the .github YAML of twenty-three popular repositories, CloudFormation templates, Ansible examples, and Bitnami's chart values, each pinned to a commit: 1,043 are Pulumi programs and stack files, every file parses with the plain grammar and with the dialect but two templates excluded as not YAML until rendered, a Mustache template in a Pulumi example and a Helm template in pulumi-yaml's test data, and the units of every Pulumi program are unchanged. No YAML 1.2 construct is known to be unsupported. The repositories, commits, and per-repository table are in grammars/yaml/README.md.
  opened: 0.1.0
  decided: 0.1.0
  refs: [yaml-1-2-spec, pulumi-yaml-reference, pulumi-project-file, REQ-pulumi-yaml-support]

DEC-loop-memo:
  status: decided
  question: How does canon keep a file that does not parse from taking minutes to fail, given that the interpreter memoises rules by position but re-read a repeated element at every position it was reached from, and a failing parse forces every way a loop can split its input, such as the 2^n ways a group of n comment lines can be split into notes?
  answer: |
    Every element repeated with a star or a plus, in every rule and in every shape of a left-recursive rule, gets a number, and a loop's result at a position, the linear walk of DEC-parser-memory from there, is kept in a memo table of the loops keyed by position and then by the loop's number, filled only as entries are asked for, as the rules' table is, so a loop is read once at each position however it is reached and a loop read at a few positions allocates little. Merged with canon-parity, the table first allocated a chunk of 64 positions per loop as canon-iac had it; the sparse table reads commons-lang's StringUtils.java in the time and memory it took before loops were memoised, 0.6 seconds and 218 MB, where the chunked one took 305 MB, and a 13,000-line C# initializer in 5.9 seconds as before. A loop whose body asks a semantic predicate is not memoised, since a predicate may read where the rule around it started. A rule in a left-recursive group without precedence shapes is read by fixpoint iteration and keeps the unmemoised loop, since its entries change between iterations. The trees and the furthest position a failure reports are those the interpreter gave before, which the vendored-grammar tests, the identical check output of every sample whose sources were present, commons-lang's 13,368 findings among them, and the identical trees of 150 Terraform files parsed by both builds confirm. A syntax error in terraform-null-label's main.tf, below a 16-line comment group, failed after 25 seconds, or not within 60, and now fails in under a tenth of a second; parsing commons-lang's StringUtils.java allocates 0.8% more, within the noise of its time.
  opened: 0.1.0
  decided: 0.1.0
  refs: [REQ-hcl-support]
