DEC-parser-foundation:
  status: decided
  question: Which parsing foundation should canon use to read and interpret ANTLR4 grammars, given that antlr-haskell was the obvious candidate?
  answer: |
    grammatical-parsers for the hand-written .g4 reader, and a direct interpreter for grammars loaded at run time.

    antlr-haskell 0.1.0.2 was evaluated on 2026-09-12 against Stackage LTS 24.58 with GHC 9.10.3 and rejected: it does not build there, it supplies grammars only through a quasiquoter rather than from .g4 files, its own test for the grammars-v4 C grammar is commented out, and open issues cover the skip command, grouping, and left recursion elimination. Earley is in the snapshot but unreleased since 2019. A hand-written packrat core would have had to be built and tested before anything else.

    grammatical-parsers is actively maintained, tested on GHC 9.10, and represents a grammar as a first-class Rank2 record. The .g4 reader is a single scannerless grammar record on its PEG packrat backend, which makes ANTLR's LexerAdaptor unnecessary because the grammar always knows whether it is inside a parser rule or a lexer rule.

    Loaded grammars are interpreted directly instead, because a Rank2 record's field set is fixed at compile time and an interpreted grammar's rule set is known only at run time. The lexer takes the longest match with ANTLR's tie-breaking and exits non-greedy loops at the first iteration count that lets the rest match; the parser is a memoised all-parses parser whose first complete parse by alternative order wins, with left recursion handled by iterating each cyclic rule group at a position to a fixpoint. Semantic predicates are answered by a parser hook keyed by superClass and hold where no hook knows them, as DEC-parser-predicates records. Lexer actions go through a hook interface keyed by superClass. The memo table is filled as entries are asked for, as DEC-parser-memory records.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grampa-2017, warth-2008, antlr-haskell, grammars-v4]

DEC-canonical-antlr4-dialect:
  status: superseded
  by: DEC-grammar-carries-extraction-rules
  question: What does the canonically commented dialect of the ANTLR meta-grammar look like?
  answer: |
    Three changes to the upstream meta-grammar: doc comments stay on the default channel, a parser rule must be preceded by a doc comment, and a non-fragment lexer rule must be preceded by one while a fragment may be. Every rule in both dialect files carries a doc comment, so the dialect parses its own grammars and rejects the upstream file.
  opened: 0.1.0
  decided: 0.1.0
  refs: [canon-provisional-syntax]

DEC-decision-ledger:
  status: decided
  question: How are decisions tracked so that the list of open ones cannot go stale?
  answer: |
    Decisions live in canonical_decisions.yaml, keyed like registry references so a comment cites one with ref:KEY. Entries are never deleted; status moves from open to decided or superseded. An open decision names the version by which it must be revisited, and canon check fails once the project version reaches it. A decided decision that no canonical comment cites is reported, informationally until Haskell code units exist. Prose decision records in to_be_removed were migrated into this ledger.
  opened: 0.1.0
  decided: 0.1.0

DEC-precedence-climbing:
  status: decided
  question: Should the interpreter rewrite directly left-recursive rules into precedence levels as ANTLR does, so that expression grammars from grammars-v4 give ANTLR's trees rather than the first parse by alternative order?
  answer: |
    Yes. A directly left-recursive rule is interpreted with ANTLR's precedence climbing: alternatives are classified as primary, prefix, binary, or suffix; earlier alternatives bind tighter; a binary alternative's right operand is parsed at the next higher precedence unless the alternative carries assoc=right; a prefix operand is parsed at the alternative's own precedence. This removed an exponential blow-up on the R grammar's expression rule, which timed out before and parses in under a second after. Indirect left recursion, which ANTLR rejects, still goes through the fixpoint path.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-comment-attachment:
  status: open
  question: The extractor binds a doc comment to the rule on the line directly below it, while the canonical dialect grammar binds it to the next rule regardless of blank lines because whitespace is off channel. Which notion is canonical, and does the same rule hold for Haskell and other languages?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [canon-provisional-syntax]

DEC-version-duplication:
  status: open
  question: canon.yaml carries the project version that package.yaml also carries, and only canon.yaml can carry a semantic versioning pre-release label. Should canon read the numbers from package.yaml, or check the two agree?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [semver-2]

DEC-cabal-file:
  status: open
  question: canon.cabal is ignored and regenerated from package.yaml by stack. Should it be committed so plain cabal users can build without hpack?
  opened: 0.1.0
  revisit: 0.2.0

DEC-sample-project-readme:
  status: open
  question: Rule 2 treats each directory under sample_projects as its own project with its own README.md. That reading was an assumption, not an instruction. Is it right?
  opened: 0.1.0
  revisit: 0.2.0

DEC-nested-root-check:
  status: decided
  question: canon check at the repository root includes the sample projects, which are upstream code that is not canonically commented, so the root check always fails. Should nested projects be included by default, reported separately, or opted into?
  answer: |
    Excluded. A nested project is a boundary: the enclosing project's check stops at it, canon files lists it, and checking it is a separate run from its own directory with its own configuration, registry, ledger, and vetting file. A project answers for itself and nothing else, so the root check reports canon's own state and each sample reports its own.
  opened: 0.1.0
  decided: 0.1.0

DEC-grammar-coverage-findings:
  status: open
  question: Files that an upstream grammar cannot lex or parse are reported as failed extractions alongside missing comments. Should grammar coverage gaps be a separate, informational finding so that canonical-comment findings stay clean?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [grammars-v4]

DEC-one-tree-per-span:
  status: decided
  question: The parser enumerated every derivation of every span, which is exponential on ambiguous grammars and exhausted memory on the Haskell grammar. What does the parser keep?
  answer: |
    One tree per rule, start position, and end position, the first in preference order: alternatives in grammar order, greedy loops longest first, precedence climbing for left recursion. Recognition is unchanged because every reachable end position is kept, so no parse is lost; only alternative derivations of the same span are dropped. A 10 KB Haskell module parses in about ten seconds within half a gigabyte where it previously ran out of memory.
  opened: 0.1.0
  decided: 0.1.0

DEC-extraction-cache:
  status: decided
  question: How does canon check avoid re-parsing files that have not changed?
  answer: |
    Each file's extraction is cached under .canon-cache/ in the project directory as YAML, keyed by a SHA-256 of the file content, the grammar sources and profile it was parsed with, the git revision, the file's dirty state, the project's git describe output and full tag list, the version in canon.yaml, and canon's own version, and the path. Every input that reaches the model is in the key, so a cache hit is exact; the tag list is included because a tag added on an older commit changes the version a unit was introduced in without changing HEAD or describe. The directory is ignored by the walk and by git and can be deleted at any time; a miss simply parses.
  opened: 0.1.0
  decided: 0.1.0

DEC-parser-generation:
  status: decided
  question: Is the parser hand-tuned per language, or generated from the grammar?
  answer: |
    Generated. Both the lexer and the parser are compiled once from the grammar value with no per-language code: decoded literals, character predicates, and first-character filters for the lexer; FIRST sets, nullability, precedence shapes, and vector memo tables for the parser. The only per-language code is a lexer hook for grammars whose upstream base lexer runs target-language actions, selected by the grammar's superClass option. Profiling the largest Haskell sample after these changes puts the parser under one percent of the time and the lexer's matching functions at nearly all of it, so further speed comes from a lexer DFA, not from the parser.
  opened: 0.1.0
  decided: 0.1.0

DEC-comment-reasons:
  status: decided
  question: What are the reasons a canonical comment exists, and where does a file-level comment such as a license notice attach?
  answer: |
    Three reasons: Why, a reason in prose; Ref, a pointer into the registry written ref:KEY; and License, a pointer to a registry entry of kind license written license:KEY. A doc comment at the top of a file, on its first non-blank line, is the file-level canonical comment and binds to the file unit, which for a grammar is the grammar itself. A comment that reads like a license or copyright notice but cites no license key is reported informationally, and a license key that resolves to a non-license registry entry fails the check. The canonically commented meta-grammar allows a doc comment before the grammar declaration for this purpose, and its own files carry their BSD notice there.
  opened: 0.1.0
  decided: 0.1.0

DEC-grammar-carries-extraction-rules:
  status: decided
  question: Where do the rules for slurping the five W's and the H out of a canonically commented file live, and what is the difference between a language's plain grammar and its canonically commented grammar?
  answer: |
    In the canonically commented grammar. The plain files under grammars/<lang>/ are the language's own grammar, with its rules as upstream publishes them, carrying a canonical comment on every unit the language requires one on. The files under grammars/<lang>/canonically_commented/ are the plain grammar plus the rules that define canonical comments and locate the answers: a canonical comment is tokenized in its own lexer mode into prose, ref:KEY citations, and license:KEY citations, and a parser rule alternative labeled with a hash names a unit kind, with element labels why, what, and how marking the comment, the name, and the body. canon generates the extraction parser from that grammar, so a unit is any node whose alternative is labeled, its What is the what-labeled text, its Why is the why-labeled comment, its How is the how-labeled span or the whole node, and the comment is required exactly when the why element has no optional suffix. The ANTLR meta-grammar is the first language done this way: grammarDefinition, parserRule, lexerRule, fragmentRule, and lexerMode are its unit kinds. The hand-written ANTLR extractor and the separate canonical grammar entry in canon.yaml were removed; the line-adjacency profile path remains for languages whose dialect grammars do not exist yet.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-comment-vetting:
  status: decided
  question: When canon is introduced to an existing codebase, how does an existing comment become trusted, who judges it, and what happens while it is unjudged?
  answer: |
    Rule 7. Every canonical comment gets an entry in canonical_vetting.yaml keyed by its decision id, holding a verdict and a digest of the comment text. canon ingest writes pending entries for every comment without one. A human sets good, bad, or deferred with a revisit version, and commits; the assessor is the author of the commit that last touched the verdict line, read with git blame, so the file never names a person and cannot lie about one. Pending is a state, but an invalid one for the report: canon check fails every pending, stale, bad, or overdue comment and prints that the report is invalid while any comment is pending. A verdict applies to the digested text only, so a rewritten comment is pending again, and a comment without an entry is pending once the file exists, which makes the author of a new comment its first assessor.
  opened: 0.1.0
  decided: 0.1.0

DEC-required-orphan-labels:
  status: superseded
  by: DEC-marker-label
  question: How does a canonically commented grammar say that a comment is required only under some condition, such as Java's public modifier, and how does it accept a doc comment it does not bind?
  answer: |
    Two more element labels. A match containing an element labeled required has a required comment, so the Java dialect writes required = PUBLIC among a member's modifiers and required = interfaceMethodDeclaration for interface members. An element labeled orphan is a comment the grammar accepts but binds to nothing; the extractor reports it as an orphan doc comment. An alternative is a unit alternative only when its label comes with a why element, so upstream labels such as Java's expression alternatives are inert; without that rule the extractor treated every expression as a possible unit and was exponential in nesting depth.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-java-grammar-comments:
  status: decided
  question: The plain Java grammar under grammars/java/ carries no canonical comment on its own rules, unlike the ANTLR meta-grammar; who writes those comments, and until then is it right to ignore the Java dialect at the root?
  answer: |
    Written on 2026-09-15: every parser rule and every non-fragment lexer rule of the plain Java grammar carries a canonical comment, and the BSD header is its file-level comment with a license citation. The dialect is generated from the plain grammar and carries the same comments, extended on the rules that gained unit labels to say what they bind. Both are checked at the root like the ANTLR meta-grammar. Fragment rules stay uncommented, as in the meta-grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-tests-not-exempt:
  status: decided
  question: Public test methods require a canonical comment under the Java dialect; should test sources be exempt?
  answer: |
    No. A test exists because of a particular requirement, and that requirement is its Why: the canonical comment on a test cites the requirement it verifies with ref:KEY against a registry entry of kind requirement. The samples record the same decision in their own ledgers. How canon recognises a test unit so that it can insist on a requirement citation is a separate open decision.
  opened: 0.1.0
  decided: 0.1.0

DEC-test-requirement-check:
  status: decided
  question: A test's canonical comment must cite the requirement it verifies; how does canon recognise a test unit in each language, given that a grammar cannot match an annotation by name, so that it can report a test whose comment cites no requirement?
  answer: |
    The grammar says where markers sit and canon says which markers mean test. A canonically commented grammar labels annotations among a unit's modifiers with marker, and canon carries a fixed table per language name. For java: the JUnit 4 and 5 markers @Test, @org.junit.Test, @org.junit.jupiter.api.Test, @ParameterizedTest, @RepeatedTest, @TestFactory, and @TestTemplate, and the jqwik markers @Property, @Example, @net.jqwik.api.Property, and @net.jqwik.api.Example, each on a method, plus a method named test* under any src/test directory for JUnit 3; jetCheck has no annotations of its own, its property checks run inside JUnit test methods, so those are recognised by the JUnit markers. For erlang: a function named *_test or *_test_. For clojure: a deftest unit, or a definition named *-test. For prolog: a clause named test. For haskell: a function named prop_* or test_*. A marker matches when it equals the entry or is the entry followed by an argument list. A test unit carries test: true in the model and always requires a canonical comment. Two checks fail canon check: a commented test that cites no registry entry of kind requirement, and a requirement that no test in the project cites. The table is canon's knowledge as of 2026-09-15 and grows by decision.
  opened: 0.1.0
  decided: 0.1.0

DEC-marker-label:
  status: decided
  question: Which element labels does a canonically commented grammar use beyond why, what, and how, and what makes an alternative a unit?
  answer: |
    Four things. An alternative labeled with a hash is a unit alternative only when it contains a why element, so upstream labels such as Java's expression alternatives are inert. An element labeled required makes the comment required when it is present, which is how public makes a Java member's comment required and how interface members are required outright. An element labeled orphan is a comment the grammar accepts but binds to nothing, reported as an orphan doc comment. An element labeled marker is an annotation or similar mark on the unit, whose text canon reads to recognise tests. This supersedes DEC-required-orphan-labels by adding marker.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-name-what-comment-why:
  status: decided
  question: When a test's Javadoc says what it verifies, where does the What belong and what is left for the comment?
  answer: |
    Rule 8. The name is the What and states the fact the unit establishes in full words, so a test is named for the property it verifies. The comment is the Why and says why that fact must hold, citing the requirement or decision that records the reason. A comment that restates the name fulfils no purpose the name does not and is vetted bad. canon cannot judge this by Rice's theorem; the vetting human does. Worked example: Gson's testReflectionInternalField became verifyThatGsonPackagesAreOnlyExportedButNotOpenedForReflection with a comment giving the reason and citing REQ-module-not-opened in the sample's registry.
  opened: 0.1.0
  decided: 0.1.0

DEC-haskell-dialect:
  status: decided
  question: What does the canonically commented dialect of the Haskell grammar look like, and how does it coexist with the layout algorithm the base lexer port implements?
  answer: |
    The canonical comment forms are Haddock's: a line comment opened with two dashes and a bar, continued by directly following lines that start with two dashes, or a block comment opened with a brace, dash, and bar. Caret after-comments and plain comments are not canonical. The dialect lexer sends the doc opener into a DocLine or DocBlock mode that tokenizes prose, ref:KEY, and license:KEY; the line break that ends a doc line keeps the NEWLINE type and the newline action so the layout algorithm and the parser see it as usual. The dialect parser inlines each unit-bearing top-level form as its own labeled alternative with why, what, and how, labels export-list entries export, and absorbs a doc comment on a local binding, an instance method, or a constructor as an orphan. Two doc comments on consecutive lines merge, as Haddock also reads them. The base lexer port holds doc tokens until the next code token has produced its virtual braces and semicolons, then emits them just before it, so a doc comment never counts as the first token of a line and sits inside the block of the declaration it documents; it also dispatches lexer actions by the method they call rather than by rule name, so the dialect's DOC_CLOSE can carry the newline action.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-export-rule:
  status: decided
  question: Which Haskell units require a canonical comment, given that a module's public API is its export list and a grammar can label the list but not cross-reference it?
  answer: |
    The exported ones. A dialect that labels export-list entries export opts into the rule: a unit is required when its What is an exported name, is listed under its parent's entry, or its parent is exported with two dots; when the file has no export list, every unit whose What is a plain name is required. An instance's What is its head, which is not a name, so an instance never requires a comment by this rule. The grammar's own required labels and test recognition still apply. Erlang's export attribute is the next user of the mechanism.
  opened: 0.1.0
  decided: 0.1.0

DEC-haskell-grammar-fixes:
  status: decided
  question: The grammars-v4 Haskell grammar could not parse thirty-five of canon's own seventy-seven Haskell files; is it right to change the vendored grammar, and how?
  answer: |
    Yes, where the grammar rejects Haskell that GHC accepts, and each change is commented in the grammar and cited here. Character and string literals are written in the standard form with escapes and gaps, because the enumerated form rejected escapes and let a backslash be an ordinary character, which made a string holding two backslashes match past its closing quote and lexing exponential. The contextual keywords by, group, using, pattern, family, role, and rec are accepted as variable identifiers, and pragma names such as SCC as constructor identifiers, because GHC treats them as ordinary names outside their extensions. In the base lexer port, a where or a closing brace that starts a line at or left of the current block's indentation closes the implicit blocks above it, which is the case the upstream port left open and which every where after a case hit. Two constructs remain outside reach, because they need the parse-error rule of the layout algorithm: a case whose alternatives end at a closing parenthesis or bracket on the same line, and a let inside a comprehension; canon's own code avoids both.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-haskell-grammar-comments:
  status: decided
  question: Does the plain Haskell grammar carry a canonical comment on each of its own rules, as the ANTLR and Java grammars do?
  answer: |
    Yes, written on 2026-09-15: every parser rule and every non-fragment lexer rule, with the BSD header as the file-level comment citing its license. The dialect is generated from the plain grammar and carries the same comments, extended on the rules that gained labels. Both are checked at the root.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-canon-comment-standard:
  status: decided
  question: canon's own source carried no comments until a standard existed; what is the standard?
  answer: |
    Canonical comments in Haddock form, on exported units and module headers, and nothing else. Every module has a doc comment before the module keyword saying why the module exists and citing the decisions it embodies. Every exported unit has a doc comment that says why under rule 8, since the name says what; a type cites the decision that shaped it and a function states the reason or invariant. Non-exported units may have one. Every one of these comments is recorded as pending in the root vetting file, because they were written by an AI and a human vets them.
  opened: 0.1.0
  decided: 0.1.0

DEC-human-sign-off:
  status: decided
  question: Comments are vetted under rule 7, but an AI wrote most of the ledger and the registry and marked decisions decided itself; what does it take for any canonical material to count?
  answer: |
    Rule 9. Every canonical comment, ledger entry, and registry entry has an entry in the vetting file, keyed by decision id, ledger/KEY, or registry/KEY, holding a verdict and a digest of what the material says, so an edit makes the verdict stale. Nothing counts until its verdict is set, and the report is invalid while anything is pending. Whether the material says something true is not decidable by a program, which is Rice's theorem applied to documentation, so the human sign-off is the evidence. canon does not test who signed; it records whoever did: the author of the commit that last touched the verdict line, from git blame, and the co-authors that commit names in its trailers, so an assisted sign-off is visible as such. This extends DEC-comment-vetting to all canonical material.
  opened: 0.1.0
  decided: 0.1.0

DEC-rust-grammar:
  status: decided
  question: How does canon read Rust, given that the grammars-v4 Rust grammar leans on RustLexerBase and RustParserBase predicates canon's interpreter cannot run, and that Rust tells doc comments from plain ones, puts attributes between an item and its doc comment, and documents a module from inside it?
  answer: |
    Through the vendored grammars-v4 Rust grammar under grammars/rust, changed where canon's interpreter or Rust itself requires and each change marked canon: in the grammar. The predicates are replaced in the grammar: a shebang may not continue with [, a float has no bare-dot form so 1..2 and 1.max(2) stay integers, a tuple index may be a float so x.0.1 parses, and shl and shr no longer require touching brackets. A backslash in a string always starts an escape, because the upstream reading let a string end at a later quote under longest match. Outer attributes and visibility move into each kind of item through itemPrefix, so an item's node starts at its first attribute and the comment above binds to it, and each attribute is labeled marker. tokenTree and macroMatch take one token each, because runs of tokens made macro bodies exponential to parse. Bounds on associated types, union as an identifier, && before a type, keywords as macro metavariables, the tilde, and the underscore expression are accepted, as Rust does. The lexer matches Unicode property classes by general category, which Rust identifiers need. A profile's comment syntax gains outerDoc and innerDoc openers: when outer openers are given only a comment opening with one binds to the unit below and a plain comment is neither a Why nor an orphan, and a comment opening with an inner opener binds to the innermost unit enclosing it or to the file, the file's first one ahead of a comment on its first line; adjacent line comments merge only when they open alike. The Rust units are function_, structStruct, tupleStruct, enumeration, union_, trait_, macroRulesDefinition, typeAlias, constantItem, staticItem, inherentImpl, traitImpl, and module, named by their identifier, an inherent impl by its self type; which of them require a comment, the variants and fields that are units too, and how a trait impl is named are recorded in DEC-rust-visibility. The test table gains rust: a function marked #[test], #[tokio::test], #[async_std::test], #[rstest], or #[quickcheck]. The sample is scopeguard 1.2.0, vendored with its licenses rather than a submodule because it is one small file. Unstable syntax such as default fn is not accepted.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-rust, rust-reference-comments, REQ-rust-support]

DEC-csharp-grammar:
  status: decided
  question: How does canon read C#, given that the grammars-v4 C# grammar stops at C# 7, leaves interpolated strings and the preprocessor to a CSharpLexerBase class canon's interpreter cannot run, and puts attributes and modifiers outside the rule of each member, and that C# documents what is visible outside an assembly with /// XML comments above a member's attributes?
  answer: |
    Through the vendored grammars-v4 C# 7 grammar under grammars/csharp, changed where canon's interpreter or modern C# requires and each change marked canon: in the grammar. The base lexer is ported as the Canon.Antlr4.Lex.CSharp hook, selected by the superClass option: it tracks the braces of each interpolation hole so the closing brace returns to the string, switches to the format mode at a colon outside parentheses in a hole, and reads the branches of each #if that a build selects, hiding the others, so the code canon reads is code some build compiles, every branch some build compiles being read in one of the builds DEC-preprocessor-builds records; Canon.Preprocessor holds that policy. A verbatim interpolated string has its own mode instead of predicates; an escape in a string is a backslash and the next character, because hex escapes of one to four digits made the lexer exponential; a raw string without interpolation is one token, and an interpolated raw string has a mode of its own whose holes are parsed, the hook counting the dollars and quotes of its opener; the byte order mark is matched decoded; and the contextual keywords of C# 9 to 14 are tokens that are also identifiers. Attributes and modifiers move into each kind of type and member through member_prefix, so a member's node starts at its first attribute and the comment above binds to it; public and protected are labeled required, so a member visible outside its assembly requires a comment, as the compiler's CS1591 warning asks; each attribute is labeled marker. C# 8 to 14 syntax is added: file-scoped namespaces, top-level statements, records, primary constructors, init and required members, switch and with expressions, ranges, patterns, target-typed new, collection expressions, raw strings, extension blocks, and the rest listed in grammars/csharp/README.md. A profile unit is required when its node holds an element labeled required, as dialect units already were. A profile's comment syntax gains directives: a line opening with one, and where outer doc openers are named a plain comment line, stands between a doc comment and its unit without parting them, as #if and #pragma do in C#: the unit is taken to start above such lines, and a plain comment line is one held by a scanned plain comment that starts its line, one rule that also gives the Elixir behaviour of DEC-elixir-grammar, where a # line between @doc and @spec does not part them; a comment in a branch canon does not read binds to nothing and is no orphan; and a doc opener followed by a slash, or one ending in a star followed by another, opens a plain comment, so //// is not documentation. A ref key ends where markup starts, so ref:KEY</summary> cites KEY. The C# units are namespaces, classes, structs, interfaces, enums, records, delegates, methods, constructors, destructors, properties, indexers, events, operators, fields, constants, enum members, and extension blocks; none is required by its rule, and each is required when public or protected. The test table gains csharp: a method marked [Fact], [Theory], [Test], [TestCase], [TestCaseSource], [TestMethod], or [DataTestMethod], bare or qualified. The parser's predicates are answered by the CSharpParserBase hook DEC-parser-predicates records. The bodies of an interface and of an enum are labeled inherited, so their members require a comment when their container does, as DEC-inherited-label records; private and internal are labeled optional; protected internal is labeled required and private protected optional, in either order. The sample is Ardalis.GuardClauses, its library sources and one test file vendored with its MIT license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-csharp, csharp-xml-documentation, REQ-csharp-support]

DEC-fsharp-grammar:
  status: decided
  question: How does canon read F#, given that grammars-v4 has no F# grammar, that F# ends a declaration by indentation under the offside rule, which no context-free grammar sees, and that F# documents a declaration with /// comments above its attributes and makes every declaration public unless it says otherwise?
  answer: |
    Through an F# grammar written for canon under grammars/fsharp, which parses the declarations that carry documentation, namespaces, modules, let bindings, records and fields, unions and cases, enums, classes, interfaces, delegates, abbreviations, extensions, exceptions, members, constructors, and val declarations, and reads expressions, patterns, and types as runs of tokens kept inside their declaration. The FSharpLexerBase superClass selects the Canon.Antlr4.Lex.FSharp hook, which turns indentation into INDENT, DEDENT, and NEWLINE tokens outside brackets as Python's tokenizer does, and into BRNL tokens inside brackets, which F# lets close at any column, each empty and placed where the last code token ends so it widens no span; it reads the branches of each #if a build selects, as C# does under DEC-preprocessor-builds, and lays out the tokens of a type application such as f< ^a when ... > as inside brackets, so its angle brackets may span lines; a less-than sign is taken for one when it touches the name before it and a greater-than sign closes it before any token a type cannot hold. A type parameter may be quoted in double backticks. A line of a body that starts with let is a local binding, a unit that may have a comment. A union case's fields may continue on indented lines, and an indented with below them begins the union's members. The grammar handles the offside rule's common exceptions at the level of declarations, parameters and constructors on the lines below a name, union cases at the column of type, and match arms at the column of their binding, and reads a line it cannot take as a declaration as an expression rather than failing the file. let rec and is read as one group, so an and that continues a type is never read as a binding. private and internal are labeled optional: a profile unit whose rule requires a comment does not when its node holds an element labeled optional, so a comment is required on functions, types, exceptions, and members that a file exports, and optional on values, abbreviations, extensions, fields, cases, val declarations, class and local bindings, modules, and namespaces. Each attribute is labeled marker. The test table gains fsharp: a function or member marked [<Fact>], [<Theory>], [<Test>], [<TestCase>], [<TestCaseSource>], or [<Property>], bare or qualified, and a function or value marked Expecto's [<Tests>], because the testCase and testProperty inside a test list are expressions, not declarations. The limits are listed in grammars/fsharp/README.md. The sample is Giraffe.ViewEngine, its two source files and its test file vendored with its Apache-2.0 license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-offside-rule, fsharp-xml-documentation, REQ-fsharp-support]

DEC-elixir-grammar:
  status: decided
  question: How does canon read Elixir, given that the grammars-v4 Elixir grammar parses under a quarter of real Elixir files, that Elixir writes documentation as @doc and @moduledoc attributes holding strings rather than as comments, that attributes such as @spec sit between a @doc and its definition, and that a function is several def clauses?
  answer: |
    Through a structural Elixir grammar written for canon under grammars/elixir, from the Elixir syntax reference and the behaviour of Elixir's tokenizer. The grammars-v4 grammar at 7df52be was evaluated and is not vendored: it parsed 71 of 308 files from Jason, Plug, and Phoenix, stopping at newlines before a leading pipe, at quoted keyword keys, at sigils, and inside interpolations. canon's grammar reads statements separated by newlines unless an operator, comma, or keyword continues the line, expressions as chains of operands without precedence, strings and heredocs in lexer modes whose interpolations push the default mode, and sigils as single tokens. Each kind of definition is its own rule and takes the module attributes on the lines directly above it, labeled marker, so its node starts at the first attribute; a documentation attribute with a string value is not taken. test, describe, and property are a token of their own. On that grammar it parses all 308 files, 2.5 MB, in about 20 seconds of process time, none above a second. A profile's comment syntax gains docAttributes, attribute names whose string value canon scans as a block comment from the attribute to the end of the string, with the attribute, a sigil such as ~S, and the delimiters stripped from its body; a string delimiter of three or more characters may span lines. The Elixir profile lists @doc and @typedoc as outer openers and @moduledoc as inner, so @doc binds to the definition below and @moduledoc to the module around it, and a # comment is no documentation. Where outer openers are given, full-line plain comments directly below a doc comment no longer separate it from its unit, and an outer doc comment on a file's first line documents the item below rather than the file. A unit rule gains mergeClauses, which makes adjacent matches with one name a single unit, as a function's clauses are one function, unless a doc comment directly above a later clause starts a unit of its own, as the @doc of another arity does; and several unit rules may name one grammar rule, told apart by their first token, so test and describe are different kinds. The Elixir units are modules, protocols, functions, macros, guards, delegates, and callbacks, which require a comment, and implementations, private functions, macros, and guards, types, structs, exceptions, and describe blocks, which may have one; private definitions are told apart by their keyword. The test table gains elixir: a unit of kind test, which the profile makes of ExUnit's test and StreamData's property; its comment is a @doc above it, which compiles without warning. Lexing a loop over a long literal copied the ends of every later iteration, which made a 20 KB string take seconds; the lexer now appends the shorter end first and returns the last matching alternative uncopied. A definition with a computed name such as def unquote(name)(args) is not a unit, and a blank line separates a @doc from its definition as everywhere in canon. The sample is Jason 1.4.5's formatter and its tests, vendored with Jason's Apache-2.0 license.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-elixir, elixir-syntax-reference, elixir-writing-documentation, REQ-elixir-support]

DEC-gleam-grammar:
  status: decided
  question: How does canon read Gleam, for which no ANTLR grammar exists, given that Gleam documents an item with /// above its attributes and a module with ////, and that gleeunit tests are public functions named for it?
  answer: |
    Through a grammar of Gleam's module level written for canon under grammars/gleam, from the Gleam language tour and the Gleam compiler's parser at v1.19.0. It reads imports, constants, custom types with constructors and labelled fields, type aliases, and functions with their attributes, labeled marker, so an item's node starts at its first attribute; function bodies and parameter lists are balanced brackets, since canon needs items and not expressions, and a function without a body is external. Public and private items are separate rules. It parses all 116 modules of the stdlib, gleam_json, gleam_otp, and wisp, 0.8 MB, in about 4 seconds of process time, and the 239 modules of the Gleam compiler's test projects. The Gleam profile lists /// as the outer opener and //// as the inner one, so /// binds to the item below and //// to the file, and a // comment is no documentation; an outer doc comment on a file's first line documents the item below it, not the file. Public functions, types, and constants require a comment; private ones, constructors, and labelled fields may have one. The test table gains gleam: a function named *_test, which gleeunit runs. The syntax removed before Gleam 1.0, such as external fn, is not accepted. The sample is the stdlib's order and bytes_tree modules and order's tests, vendored with the stdlib's Apache-2.0 licence.
  opened: 0.1.0
  decided: 0.1.0
  refs: [gleam-language-tour, gleam-compiler-parser, gleam-documentation-comments, REQ-gleam-support]

DEC-parser-memory:
  status: decided
  question: The parser kept a memo entry for every rule at every token, and a loop's recursion built a result for every pair of an iteration and a later end, so a 13,000-line C# collection initializer took 10 GB. How does the parser keep its memory linear in the input?
  answer: |
    Three changes, none of which changes a parse. A loop is a depth-first walk over the positions its iterations reach, each position visited once, emitting a position after the ones beyond it when greedy and before them when not; that gives the order, and with one tree per end the trees, that the recursion of alternatives gave, since a position reached again only repeats ends already emitted, and each prefix of children is shared with the one before. The memo table holds an entry only for a rule asked for at a position where its first set admits the token or it is nullable; other rules fail there without an entry, and entries are made on first request in a table private to the parse. A memo entry is a strict, unpacked list of trees and ends, with a rule node's children built when the entry is made and one shared entry per position for a failure that reached no further. On the 13,000-line initializer the model takes 10 seconds and under 1 GB.
  opened: 0.1.0
  decided: 0.1.0
  refs: [warth-2008]

DEC-parser-predicates:
  status: decided
  question: Grammars from grammars-v4 put semantic predicates in parser rules that call into a target-language parser base class, which canon's interpreter has no port of. How are they answered?
  answer: |
    Through a parser hook selected by the parser grammar's superClass option, as lexer actions are answered through a lexer hook. The hook is given the predicate's text, the visible tokens, the index where the invoking rule started, and the index the parse has reached, and says whether the parse may go on; a predicate no hook knows holds. CSharpParserBase is the first port: IsRightArrow, IsRightShift, and IsRightShiftAssignment hold when the two tokens just read touch, and IsLocalVariableDeclaration fails when a declaration's type is var, which allows one declarator.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4-csharp]

DEC-preprocessor-builds:
  status: decided
  question: canon read one branch of each C# and F# #if, the first whose condition held for some choice of symbols, so the code and documentation of every other branch went unread. How does canon read every branch some build compiles?
  answer: |
    By reading a file once per build of a small set that together reads every branch some assignment of symbols reads. A build is an assignment of the symbols the file's conditions name; a symbol the file defines or undefines overrides it from that line on. The builds are picked greedily from all assignments by how many branches not yet read each adds, the first being the one that reads most; a file without #if is read once as before, and beyond twelve symbols the default choice is the only build. Each build's tokens hide the branches it does not read, and extraction merges what each read finds: units by id, the first build's winning, with their children merged and kept in source order, and decisions by id, the first winning. A doc comment is an orphan only when every build that reads it leaves it unbound. A unit declared in two branches is one unit, documented by the comment in the first branch read. A branch no assignment reads, such as #if false, is never read.
  opened: 0.1.0
  decided: 0.1.0
  refs: [csharp-preprocessor-directives]

DEC-inherited-label:
  status: decided
  question: The members of a Rust trait, a Rust enum, a C# interface, and a C# enum say no visibility of their own and are as visible as what holds them. How does a grammar say that their comment is required when their container's is?
  answer: |
    With an element label, inherited, on the part of a unit that holds such members. A unit found under an element labeled inherited requires a comment when the unit enclosing it does, unless its own node holds an element labeled optional, as a private member of a C# interface does. It is the one label whose meaning depends on the enclosing unit; required, optional, and marker are read from the unit's own node. An element labeled optional wins over one labeled required in the same node, so the F# dialect labels every declaration that is public by default required and private optional; a unit whose why element is mandatory is required whatever its node holds. No grammar before these had both labels in one node.
  opened: 0.1.0
  decided: 0.1.0

DEC-rust-visibility:
  status: decided
  question: The Rust profile required a comment on every function, struct, enum, union, trait, and macro whether or not it was pub, named an impl by its self type alone so a type's trait impls were told apart by ordinal, made no units of variants and fields, and the grammars-v4 lexer let an empty // or /// comment run on through the next line. How does canon read what a Rust crate exports?
  answer: |
    As rustc's missing_docs lint does. A bare pub is labeled required, while pub(crate), pub(super), pub(self), and pub(in path) are not, and #[macro_export] is labeled required, so an item, field, or macro visible outside the crate requires a comment; the items of a trait and the variants of an enum are labeled inherited and require one when their trait or enum does; the methods of a trait impl, which the trait documents, and private items may have one. The profile's units are required by none of their rules. Variants and named fields are units named by their identifier, and a tuple field is named by its position from zero, which a profile unit takes from name ordinal. A trait impl is named by its trait and self type, through the traitImplTarget rule, and a name's tokens are run together with a hyphen where the source spaces a word from what follows, so impl Deref for Guard<T, U> is named Deref-for-Guard<T,U> and a unit id holds no space; a Haskell instance head is named the same way. The comment rules no longer let the character after // or /// be a line break, which hid the code on the next line, and //// stays a plain comment. A pub item of a private module still requires a comment, since the grammar does not follow reexports.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rust-missing-docs, rust-reference-comments, REQ-rust-support]

DEC-fsharp-signatures:
  status: decided
  question: An F# signature file declares what its implementation exports and carries its documentation, but canon reported every public binding of an implementation with a .fsi as missing a comment, even when the .fsi documented it. How does canon tie the two?
  answer: |
    A profile names its signatures, a map from the extension of a signature file to the extension of the implementation it declares, as .fsi to .fs. When canon check or canon vet reads both files of a name, a unit of the implementation needs no comment, since the compiler takes the documentation from the signature and what the signature leaves out is private; a unit of the signature needs one when the implementation unit it declares would. Units are matched by the names of the units enclosing them, whatever their kinds, since a val declares a let. A test keeps its own requirement. canon model reads one file and does not link.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-signature-files, REQ-fsharp-support]

DEC-rust-dialect:
  status: decided
  question: What does the canonically commented dialect of the Rust grammar look like, given that Rust doc comments are attributes that may stand wherever an attribute may, that //! documents the module or file around it, and that a tuple field has no name?
  answer: |
    grammars/rust/canonically_commented holds the plain Rust grammar with doc comments as canonical comments on the default channel. The lexer sends /// and /** into DocLine and DocBlock modes and //! and /*! into InnerDocLine and DocBlock, which tokenize prose, ref:KEY, and license:KEY; a following /// or //! line continues a line comment, and //// and /*** stay plain by the longest match. The parser adds canonicalComment, innerComment, and docPart, and labels each item, named field, tuple field, and variant as a unit alternative whose Why is the doc comment above its attributes, of which the last of several in a row binds; a doc comment after an attribute or where only an attribute may stand, as above a statement, a match arm, or a parameter, is an orphan, as rustc warns it is unused, and an inner doc comment binds to the module whose body it opens or, at the top of a file, to the file. A why element of the start rule outside every unit is the file's Why, the first of several binding. A doc comment in a macro's input is a token of it and binds to nothing. A tuple field is named by its position through an element labeled ordinal, which stands for the what of a unit without a name. The /// and //! markers are stripped from a Why like the others. The dialect keeps the plain grammar's required, inherited, and marker labels, so it requires what the profile requires. It binds a doc comment across a blank line, as every dialect does under DEC-comment-attachment, and reads no plain comment as a file's Why. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rust-reference-comments, REQ-rust-support]

DEC-csharp-dialect:
  status: decided
  question: What does the canonically commented dialect of the C# grammar look like, given that an XML doc comment documents the type or member below its attributes and that the compiler accepts one where it documents nothing?
  answer: |
    grammars/csharp/canonically_commented holds the plain C# grammar with /// and /** comments as canonical comments on the default channel. The lexer sends them into DocLine and DocBlock modes, which tokenize prose, markup punctuation, ref:KEY, and license:KEY; a following /// line continues a line comment, //// and /*** stay plain comments, and the lexer hook still hides the branches of an #if a build does not read, doc comments in them included. The parser adds canonicalComment and docPart, and labels each namespace, type, member, and enum member as a unit alternative whose Why is the doc comment above its attributes, of which the last of several in a row binds. A doc comment the compiler warns is on no valid element binds to nothing and is an orphan: one after an attribute, before a statement or a switch section, before a using directive, an extern alias, an assembly attribute, or an accessor, before a parameter, an argument, an initializer's element, or a switch expression's arm, and after the last member of a body or file. A doc comment anywhere else inside an expression fails the parse, as no grammar rule can accept a token everywhere without reading every expression differently. The dialect keeps the plain grammar's required, optional, inherited, and marker labels and its hooks. It binds a doc comment across a blank line, as every dialect does under DEC-comment-attachment. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [csharp-xml-documentation, REQ-csharp-support]

DEC-fsharp-dialect:
  status: decided
  question: What does the canonically commented dialect of the F# grammar look like, given that F# ends a declaration by indentation, that a /// comment is the first thing on its line, and that F# declarations are public unless they say otherwise?
  answer: |
    grammars/fsharp/canonically_commented holds the F# grammar with /// comments as canonical comments on the default channel, sent into a DocLine mode that tokenizes prose, ref:KEY, and license:KEY, a following /// line continuing it and //// staying plain. The FSharpLexerBase hook holds a doc comment's tokens until the next code token has produced its layout tokens and emits them just before it, as the Haskell port does, so a doc comment is never the first token of a line and the offside rule reads the file as it reads it without comments. The parser adds canonicalComment and docPart, and labels each namespace, module, binding, type, field, case, member, constructor, val, and exception as a unit alternative whose Why is the doc comment above its attributes; a case's comment comes before its bar, so the bar is part of the case. A declaration public by default holds the empty rule publicByDefault labeled required, and private and internal are labeled optional, which wins, so the dialect requires what the profile requires. A doc comment after a declaration's attributes, above a line that declares nothing, or inside an expression is an orphan. On the Giraffe.ViewEngine sample it finds the units, requirements, and doc comments the profile finds; only the plain license comment the profile binds to a file is no canonical comment in it. Its rules carry no canonical comments, so the root canon.yaml ignores it like the plain grammar.
  opened: 0.1.0
  decided: 0.1.0
  refs: [fsharp-xml-documentation, fsharp-offside-rule, REQ-fsharp-support]

DEC-vetting-layout:
  status: decided
  question: The vetting ledger of DEC-comment-vetting and DEC-human-sign-off was one canonical_vetting.yaml per project. Rice's Tax, the review tool over canon's material and over wavelet's mutation review, wants a directory per kind and a file per subject so a record sits beside what it judges and every queue shares one layout. Does canon move to that layout?
  answer: |
    Yes. canonical_vetting/ holds a directory per kind and a file per subject. Comment verdicts mirror the source tree under comment/, so the comments of src/Canon/Walk.hs are judged in canonical_vetting/comment/src/Canon/Walk.hs.yaml, keyed by their full decision id so a file reads alone; the ledger's verdicts are in canonical_vetting/ledger/canonical_decisions.yaml and the registry's in canonical_vetting/registry/canonical_refs.yaml. Each file keeps one key per line with the verdict on its own line, so git blame attributes it as before, and co-author lookups are made once per commit across all files. A canonical_vetting.yaml from the single-file layout is refused with the instruction to delete it and ingest again, and every existing ledger, all pending and unsigned apart from one good verdict in the Gson sample that was reapplied, was regenerated by canon ingest. Decided with the owner of Rice's Tax on 2026-09-15.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-vetting-kinds:
  status: decided
  question: Rice's Tax asks a person to judge surviving mutants and to see coverage gaps as work, with wavelet's verdict words. canon's vetting knew four words and three kinds of key. Does canon learn other kinds, or does Rice's Tax keep its own files?
  answer: |
    canon learns kinds, through canon.yaml rather than through code: a project declares each kind another tool raises with its verdict words and what each does, open, closed, work, or deferred. A row of a declared kind is keyed kind/id, lives in canonical_vetting/<kind>/<subject>.yaml, and carries the kind's own word. canon counts an open row as pending so the report is invalid while a mutant is unreviewed, records the signer of every other row, and reports a kind or a word the declaration does not know. It does not raise such rows, judge their staleness, or retire orphans, because it cannot know what a mutant is; the tool that owns the kind does. The digest field of every row is named digest, since it is no longer only a comment's. Decided with the owner of Rice's Tax on 2026-09-16.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-layout-parse-error-rule:
  status: open
  question: The Haskell dialect's layout port closes an implicit block on a dedented where or a brace, but not by Haskell's parse-error rule, so a let in a list-comprehension qualifier followed by a comma on the same line, or a case inside parentheses closed by a bracket, fails to parse. Six of wavelet's files and one of Rice's Tax's hit this on 2026-09-16. How is the parse-error rule brought into the interpreted grammar, given that it needs the parser to tell the lexer a token was rejected?
  opened: 0.1.0
  revisit: 0.2.0
  refs: [rices-tax]

DEC-vetting-run-field:
  status: decided
  question: A verdict on a surviving mutant is made against one run of a mutation tester with a seed, a version, and a toolchain, and a later run may not contain the same mutant. How does a row say which run it was decided against?
  answer: |
    A row may carry a run field naming the run, written by the tool that owns the kind and carried by canon without reading it, one key per line like the rest of the row. What a run is, and where its facts live, is that tool's business; Rice's Tax records each run in mutation_runs.yaml at the project root. Decided with the owner of Rice's Tax on 2026-09-16.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-git-runner:
  status: decided
  question: "Rice's Tax compiles canon to WebAssembly and runs it from Node, where a module cannot start a process. How does canon run git there?"
  answer: |
    Every git call goes through one runner, a directory and arguments in and the output or an error out, held in Canon.Git.Shell and replaceable with setGitRunner. The default runs git as a process as before; a host without processes installs a runner of its own before the first call, and every provider function goes through it unchanged. The Haskell dialect grammar now accepts NOINLINE and INLINE pragmas on names, which the runner's holder needs. Decided with the owner of Rice's Tax on 2026-09-18.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-more-languages:
  status: decided
  question: JavaScript, TypeScript, Python, Go, and Kotlin are to be canonical languages. Their grammars-v4 grammars lex identifiers with Unicode property classes, import a second grammar, decide regular expressions and template strings with semantic predicates in a base class, and leave Python's indentation to one. What does canon's interpreter need?
  answer: |
    Four things, each general rather than per language. Unicode property classes in character sets, by general category and the few named properties the grammars use. Grammar imports, read from beside the importing file and appended after its rules so its definitions win, as ANTLR resolves them. Semantic predicates in lexer rules asked of the hooks, with the matched text and the start offset, so a base lexer port answers them and a grammar without hooks still has every predicate hold; and the action hook given two characters of lookahead, which Python's newline needs. Then three base lexers ported as hooks: JavaScriptLexerBase and TypeScriptLexerBase, which track the last token for regular expressions, brace depth for template strings, and strict mode; and Python3LexerBase, which turns newlines into NEWLINE, INDENT, and DEDENT. Go needs only the property classes and Kotlin only the imports. Parser-side predicates stay assumed true. Set as a goal by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [grammars-v4]

DEC-canon-is-the-format:
  status: decided
  question: "Rice's Tax had begun to grow its own files for the runtime and the mutation runs. What format do canon and the three Rice's Tax verbs share?"
  answer: |
    canon's. Every parameter and every ledger is a canon file read and written through this library: canon.yaml carries the languages, the kinds, and a runtime section canon does not read; canonical_refs.yaml, canonical_decisions.yaml, and canonical_vetting/ stay as they are; runs live in canonical_runs.yaml and exemptions in canonical_exemptions.yaml. Decided by the owner in Rice's Tax on 2026-09-17 and recorded there in full; canon carries the entry because its code cites it.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-exemptions:
  status: decided
  question: A project just imported, or a vendored part of one, owes thousands of rows nobody can vet yet. ignore hides the debt, and deferring rows one at a time does not scale. How does a project opt a subject out for a while?
  answer: |
    Rule 10 and canonical_exemptions.yaml, one entry per exempt subject: a path pattern in gitignore form or a unit or ledger key, optionally the kinds it covers, a reason, and the version to revisit by, signed by git blame like every other row. canon check reports covered material as exempt rather than pending, still counts it so the size of the debt is known, and fails once the project reaches the revisit version, as an open decision past its revisit fails. An exemption is Rule 3's not-yet-canonical given a canonical place and an expiry. Decided by the owner in Rice's Tax on 2026-09-17 and recorded there in full.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-binding-label:
  status: decided
  question: A Haskell function unit was its type signature, so canon had no body for it, its span ended at the signature, and its How was the type. Rice's Tax needs the body as the second side of a What verdict. Where does the body come from?
  answer: |
    The dialect labels a function's type as signature and each following top-level binding as binding, and the extractor attaches every binding to the nearest preceding unit at the same level with its name, joining adjacent symbol tokens for an operator and reading the word in backticks. The unit's How is then its equations from the first to the last, comments inside included, its span ends at its last real token, and its What carries the signature text. A unit without bindings keeps its labeled How, or its own text after its comment, so a How never contains the Why. A binding that matches no unit is not a unit, as before. Known limits: a shared signature names only its first variable, pattern bindings match nothing, and class default methods stay unbound. Decided with the owner of Rice's Tax on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-name-kind:
  status: decided
  question: Rice's Tax raises a What row for every unit that requires a comment, in every project, and a project silences it with an exemption rather than by leaving the kind undeclared. canon reports an undeclared kind as a finding no exemption can cover. How does canon know the kind?
  answer: |
    name is a built-in kind with canon's four words, present in every configuration under whatever the project declares. canon raises no row of it and judges none, as DEC-vetting-kinds says of every foreign kind; knowing it only means a row keyed name/<unit id> is pending while open, signed like any other, and coverable by an exemption for the kind name. Decided with the owner of Rice's Tax on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-folio-language:
  status: decided
  question: The owner wants literate programming in wavelet's style, as its own thing with its own name and grammar, fitting Diátaxis and deterministic generation. What is the form, and how does canon read it?
  answer: |
    The Folio: Markdown with front matter naming a page's id, kind, and title, prose that cites with ref:KEY, and fenced blocks whose info string names the file they tangle to and what they define. canon reads it with a grammar of its own, interpreted like every other: one token per line decided by longest match and rule order, so a heading, a fence, a front-matter delimiter, and a prose line are each a token, and a fence pushes a mode in which only its closer ends the block. Heading depth, front-matter fields, info-string attributes, and citations are read from token text. Files keep the .md suffix so editors and forges render them; the name is the form's. Decided by the owner on 2026-09-19, who chose the name.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax, diataxis]

DEC-tangle-in-canon:
  status: decided
  question: wavelet tangled its pages with a tangler of its own, and attested prose-and-code pairs in a lock file. Where does tangling live once canon reads the pages?
  answer: |
    In canon, in Haskell, as canon tangle, ported from wavelet's tangler so the first regeneration of its tree changes nothing but the comments the port now generates for scaffolding blocks that carry prose. One parser both reviews and tangles, and it compiles to WebAssembly with the rest, so Rice's Tax reaches it as ricestax canon tangle. canon check reports a tangled file that differs from its pages, so a forgotten tangle fails the check. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-units-by-tangled-path:
  status: decided
  question: A unit found by parsing a tangled file could be named by the page that produced it or by the file it was tangled to. Which?
  answer: |
    By the tangled file, with its Where naming the page. Name uniqueness and the export rule are decided per module, a page may tangle into several files and a file may be tangled from several pages, and a unit id stays path-based as every other is. Every existing verdict keeps its key across the move from a source tree to pages; only the file it sits in changes, since that follows the Where.
  opened: 0.1.0
  decided: 0.1.0

DEC-section-prose-is-why:
  status: decided
  question: wavelet's form forbids a comment inside a block and canon's Rule 8 requires a canonical comment on every unit that needs one. How do the two agree?
  answer: |
    The prose of the section above a block is the Why of every unit the block holds. Tangling writes it as the generated documentation comment, so the tangled file satisfies the rule; extraction through the pages replaces each generated comment's decision with that prose as authored, covering each unit in the block, so the digest a verdict is judged against is of the page. A block whose section carries no prose leaves its units without a Why, and that is reported, as it should be.
  opened: 0.1.0
  decided: 0.1.0

DEC-docs-tree:
  status: decided
  question: Rule 2 allowed one README per project and no other Markdown outside to_be_removed. Where do tutorials, how-to guides, reference, and explanation live?
  answer: |
    In a docs/ tree per project, split by Diátaxis into docs/tutorials, docs/how-to, docs/reference, and docs/explanation, each page in the Folio with a kind that matches its directory. Rule 2 is amended to say so. Every other Markdown file outside to_be_removed stays forbidden, and the project's canon.yaml ignores the ones that are not pages. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0
  refs: [diataxis]

DEC-doc-kind:
  status: decided
  question: A page is canonical material, but of what kind, and what is judged?
  answer: |
    The kind doc: a page is one unit of that kind, named by its id, with one decision whose Why is all its prose and citations, plus the video it names. Its verdict is keyed doc/<path> under canonical_vetting/doc/, with the same four words as a comment, and it goes stale when the prose changes. An exemption covers a page by its path for the kind doc. Rice's Tax lists a page in the Why queue.
  opened: 0.1.0
  decided: 0.1.0

DEC-video-reference:
  status: decided
  question: The owner wants videos alongside the written tutorials and how-to guides, as a second medium for the same material. Is a video required, and how is it named?
  answer: |
    Optional. A page may carry video: KEY in its front matter, naming a registry entry of kind video whose locator is the video's address; the key joins the page's citations, so a missing entry is an unresolved reference and an entry of another kind is reported. Nothing is raised when a page names no video. Decided by the owner on 2026-09-19.
  opened: 0.1.0
  decided: 0.1.0

DEC-rule-identifiers-as-keys:
  status: decided
  question: wavelet names its rules by dotted paths such as snf.identity.never-evaluates. Can a page cite one?
  answer: |
    Yes, as ref:snf.identity.never-evaluates against a registry entry of that key, since a reference key already admits dots and hyphens; no new syntax is needed.
  opened: 0.1.0
  decided: 0.1.0

DEC-header-blocks-documented:
  status: decided
  question: wavelet's tangler wrote no comment for a scaffolding block, so a tangled module had no comment and canon reported every module. Does the port keep that?
  answer: |
    No. A scaffolding block whose section carries prose gets the generated comment too, placed after any pragmas the block begins with so it precedes the module line, which gives a module unit its Why. Scaffolding under a heading with no prose stays as it was, so wavelet's tree changes only where a page already documented its header.
  opened: 0.1.0
  decided: 0.1.0

DEC-tangle-output-format:
  status: decided
  question: What does a tangled file look like, so two runs are one file?
  answer: |
    A three-line banner naming the pages, blank, then for each block in page order its generated comment, its body, and a blank line, trailing blanks trimmed. The comment is the prose converted for the comment's markup, wrapped to the width less the opener, a blank line, and the address of its section, spelled by the embedding in canon.yaml. No version and no date, so a rebuild never churns.
  opened: 0.1.0
  decided: 0.1.0

DEC-site-renderer:
  status: decided
  question: The pages are to be published as ricestax.org. What renders them?
  answer: |
    canon's own renderer, small and complete for what pages use, so it compiles to WebAssembly and two renders are one site: one HTML page per document under its quadrant and an index of the four, with a fixed stylesheet inline, citations linked to what they cite, and a video embedded when canon knows the host. No Markdown library, since none is proven on the wasm toolchain and a renderer canon does not own cannot promise determinism.
  opened: 0.1.0
  decided: 0.1.0
  refs: [rices-tax]

DEC-canon-self-folio:
  status: open
  question: Rice's Tax's sources become Folio pages. Do canon's?
