version: 0.1.0
registry: canonical_refs.yaml
decisions: canonical_decisions.yaml
ignore:
  - grammars/*/*.g4
  - "!grammars/antlr4/*.g4"
  - "!grammars/java/*.g4"
  - "!grammars/haskell/*.g4"
  - grammars/rust/canonically_commented/
  - grammars/csharp/canonically_commented/
  - grammars/fsharp/canonically_commented/
  - grammars/groovy/canonically_commented/
  - grammars/kotlin/canonically_commented/
  - grammars/clojure/canonically_commented/
  - grammars/prolog/canonically_commented/
  - grammars/javascript/canonically_commented/
  - grammars/typescript/canonically_commented/
  - grammars/golang/canonically_commented/
  - grammars/python/canonically_commented/
  - "!grammars/folio/*.g4"
  - "!grammars/make/canonically_commented/*.g4"
  - "*.md"
  - "!docs/**/*.md"
languages:
  folio:
    extensions: [.md]
    lexer: grammars/folio/FolioLexer.g4
    parser: grammars/folio/FolioParser.g4
    start: document
    embeds:
      haskell:
        language: haskell
        comments: {line: "--", blockOpen: "{-", blockClose: "-}", strings: ["\""]}
        width: 98
        doc: {open: "-- | ", continue: "-- ", blank: "--", banner: "-- ", markup: haddock}
  haskell:
    extensions: [.hs]
    lexer: grammars/haskell/canonically_commented/HaskellLexer.g4
    parser: grammars/haskell/canonically_commented/HaskellParser.g4
    start: module
  make:
    extensions: [Makefile]
    lexer: grammars/make/canonically_commented/MakefileLexer.g4
    parser: grammars/make/canonically_commented/MakefileParser.g4
    start: makefile
    highlight: {meta: [IFEQ, IFDEF, ELSE, INCLUDE, DEFINE, ENDEF], comment: [HELP], string: [VALUE], type: [SPECIAL], plain: [NAME]}
  antlr4:
    extensions: [.g4]
    lexer: grammars/antlr4/canonically_commented/ANTLRv4Lexer.g4
    parser: grammars/antlr4/canonically_commented/ANTLRv4Parser.g4
    start: grammarSpec
parity:
  current: [python, javascript, typescript, go, java, kotlin, rust, haskell]
  planned: [erlang, elixir, gleam, csharp, fsharp, scala, groovy, clojure, prolog, hcl, yaml, antlr4, make, folio]
  pending:
    erlang: [dialect]
    elixir: [dialect]
    gleam: [dialect]
    scala: [grammar, profile, dialect, sample]
    hcl: [grammar, profile, dialect, sample]
    yaml: [grammar, profile, dialect, sample]
