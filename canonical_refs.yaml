  kind: article
  title: C# language reference, Documentation comments, on /// and /** XML doc comments and where they attach
  locator: https://learn.microsoft.com/dotnet/csharp/language-reference/xmldoc/
REQ-csharp-support:
  kind: requirement
  title: canon reads C#, parsing every C# 7 to 14 source file, taking namespaces, types, and members as units, binding /// and /** to the declaration below its attributes, requiring a comment on what is public or protected, reading one branch of each #if, and recognising xUnit, NUnit, and MSTest test methods by their attribute
  locator: README.md
fsharp-xml-documentation:
  kind: article
  title: F# language guide, XML documentation, on /// doc comments and where they attach
  locator: https://learn.microsoft.com/dotnet/fsharp/language-reference/xml-documentation
fsharp-offside-rule:
  kind: article
  title: F# language specification, the offside rule for indentation-aware syntax
  locator: https://fsharp.github.io/fslang-spec/lexical-filtering/
REQ-fsharp-support:
  kind: requirement
  title: canon reads F#, parsing F# source files by its offside rule, taking namespaces, modules, bindings, types, members, fields, and cases as units, binding /// to the declaration below its attributes, requiring a comment on what is not private or internal, reading one branch of each #if, and recognising xUnit, NUnit, FsCheck, and Expecto tests by their attribute
  locator: README.md
