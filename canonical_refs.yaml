  title: The Rust Reference, Comments, on outer and inner doc comments
  locator: https://doc.rust-lang.org/reference/comments.html
REQ-rust-support:
  kind: requirement
  title: canon reads Rust, parsing every stable Rust source file, taking functions, types, traits, impls, modules, constants, statics, and macros as units, binding /// to the item below its attributes and //! to the enclosing module or file, and recognising test functions by their attribute
  locator: README.md
grammars-v4-csharp:
  kind: package
  title: The grammars-v4 C# 7 grammar, CSharpLexer.g4 and CSharpParser.g4, MIT and EPL-1.0, at commit 7df52be94698550d219d299d04105c6bafadd9c3
  locator: https://github.com/antlr/grammars-v4/tree/7df52be94698550d219d299d04105c6bafadd9c3/csharp/v7
csharp-xml-documentation:
  kind: article
  title: C# language reference, Documentation comments, on /// and /** XML doc comments and where they attach
  locator: https://learn.microsoft.com/dotnet/csharp/language-reference/xmldoc/
REQ-csharp-support:
  kind: requirement
  title: canon reads C#, parsing every C# 7 to 14 source file, taking namespaces, types, and members as units, binding /// and /** to the declaration below its attributes, requiring a comment on what is public or protected, reading one branch of each #if, and recognising xUnit, NUnit, and MSTest test methods by their attribute
  locator: README.md
fsharp-xml-documentation:
  kind: article
  title: F# language guide, XML documentation, on /// doc comments and where they attach
  locator: https://learn.microsoft.com/dotnet/fsharp/language-reference/xml-documentation
fsharp-offside-rule:
  kind: article
  title: F# language specification, the offside rule for indentation-aware syntax
  locator: https://fsharp.github.io/fslang-spec/lexical-filtering/
REQ-fsharp-support:
  kind: requirement
  title: canon reads F#, parsing F# source files by its offside rule, taking namespaces, modules, bindings, types, members, fields, and cases as units, binding /// to the declaration below its attributes, requiring a comment on what is not private or internal, reading one branch of each #if, and recognising xUnit, NUnit, FsCheck, and Expecto tests by their attribute
  locator: README.md
grammars-v4-elixir:
  kind: package
  title: The grammars-v4 Elixir grammar, ElixirLexer.g4 and ElixirParser.g4, MIT, at commit 7df52be94698550d219d299d04105c6bafadd9c3, evaluated and not vendored
  locator: https://github.com/antlr/grammars-v4/tree/7df52be94698550d219d299d04105c6bafadd9c3/elixir
elixir-syntax-reference:
  kind: article
  title: The Elixir syntax reference, on the forms canon's Elixir grammar reads
  locator: https://hexdocs.pm/elixir/syntax-reference.html
elixir-writing-documentation:
  kind: article
  title: Writing documentation in Elixir, on @moduledoc, @doc, and @typedoc
  locator: https://hexdocs.pm/elixir/writing-documentation.html
REQ-elixir-support:
  kind: requirement
  title: canon reads Elixir, parsing real Elixir source files, taking modules, protocols, implementations, functions, macros, guards, delegates, structs, exceptions, types, callbacks, and ExUnit tests and describe blocks as units, merging the clauses of a function, binding @doc and @typedoc to the definition below its attributes and @moduledoc to the enclosing module, and treating a # comment as no documentation
  locator: README.md
gleam-language-tour:
  kind: article
  title: The Gleam language tour, on the module-level syntax canon's Gleam grammar reads
  locator: https://tour.gleam.run/
gleam-compiler-parser:
  kind: package
  title: The parser of the Gleam compiler at v1.19.0, Apache-2.0, the reference for canon's Gleam grammar
  locator: https://github.com/gleam-lang/gleam/tree/v1.19.0/compiler-core/src/parse
gleam-documentation-comments:
  kind: article
  title: The Gleam language tour, Documentation comments, on /// and ////
  locator: https://tour.gleam.run/functions/documentation-comments/
REQ-gleam-support:
  kind: requirement
  title: canon reads Gleam, parsing every Gleam module, taking functions, types, constructors, labelled fields, and constants as units, requiring a comment on public functions, types, and constants, binding /// to the item below its attributes and //// to the file, and recognising gleeunit test functions by their _test suffix
  locator: README.md
hcl-native-syntax-spec:
  kind: article
  title: The HCL native syntax specification, on the bodies, blocks, expressions, templates, and comments canon's HCL grammar reads
  locator: https://github.com/hashicorp/hcl/blob/main/hclsyntax/spec.md
terraform-language-docs:
  kind: article
  title: The Terraform language documentation, on resource, data, module, variable, output, provider, locals, terraform, and check blocks and the description argument of variables and outputs
  locator: https://developer.hashicorp.com/terraform/language
terraform-test-docs:
  kind: article
  title: The Terraform test documentation, on .tftest.hcl files and their run blocks
  locator: https://developer.hashicorp.com/terraform/language/tests
grammars-v4-terraform:
  kind: package
  title: The grammars-v4 Terraform grammar, terraform.g4, BSD-3-Clause, at commit 7df52be94698550d219d299d04105c6bafadd9c3, evaluated and not vendored
  locator: https://github.com/antlr/grammars-v4/tree/7df52be94698550d219d299d04105c6bafadd9c3/terraform
REQ-hcl-support:
  kind: requirement
  title: canon reads HCL, parsing Terraform configurations, variable files, and other .hcl files, taking each top-level block as a unit named by its labels joined with a dot and each entry of a locals block as a unit, binding a comment to the block directly below it, reading the description of a variable or an output as its Why, requiring a Why on variables and outputs, and recognising the run blocks of a Terraform test file as tests
  locator: README.md
yaml-1-2-spec:
  kind: article
  title: YAML Ain't Markup Language version 1.2.2, the specification canon's YAML grammar reads the block structure of
  locator: https://yaml.org/spec/1.2.2/
pulumi-yaml-reference:
  kind: article
  title: The Pulumi YAML language reference, on the resources, variables, outputs, and config sections of a Pulumi YAML program
  locator: https://www.pulumi.com/docs/iac/languages-sdks/yaml/yaml-language-reference/
pulumi-project-file:
  kind: article
  title: The Pulumi project file reference, on Pulumi.yaml, its config declarations with type, default, and description, and the main option that names a Main.yaml
  locator: https://www.pulumi.com/docs/iac/concepts/projects/project-file/
REQ-pulumi-yaml-support:
  kind: requirement
  title: canon reads Pulumi YAML programs, owning Pulumi.yaml, Main.yaml, and stack files by name, taking each resource, variable, output, and config key as a unit named by its key, binding a comment to the entry directly below it, reading the description of a config key as its Why, and requiring a Why on outputs and on config keys that declare a type or a default
  locator: README.md
