version: 0.1.0
root: source
languages:
  erlang:
    extensions: [.erl, .hrl, .escript]
    grammar: ../../grammars/erlang/Erlang.g4
    start: forms
    comments:
      line: "%"
      innerDoc: ["-moduledoc"]
      docAttributes: ["-moduledoc", "-doc"]
      strings: ["\"\"\"\"", "\"\"\"", "\""]
    units:
      - rule: functionDefinition
        kind: function
        name: {rule: definedName}
        required: true
      - rule: typeAttribute
        kind: type
        name: {rule: definedName}
        required: false
        firstToken: {token: TokAtom, oneOf: [type, opaque, nominal]}
      - rule: recordAttribute
        kind: record
        name: {rule: definedName}
        required: false
        firstToken: {token: TokAtom, oneOf: [record]}
      - rule: callbackAttribute
        kind: callback
        name: {rule: specFun}
        required: true
