snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/58.yaml

# GHC 9.14.1 replaces the snapshot's 9.10.3, whose runtime can lose the wakeup of a thread blocked
# on a black hole (GHC #26324) and hang a parallel run. No Stackage snapshot ships 9.14 yet, so the
# boot packages that the snapshot pins for 9.10 and that 9.14 needs newer are extra-deps. Cabal
# stays at 3.16: cabal-doctest 1.0.12 does not build against 3.18. ref:DEC-ghc-9-14
compiler: ghc-9.14.1

packages:
- .

extra-deps:
- grammatical-parsers-0.7.2.1
- Cabal-3.16.0.0
- Cabal-syntax-3.16.0.0
- directory-1.3.11.0
- process-1.6.30.0

allow-newer: true

flags:
  process:
    os-string: true

# GHC 9.14.1's Float inwards pass can capture an exit join point and build ill-typed
# Core that computes wrong results at -O1, so it is off for every package, dependencies
# included, until a fixed GHC ships. ref:DEC-ghc-9-14
ghc-options:
  "$everything": -fno-float-in
